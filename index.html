<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VDB Music</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="icon" href="fav56.png" type="image/png">
    <link rel="apple-touch-icon" href="fav56.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== RESET E BASE ===== */
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
        html,body{height:100%;margin:0;padding:0;background:#000;overflow:hidden;position:fixed;width:100%;top:0;left:0}
        body{background:#000;overflow:hidden}
        :root{--neon-cyan:#00f3ff;--neon-pink:#ff2d7f}

        /* ===== LOADING ===== */
        #loadingScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;z-index:99999;color:var(--neon-cyan);flex-direction:column;gap:10px}
        #loadingScreen i{font-size:3rem;color:var(--neon-cyan);animation:spin 1.5s infinite}
        @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

        /* ===== PLAYER ===== */
        #playerContainer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:10;display:none}
        #playerContainer.visible{display:block}

        .media-container{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0;background:#000;overflow:hidden}
        .media-container video,.media-container img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:0;z-index:1;transition:opacity 1s ease}
        .media-container .active{opacity:1;z-index:3}
        .media-container .inactive{opacity:0;z-index:0}

        /* ===== TOP BAR REFATORADO ===== */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 35;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
            height: 44px;
            gap: 6px;
        }

        /* Grupo esquerdo */
        .top-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .top-left .genre-badge {
            font-size: 0.75rem;
            font-weight: bold;
            color: #ffd700;
            cursor: pointer;
            background: rgba(0,0,0,0.4);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255,215,0,0.2);
            white-space: nowrap;
        }

        .top-left .genre-badge:active {
            transform: scale(0.95);
        }

        /* Grupo centro - timer */
        .top-center {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }

        .top-center .timer-top {
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--neon-cyan);
            background: rgba(0,0,0,0.3);
            padding: 2px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }

        .top-center .audio-status {
            font-size: 0.6rem;
            color: #666;
            background: rgba(0,0,0,0.3);
            padding: 2px 10px;
            border-radius: 20px;
            white-space: nowrap;
            display: none; /* Escondido por padrão, ativado com classe */
        }

        .top-center .audio-status.active {
            display: inline-block;
            color: #4ade80;
        }

        /* Grupo direito */
        .top-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .top-right .fav-btn {
            background: rgba(255,45,127,0.12);
            border: 1px solid rgba(255,45,127,0.25);
            color: #ff2d7f;
            padding: 2px 8px;
            border-radius: 30px;
            font-size: 0.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
            font-weight: bold;
            white-space: nowrap;
        }

        .top-right .fav-btn .badge {
            background: #ff2d7f;
            color: #000;
            border-radius: 50%;
            padding: 0 5px;
            font-size: 0.55rem;
            font-weight: bold;
            min-width: 16px;
            text-align: center;
        }

        .top-right .fav-btn:active {
            transform: scale(0.92);
        }

        .top-right .menu-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .top-right .menu-btn:active {
            background: rgba(255,255,255,0.2);
        }

        /* ===== LETREIRO EDITÁVEL ===== */
        .info-scroll {
            position: fixed;
            top: 44px;
            left: 0;
            right: 0;
            z-index: 30;
            padding: 4px 10px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .info-scroll .letreiro {
            color: #fff;
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            animation: scrollText 12s linear infinite;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(0,243,255,0.2);
        }

        @keyframes scrollText {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* ===== NOW PLAYING ===== */
        .now-playing {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        .now-playing .music-title {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(0,0,0,0.9);
            margin-bottom: 4px;
        }

        .now-playing .music-artist {
            color: #aaa;
            font-size: 0.85rem;
            text-shadow: 0 0 30px rgba(0,0,0,0.9);
        }

        .fav-heart {
            font-size: 3.5rem;
            color: rgba(255,255,255,0.25);
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            display: inline-block;
        }

        .fav-heart.active {
            color: #ff2d7f;
            animation: heartBeat 0.3s ease;
        }

        .fav-heart:active {
            transform: scale(1.2);
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* ===== BOTTOM CONTROLS ===== */
        .bottom-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(16px);
            padding: 8px 16px 14px;
            z-index: 20;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bottom-controls.visible {
            transform: translateY(0);
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #999;
            margin-bottom: 4px;
        }

        .progress-bar {
            height: 3px;
            background: rgba(255,255,255,0.12);
            cursor: pointer;
            border-radius: 2px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            width: 0%;
            border-radius: 2px;
            transition: width 0.1s;
        }

        .buttons-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-top: 6px;
        }

        .ctrl-btn {
            background: rgba(255,255,255,0.06);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-btn:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.15);
        }

        .play-big {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            width: 50px;
            height: 50px;
            font-size: 1.3rem;
            color: #000;
            border: none;
            border-radius: 50%;
        }

        .play-big:active {
            transform: scale(0.92);
        }

        .shuffle-btn {
            background: rgba(255,255,255,0.06);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .shuffle-btn.active {
            background: rgba(0,243,255,0.2);
            color: var(--neon-cyan);
        }

        .shuffle-btn:active {
            transform: scale(0.92);
        }

        /* ===== MENU POPUP ===== */
        .menu-popup {
            position: fixed;
            top: 44px;
            right: 8px;
            background: rgba(10,10,30,0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 8px;
            z-index: 32;
            display: none;
            flex-direction: column;
            gap: 2px;
            border: 1px solid rgba(0,243,255,0.15);
            min-width: 160px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .menu-popup.open {
            display: flex;
        }

        .menu-popup button {
            background: transparent;
            border: none;
            color: #ddd;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-popup button:active {
            background: rgba(255,255,255,0.08);
        }

        /* ===== FAB ===== */
        .fab-container {
            position: fixed;
            bottom: 100px;
            right: 14px;
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .fab-main {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 1.1rem;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .fab-main:active {
            transform: scale(0.92);
        }

        .fab-sub {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 6px;
            display: none;
            flex-direction: column;
            gap: 2px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .fab-sub.open {
            display: flex;
        }

        .fab-sub-btn {
            background: transparent;
            border: none;
            color: #ddd;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fab-sub-btn:active {
            background: rgba(255,255,255,0.08);
        }

        /* ===== GENRES MODAL ===== */
        .genres-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10,10,30,0.97);
            backdrop-filter: blur(20px);
            border-radius: 25px 25px 0 0;
            padding: 16px 20px 20px;
            z-index: 2000;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 60vh;
            overflow: hidden;
        }

        .genres-modal.open {
            transform: translateY(0);
        }

        .genres-modal h3 {
            text-align: center;
            margin-bottom: 12px;
            font-size: 1.1rem;
            color: var(--neon-cyan);
            letter-spacing: 1px;
        }

        .genres-grid {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            gap: 8px;
            padding: 4px;
            max-height: 38vh;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .genres-grid::-webkit-scrollbar {
            display: none;
        }

        .genre-card {
            min-height: 52px;
            scroll-snap-align: center;
            flex-shrink: 0;
            border-radius: 14px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            letter-spacing: 0.3px;
        }

        .genre-card:active {
            transform: scale(0.96);
            background: rgba(255,255,255,0.1);
        }

        .close-genres {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            border: none;
            border-radius: 25px;
            color: #000;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 700;
            margin-top: 12px;
            letter-spacing: 0.5px;
        }

        .close-genres:active {
            transform: scale(0.97);
        }

        /* ===== FAVORITES MODAL ===== */
        .fav-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10,10,30,0.98);
            border-radius: 20px;
            padding: 20px;
            z-index: 5000;
            width: 90%;
            max-width: 380px;
            text-align: center;
            display: none;
            border: 1px solid rgba(255,45,127,0.2);
        }

        .fav-modal.open {
            display: block;
            animation: modalFade 0.3s ease;
        }

        @keyframes modalFade {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .fav-modal h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--neon-cyan);
        }

        .fav-modal .close-fav {
            position: absolute;
            top: 10px;
            right: 12px;
            background: transparent;
            border: none;
            color: #666;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .fav-list {
            max-height: 50vh;
            overflow-y: auto;
            text-align: left;
            padding: 0 5px;
        }

        .fav-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: white;
            cursor: pointer;
            border-radius: 8px;
        }

        .fav-item:active {
            background: rgba(255,255,255,0.05);
        }

        .fav-item .fav-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .fav-item .fav-info .title {
            font-weight: bold;
            font-size: 0.85rem;
        }

        .fav-item .fav-info .artist {
            font-size: 0.7rem;
            color: #888;
        }

        .fav-item .remove {
            background: transparent;
            border: none;
            color: #ff2d7f;
            font-size: 1rem;
            cursor: pointer;
            padding: 0 6px;
        }

        .fav-empty {
            color: #666;
            padding: 30px;
            text-align: center;
            font-size: 0.85rem;
        }

        .fav-modal .close-btn {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            border: none;
            padding: 10px;
            border-radius: 20px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        .fav-modal .close-btn:active {
            transform: scale(0.97);
        }

        /* ===== FEEDBACK ===== */
        .feedback-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10,10,30,0.98);
            border-radius: 20px;
            padding: 20px;
            z-index: 5000;
            width: 90%;
            max-width: 380px;
            text-align: center;
            display: none;
            border: 1px solid rgba(0,243,255,0.15);
        }

        .feedback-modal.open {
            display: block;
            animation: modalFade 0.3s ease;
        }

        .feedback-modal h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--neon-cyan);
        }

        .feedback-modal .stars {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 6px 0;
        }

        .feedback-modal .star {
            font-size: 1.6rem;
            color: #444;
            cursor: pointer;
            transition: color 0.2s;
        }

        .feedback-modal .star.active {
            color: #ffd700;
        }

        .feedback-modal textarea {
            width: 100%;
            height: 50px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(0,243,255,0.15);
            border-radius: 12px;
            padding: 8px;
            color: #fff;
            resize: none;
            font-size: 0.8rem;
            margin-top: 6px;
        }

        .feedback-modal .btn-feedback {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            border: none;
            padding: 10px;
            border-radius: 20px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
        }

        .feedback-modal .btn-feedback:active {
            transform: scale(0.97);
        }

        #closeFeedbackBtn {
            background: transparent;
            border: none;
            color: #666;
            padding: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        /* ===== NOTIFICATION ===== */
        .notification {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            color: var(--neon-cyan);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.75rem;
            z-index: 10001;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            border: 1px solid rgba(0,243,255,0.1);
            white-space: nowrap;
        }

        .notification.show {
            opacity: 1;
        }

        /* ===== LOADING OVERLAY ===== */
        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 9998;
            align-items: center;
            justify-content: center;
        }

        #loadingOverlay.active {
            display: flex;
        }

        #loadingOverlay i {
            font-size: 2.5rem;
            color: var(--neon-cyan);
            animation: spin 1s infinite;
        }

        /* ===== BLOCK OVERLAY ===== */
        #blockOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 10000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }

        #blockOverlay.active {
            display: flex;
        }

        #blockOverlay h2 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        #blockOverlay p {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        #blockOverlay .preco-vitalicio {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #000;
            padding: 4px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            display: inline-block;
            margin-bottom: 8px;
        }

        #blockOverlay .btn-comprar {
            background: linear-gradient(135deg, #25d366, #128C7E);
            border: none;
            padding: 12px 28px;
            border-radius: 35px;
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 6px;
        }

        #blockOverlay .btn-pix {
            background: rgba(255,255,255,0.06);
            border: 1px solid #00f3ff;
            padding: 10px 22px;
            border-radius: 35px;
            color: #00f3ff;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        #blockOverlay .senha-input {
            width: 100%;
            max-width: 270px;
            padding: 10px 15px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 0.95rem;
            text-align: center;
            margin: 8px 0;
            outline: none;
        }

        #blockOverlay .senha-input:focus {
            border-color: var(--neon-cyan);
        }

        #blockOverlay .btn-senha {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            border: none;
            padding: 10px 28px;
            border-radius: 35px;
            color: #000;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        #blockOverlay .erro-senha {
            color: #ff2d7f;
            font-size: 0.8rem;
            min-height: 16px;
            margin-top: 4px;
        }

        /* ===== ADMIN PANEL ===== */
        #adminPanel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;

        if (src.startsWith('http')) return [src];
        const nome = src.replace(/^\.\//, '').replace(/[^a-zA-Z0-9\-_.]/g, '');
        const repo = REPOS[musica.genero] || 'play12';
        const urls = [
            'https://raw.githubusercontent.com/radiolojasjc-hub/' + repo + '/refs/heads/main/' + nome + '?_=' + VERSAO
        ];
        TODOS_REPOS.forEach(r => {
            if (r !== repo) {
                urls.push('https://raw.githubusercontent.com/radiolojasjc-hub/' + r + '/refs/heads/main/' + nome + '?_=' + VERSAO);
            }
        });
        urls.push(src + '?_=' + VERSAO);
        return urls;
    }

    async function carregarPlaylist(genero) {
        const url = GENRE_URLS[genero];
        if (!url) return null;
        try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 15000);
            const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });
            clearTimeout(timeout);
            let data = await response.json();
            if (!Array.isArray(data)) {
                data = data.musicas || data.data || Object.values(data)[0];
            }
            const musicas = data.filter(m => m.src && m.title).map(m => ({
                ...m,
                id: 'g_' + Math.random().toString(36).slice(2),
                genero: genero,
                artist: m.artist || 'Artista'
            }));
            
            // Verifica mudanças
            const chave = 'vdb_tamanho_' + genero;
            const tamanhoAntigo = parseInt(localStorage.getItem(chave) || '0');
            const tamanhoNovo = musicas.length;
            if (tamanhoAntigo > 0 && tamanhoNovo !== tamanhoAntigo) {
                const diff = tamanhoNovo - tamanhoAntigo;
                const msg = diff > 0 ? `✅ +${diff} NOVAS!` : `📉 ${Math.abs(diff)} removidas`;
                mostrarBanner(msg);
            }
            localStorage.setItem(chave, tamanhoNovo.toString());
            return musicas;
        } catch (e) {
            console.warn('Erro ao carregar', genero, e);
            return null;
        }
    }

    function atualizarPlaylist() {
        if (!state.playlistAtual.length) return null;
        if (state.indiceAtual >= state.playlistAtual.length) {
            if (state.modoFavoritos) {
                state.modoFavoritos = false;
                state.playlistAtual = shuf(state.musicas);
                state.indiceAtual = 0;
                notif('🎵 Voltei para ' + state.modoAtual);
            } else {
                state.playlistAtual = shuf(state.musicas);
                state.indiceAtual = 0;
            }
        }
        return state.playlistAtual[state.indiceAtual];
    }

    // ============================================================
    // AUDIO ENGINE
    // ============================================================
    function criarSilentAudio() {
        const sr = 44100;
        const ns = sr * 5;
        const buffer = new ArrayBuffer(44 + ns * 2);
        const view = new DataView(buffer);
        const write = (offset, str) => {
            for (let i = 0; i < str.length; i++) {
                view.setUint8(offset + i, str.charCodeAt(i));
            }
        };
        write(0, 'RIFF');
        view.setUint32(4, 36 + ns * 2, true);
        write(8, 'WAVE');
        write(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sr, true);
        view.setUint32(28, sr * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        write(36, 'data');
        view.setUint32(40, ns * 2, true);
        return new Blob([buffer], { type: 'audio/wav' });
    }

    function manterAudioAtivo() {
        clearInterval(state.backgroundInterval);
        state.backgroundInterval = setInterval(async () => {
            try {
                if (dom.backgroundAudio.paused && state.isBackgroundActive) {
                    dom.backgroundAudio.play().catch(() => {});
                }
                if (state.isPlaying && dom.audio.paused && !dom.audio.ended) {
                    dom.audio.play().catch(() => {});
                }
                if (dom.audio.ended && state.isPlaying) {
                    next();
                }
            } catch (e) {}
        }, 1000);
    }

    async function ativarPlayer() {
        try {
            showLoad(true);
            const url = URL.createObjectURL(criarSilentAudio());
            dom.backgroundAudio.src = url;
            dom.backgroundAudio.loop = true;
            dom.backgroundAudio.volume = 0.001;
            await dom.backgroundAudio.play();
            state.isBackgroundActive = true;
            dom.audioStatus.textContent = '● Ativo';
            dom.audioStatus.classList.add('active');
            manterAudioAtivo();
            
            if ('wakeLock' in navigator) {
                try {
                    state.wakeLock = await navigator.wakeLock.request('screen');
                } catch (e) {}
            }
            
            showLoad(false);
            const btn = document.querySelector('.btn-ativar-player');
            if (btn) btn.classList.add('hidden');
            await tocar();
        } catch (e) {
            state.isBackgroundActive = true;
            dom.audioStatus.textContent = '● Ativo';
            dom.audioStatus.classList.add('active');
            showLoad(false);
            const btn = document.querySelector('.btn-ativar-player');
            if (btn) btn.classList.add('hidden');
            await tocar();
        }
    }

    async function tocar() {
        if (!state.isBackgroundActive || state.carregandoMusica || !state.musicas.length) return;
        state.carregandoMusica = true;
        
        const musica = atualizarPlaylist();
        if (!musica) {
            state.carregandoMusica = false;
            return;
        }

        // Atualiza UI
        dom.nowTitle.textContent = sanitize(musica.title);
        dom.nowArtist.textContent = sanitize(musica.artist);
        atualizarLetreiro(musica);
        updateHeart(musica.id);

        // Carrega áudio
        dom.audio.pause();
        dom.audio.src = '';
        const urls = getUrls(musica).slice(0, 8);
        let ok = false;

        for (const url of urls) {
            try {
                const loaded = await new Promise(res => {
                    const timeout = setTimeout(() => {
                        dom.audio.oncanplay = null;
                        dom.audio.onerror = null;
                        res(false);
                    }, 8000);
                    dom.audio.oncanplay = () => {
                        clearTimeout(timeout);
                        res(true);
                    };
                    dom.audio.onerror = () => {
                        clearTimeout(timeout);
                        res(false);
                    };
                    dom.audio.src = url;
                    dom.audio.load();
                });
                if (loaded) { ok = true; break; }
            } catch (e) {}
        }

        state.carregandoMusica = false;
        if (ok) {
            try {
                await dom.audio.play();
                state.isPlaying = true;
                dom.playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                notif('▶️ ' + sanitize(musica.title));
            } catch (e) {
                next();
            }
        } else {
            next();
        }
    }

    function togglePlay() {
        if (!state.isBackgroundActive) {
            notif('🔊 Clique em ATIVAR!');
            return;
        }
        if (dom.audio.paused) {
            tocar();
        } else {
            dom.audio.pause();
            state.isPlaying = false;
            dom.playBtn.innerHTML = '<i class="fas fa-play"></i>';
        }
        showControls();
    }

    function next() {
        if (state.carregandoMusica) return;
        state.indiceAtual = (state.indiceAtual + 1) % state.playlistAtual.length;
        if (state.isBackgroundActive) setTimeout(tocar, 100);
        showControls();
    }

    function prev() {
        if (state.carregandoMusica) return;
        state.indiceAtual = (state.indiceAtual - 1 + state.playlistAtual.length) % state.playlistAtual.length;
        if (state.isBackgroundActive) setTimeout(tocar, 100);
        showControls();
    }

    function toggleShuffle() {
        state.shuffleMode = !state.shuffleMode;
        dom.shuffleBtn.classList.toggle('active', state.shuffleMode);
        state.playlistAtual = shuf(state.musicas);
        notif(state.shuffleMode ? '🔀 ON' : '➡️ Seq');
    }

    // ============================================================
    // MEDIA CONTAINER (Imagens/Vídeos)
    // ============================================================
    function criarMidia() {
        const midias = [
            { t: 'img', s: 'vd14.png' },
            { t: 'vid', s: 'vai1.mp4' },
            { t: 'img', s: 'vd15.png' },
            { t: 'img', s: 'vd12.png' },
            { t: 'img', s: 'mac01.png' },
            { t: 'img', s: 'vd10.png' },
            { t: 'img', s: 'vai1.png' }
        ];

        midias.forEach((m, i) => {
            let el;
            if (m.t === 'vid') {
                el = document.createElement('video');
                el.src = m.s;
                el.muted = true;
                el.playsInline = true;
                el.loop = true;
                el.load();
            } else {
                el = document.createElement('img');
                el.src = m.s;
            }
            el.className = i === 0 ? 'active' : 'inactive';
            dom.mediaContainer.appendChild(el);
            if (i === 0 && m.t === 'vid') el.play().catch(() => {});
        });

        const children = dom.mediaContainer.children;
        if (children.length > 1) {
            state.mediaTimer = setInterval(() => {
                const atual = children[state.midiaAtual];
                const prox = children[(state.midiaAtual + 1) % children.length];
                if (!atual || !prox) return;
                atual.className = 'inactive';
                if (atual.tagName === 'VIDEO') atual.pause();
                prox.className = 'active';
                if (prox.tagName === 'VIDEO') prox.play().catch(() => {});
                state.midiaAtual = (state.midiaAtual + 1) % children.length;
            }, 5000);
        }
    }

    async function selecionarGenero(genero) {
        state.modoFavoritos = false;
        showLoad(true);
        const musicas = await carregarPlaylist(genero);
        if (!musicas || !musicas.length) {
            showLoad(false);
            notif('❌ Erro ao carregar ' + genero);
            dom.genresModal.classList.remove('open');
            return;
        }
        dom.audio.pause();
        state.musicas = musicas;
        state.modoAtual = genero;
        state.playlistAtual = shuf(musicas);
        state.indiceAtual = 0;
        dom.genreBadge.textContent = genero;
        dom.genreBadge.style.color = CORES[genero] || '#fff';
        state.scrollPersonalizado = false; // Volta ao modo automático

        const m = state.playlistAtual[0];
        if (m) {
            dom.nowTitle.textContent = sanitize(m.title);
            dom.nowArtist.textContent = sanitize(m.artist);
            atualizarLetreiro(m);
            updateHeart(m.id);
        }

        renderizarGeneros();
        showLoad(false);
        dom.genresModal.classList.remove('open');
        fullscreen();
        if (state.isBackgroundActive) setTimeout(tocar, 300);
    }

    // ============================================================
    // FAVORITOS MODAL
    // ============================================================
    function renderizarFavoritos() {
        dom.favList.innerHTML = '';
        if (state.favorites.length === 0) {
            dom.favList.innerHTML = '<div class="fav-empty">💔 Nenhuma favorita</div>';
            return;
        }

        const favMusicas = state.musicas.filter(m => state.favorites.includes(m.id));
        if (favMusicas.length === 0) {
            dom.favList.innerHTML = '<div class="fav-empty">💔 Músicas não encontradas</div>';
            return;
        }

        favMusicas.forEach(m => {
            const item = document.createElement('div');
            item.className = 'fav-item';
            item.innerHTML = `
                <div class="fav-info">
                    <div class="title">${sanitize(m.title)}</div>
                    <div class="artist">${sanitize(m.artist)} • ${m.genero || 'Gênero'}</div>
                </div>
                <button class="remove"><i class="fas fa-times-circle"></i></button>
            `;

            item.querySelector('.fav-info').addEventListener('click', () => {
                dom.favModal.classList.remove('open');
                tocarFavoritaEspecifica(m.id);
            });

            item.querySelector('.remove').addEventListener('click', (e) => {
                e.stopPropagation();
                toggleFav(m.id);
                renderizarFavoritos();
                if (state.modoFavoritos && state.favorites.length === 0) {
                    state.modoFavoritos = false;
                    state.playlistAtual = shuf(state.musicas);
                    state.indiceAtual = 0;
                    dom.genreBadge.textContent = state.modoAtual;
                    dom.genreBadge.style.color = CORES[state.modoAtual] || '#fff';
                    if (state.isBackgroundActive) tocar();
                    notif('🎵 Voltei para ' + state.modoAtual);
                }
            });

            dom.favList.appendChild(item);
        });
    }

    function tocarFavoritaEspecifica(id) {
        const musica = state.musicas.find(m => m.id === id);
        if (!musica) return;
        state.modoFavoritos = true;
        const favMusicas = state.musicas.filter(m => state.favorites.includes(m.id));
        if (favMusicas.length > 0) {
            state.playlistAtual = shuf(favMusicas);
            const idx = state.playlistAtual.findIndex(m => m.id === id);
            if (idx > -1) {
                state.indiceAtual = idx;
                dom.genreBadge.textContent = '❤️ FAV';
                dom.genreBadge.style.color = '#ff2d7f';
                if (state.isBackgroundActive) tocar();
            }
        }
    }

    function tocarFavoritos() {
        if (state.favorites.length === 0) {
            notif('💔 Nenhuma favorita');
            return;
        }
        state.modoFavoritos = true;
        const favMusicas = state.musicas.filter(m => state.favorites.includes(m.id));
        if (favMusicas.length === 0) {
            notif('💔 Nenhuma favorita encontrada');
            return;
        }
        state.playlistAtual = shuf(favMusicas);
        state.indiceAtual = 0;
        dom.genreBadge.textContent = '❤️ FAV';
        dom.genreBadge.style.color = '#ff2d7f';
        state.scrollPersonalizado = false;

        const m = state.playlistAtual[0];
        if (m) {
            dom.nowTitle.textContent = sanitize(m.title);
            dom.nowArtist.textContent = sanitize(m.artist);
            atualizarLetreiro(m);
            updateHeart(m.id);
        }
        if (state.isBackgroundActive) setTimeout(tocar, 300);
        notif('❤️ Suas favoritas!');
        dom.favModal.classList.remove('open');
    }

    // ============================================================
    // INICIALIZAÇÃO
    // ============================================================
    function iniciar() {
        criarMidia();
        carregarFav();

        // Carrega primeira playlist
        (async () => {
            for (const g of ORDEM) {
                const musicas = await carregarPlaylist(g);
                if (musicas && musicas.length) {
                    state.musicas = musicas;
                    state.modoAtual = g;
                    state.playlistAtual = shuf(musicas);
                    dom.genreBadge.textContent = g;
                    dom.genreBadge.style.color = CORES[g] || '#fff';
                    const m = state.playlistAtual[0];
                    if (m) {
                        dom.nowTitle.textContent = sanitize(m.title);
                        dom.nowArtist.textContent = sanitize(m.artist);
                        atualizarLetreiro(m);
                        updateHeart(m.id);
                    }
                    break;
                }
            }
            renderizarGeneros();
            fullscreen();
        })();

        // Botão ATIVAR
        const btnAtivar = document.createElement('button');
        btnAtivar.className = 'btn-ativar-player';
        btnAtivar.textContent = '▶ ATIVAR';
        btnAtivar.onclick = async function() {
            this.classList.add('hidden');
            await ativarPlayer();
            fullscreen();
        };
        document.body.appendChild(btnAtivar);

        // Mostra player após loading
        setTimeout(() => {
            dom.loadingScreen.style.display = 'none';
            dom.playerContainer.classList.add('visible');
        }, 1500);

        // Verifica bloqueio
        if (localStorage.getItem('vdb_senha_permanente') === 'true') {
            state.desbloqueado = true;
            dom.timerTop.textContent = '🔓 Lib';
            dom.timerTop.style.color = '#4ade80';
            return;
        }
        if (localStorage.getItem('vdb_bloqueado_permanente') === 'true') {
            bloquear();
            return;
        }
        if (localStorage.getItem('vdb_desbloqueado') === 'true') {
            state.desbloqueado = true;
            dom.timerTop.textContent = '🔓 Lib';
            dom.timerTop.style.color = '#4ade80';
            return;
        }
        const salvo = localStorage.getItem('vdb_tempo_restante');
        if (salvo && parseInt(salvo) > Date.now()) {
            state.tempoRestante = Math.floor((parseInt(salvo) - Date.now()) / 1000);
            startTimer();
            return;
        }
        if (salvo) {
            bloquear();
            return;
        }
        localStorage.setItem('vdb_tempo_restante', String(Date.now() + TEMPO_INICIAL * 1000));
        state.tempoRestante = TEMPO_INICIAL;
        startTimer();
    }

        location.reload();
    };
    document.getElementById('feedbackMenuBtn').onclick = () => {
        dom.menuPopup.classList.remove('open');
        dom.feedbackModal.classList.add('open');
    };
    document.getElementById('sleepMenuBtn').onclick = () => {
        dom.menuPopup.classList.remove('open');
        const mins = parseInt(prompt('⏰ Desligar em quantos minutos?', '15'));
        if (mins > 0) {
            clearTimeout(state.sleepTimer);
            state.sleepTimer = setTimeout(() => {
                dom.audio.pause();
                state.isPlaying = false;
                dom.playBtn.innerHTML = '<i class="fas fa-play"></i>';
                notif('💤 Rádio desligada!');
            }, mins * 60000);
            notif('⏰ Sleep: ' + mins + ' min');
        }
    };
    document.getElementById('qrCodeMenuBtn').onclick = () => {
        dom.menuPopup.classList.remove('open');
        window.open('https://api.qrserver.com/v1/create-qr-code/?data=' + encodeURIComponent(location.href));
    };

    // EDITAR LETREIRO (novo botão)
    document.getElementById('editScrollBtn').onclick = () => {
        dom.menuPopup.classList.remove('open');
        editarLetreiro();
    };

    // FAB
    const fabMain = document.getElementById('fabMain');
    const fabSub = document.getElementById('fabSub');
    fabMain.onclick = () => {
        state.fabOpen = !state.fabOpen;
        fabSub.classList.toggle('open', state.fabOpen);
        fabMain.innerHTML = state.fabOpen ? '<i class="fas fa-times"></i>' : '<i class="fas fa-plus"></i>';
    };
    document.getElementById('fabGeneros').onclick = () => {
        dom.genresModal.classList.add('open');
        fabSub.classList.remove('open');
        state.fabOpen = false;
        fabMain.innerHTML = '<i class="fas fa-plus"></i>';
    };
    document.getElementById('fabYoutube').onclick = () => {
        window.open('https://sites.google.com/view/rogersjc/in%C3%ADcio');
        fabSub.classList.remove('open');
        state.fabOpen = false;
        fabMain.innerHTML = '<i class="fas fa-plus"></i>';
    };
    document.getElementById('fabShare').onclick = () => {
        navigator.clipboard.writeText(location.href).then(() => notif('📋 Link copiado!'));
        fabSub.classList.remove('open');
        state.fabOpen = false;
        fabMain.innerHTML = '<i class="fas fa-plus"></i>';
    };
    document.getElementById('fabQrCode').onclick = () => {
        window.open('https://api.qrserver.com/v1/create-qr-code/?data=' + encodeURIComponent(location.href));
        fabSub.classList.remove('open');
        state.fabOpen = false;
        fabMain.innerHTML = '<i class="fas fa-plus"></i>';
    };
    document.getElementById('fabFeedback').onclick = () => {
        dom.feedbackModal.classList.add('open');
        fabSub.classList.remove('open');
        state.fabOpen = false;
        fabMain.innerHTML = '<i class="fas fa-plus"></i>';
    };

    // FEEDBACK
    document.querySelectorAll('.star').forEach(star => {
        star.onclick = () => {
            const rating = parseInt(star.dataset.rating);
            document.querySelectorAll('.star').forEach((s, i) => {
                s.className = i < rating ? 'fas fa-star star active' : 'far fa-star star';
            });
        };
    });
    document.getElementById('sendFeedbackBtn').onclick = () => {
        const stars = document.querySelectorAll('.star.active').length;
        const text = document.getElementById('feedbackText').value;
        window.open('https://wa.me/' + NUMERO_WHATSAPP + '?text=' + encodeURIComponent('⭐' + '★'.repeat(stars) + ' ' + text));
        dom.feedbackModal.classList.remove('open');
    };
    document.getElementById('closeFeedbackBtn').onclick = () => dom.feedbackModal.classList.remove('open');

    // SENHA
    document.getElementById('btnSenhaPermanente').onclick = () => {
        if (state.tentativas >= MAX_TENTATIVAS) {
            document.getElementById('erroSenha').textContent = '❌ BLOQUEADO! Reinicie.';
            document.getElementById('senhaPermanente').disabled = true;
            document.getElementById('btnSenhaPermanente').disabled = true;
            return;
        }
        const senha = document.getElementById('senhaPermanente').value.trim();
        if (senha === SENHA_FIXA || senha.split(':').length === 4) {
            desbloquear();
            state.tentativas = 0;
            document.getElementById('erroSenha').textContent = '';
            notif('✅ Liberado!');
        } else {
            state.tentativas++;
            const restam = MAX_TENTATIVAS - state.tentativas;
            document.getElementById('erroSenha').textContent = '❌ Inválida! Restam ' + restam + ' tentativa(s)';
        }
    };
    document.getElementById('senhaPermanente').onkeydown = (e) => {
        if (e.key === 'Enter') document.getElementById('btnSenhaPermanente').click();
    };

    // WHATSAPP / PIX
    document.getElementById('btnWhatsApp').onclick = () => window.open('https://wa.me/' + NUMERO_WHATSAPP);
    document.getElementById('btnPix').onclick = () => {
        navigator.clipboard.writeText(CHAVE_PIX).then(() => notif('✅ PIX copiado!'));
    };

    // ADMIN
    document.getElementById('adminGerarBtn').onclick = () => {
        const email = document.getElementById('adminEmail').value;
        const cel = document.getElementById('adminCelular').value;
        const exp = Date.now() + 999999999999;
        const hash = btoa(email + cel + 'VDB2025Secret').slice(0, 40);
        document.getElementById('adminSenhaGerada').value = email + ':' + cel + ':' + exp + ':' + hash;
    };
    document.getElementById('btnCopiarSenha').onclick = () => {
        const text = document.getElementById('adminSenhaGerada').value;
        if (text) navigator.clipboard.writeText(text).then(() => notif('📋 Copiada!'));
    };
    document.getElementById('adminCloseBtn').onclick = () => dom.adminPanel.classList.remove('open');

    // AUDIO EVENTS
    dom.audio.ontimeupdate = () => {
        if (dom.audio.duration) {
            dom.progressFill.style.width = (dom.audio.currentTime / dom.audio.duration * 100) + '%';
            dom.currentTime.textContent = fmt(dom.audio.currentTime);
            dom.totalTime.textContent = fmt(dom.audio.duration);
        }
    };
    dom.audio.onended = () => {
        if (!state.carregandoMusica) next();
    };
    dom.audio.onerror = () => {
        if (!state.carregandoMusica) next();
    };

    // VISIBILITY
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && state.isPlaying && state.isBackgroundActive) {
            dom.audio.play().catch(() => {});
        }
    });

    // UNLOAD
    window.onbeforeunload = () => {
        clearInterval(state.backgroundInterval);
        clearInterval(state.timerInterval);
        clearInterval(state.mediaTimer);
        if (state.wakeLock) state.wakeLock.release().catch(() => {});
    };

    // ADMIN (5 cliques no letreiro)
    let adminClicks = 0;
    dom.infoScroll.onclick = () => {
        adminClicks++;
        setTimeout(() => adminClicks = 0, 2000);
        if (adminClicks >= 5) {
            adminClicks = 0;
            dom.adminPanel.classList.toggle('open');
            notif('🔐 ADMIN!');
        }
    };

    // KEYBOARD
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === ' ') { e.preventDefault(); togglePlay(); }
        if (e.key === 'ArrowRight') next();
        if (e.key === 'ArrowLeft') prev();
        if (e.key === 's' || e.key === 'S') toggleShuffle();
    });

    // CLICK TO SHOW CONTROLS
    document.addEventListener('click', (e) => {
        if (e.target.closest('button') || e.target.closest('.genre-card') || e.target.closest('#infoScroll')) return;
        showControls();
    });

    // ============================================================
    // INICIA
    // ============================================================
    iniciar();

})();
</script>
</body>
</html>
