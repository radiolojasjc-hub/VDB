<!DOCTYPE html>
<html lang="pt-br">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>

        .app { position: relative; z-index: 10; width: 100%; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; background: transparent; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); border-bottom: 2px solid rgba(255,255,255,0.1); flex-wrap: nowrap; gap: 4px; flex-shrink: 0; }

        .genre-badge:active { transform: scale(0.95); }
        .top-buttons { display: flex; gap: 4px; align-items: center; flex-wrap: nowrap; flex-shrink: 0; }

        .now-playing .fav-heart-center { display: flex; justify-content: center; margin: 10px 0; }
        .now-playing .fav-heart { font-size: 3.5rem; color: #555; cursor: pointer; transition: all 0.3s; text-shadow: 0 0 30px rgba(0,0,0,0.9); display: inline-block; }
        .now-playing .fav-heart.active { color: #ff2d7f; text-shadow: 0 0 40px rgba(255,45,127,0.5); }
        .now-playing .fav-heart:active { transform: scale(1.2); }
        
        .teaching-bar { position: fixed; bottom: 115px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); backdrop-filter: blur(12px); padding: 6px 22px; border-radius: 40px; font-size: 0.6rem; font-weight: 800; color: #ddd; z-index: 26; pointer-events: none; border: 1px solid rgba(255,255,255,0.05); white-space: nowrap; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.5s ease; }
        .teaching-bar.show { opacity: 1; }
        .teaching-bar .cyan { color: var(--neon-cyan); font-weight: 900; }
        
        .bottom-controls { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.05); padding: 6px 12px 10px; z-index: 20; transform: translateY(100%); transition: transform 0.3s ease; }

        .progress-time { display: flex; justify-content: space-between; font-size: 0.5rem; color: #aaa; margin-bottom: 2px; }
        .progress-bar { height: 3px; background: rgba(255,255,255,0.15); cursor: pointer; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink)); width: 0%; border-radius: 4px; }
        .buttons-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 4px; }
        .ctrl-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 0.8rem; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; }
        .ctrl-btn:active { transform: scale(0.92); background: var(--neon-cyan); color: #000; }
        .play-big { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); width: 44px; height: 44px; font-size: 1.1rem; color: #000; border: none; }
        .shuffle-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 0.7rem; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; }
        .shuffle-btn.active { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); }

        .fab-sub { background: rgba(0,0,0,0.9); backdrop-filter: blur(14px); border-radius: 30px; padding: 5px; display: none; flex-direction: column; gap: 3px; border: 1px solid rgba(255,255,255,0.1); }

        .fab-sub-btn { background: rgba(255,255,255,0.05); border: none; color: white; padding: 6px 14px; border-radius: 25px; font-size: 0.65rem; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; min-width: 100px; }

        .fab-sub-btn i { font-size: 0.85rem; width: 18px; text-align: center; pointer-events: none; }
        
        .menu-button { background: rgba(255,255,255,0.05); color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; }

        .menu-popup button { background: rgba(255,255,255,0.08); border: none; color: white; padding: 5px 12px; border-radius: 30px; font-size: 0.6rem; display: flex; align-items: center; gap: 6px; cursor: pointer; text-align: left; }
        .menu-popup button:active { background: var(--neon-cyan); color: #000; }
        .menu-popup .close-menu-btn { background: rgba(255,45,127,0.2); border: 1px solid #ff2d7f; color: #ff2d7f; }
        
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a; display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s; }
        #splash.hidden { opacity: 0; pointer-events: none; }
        .splash-loading { text-align: center; color: white; }
        .splash-loading i { font-size: 2rem; color: var(--neon-cyan); }

        #tap-to-start { position: fixed; bottom: 30%; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #4ade80, #22c55e); color: #000; padding: 14px 28px; border-radius: 60px; font-weight: 900; font-size: 1.1rem; z-index: 10000; cursor: pointer; display: none; animation: btnPulse 1.5s infinite; border: none; box-shadow: 0 0 40px rgba(74, 222, 128, 0.6); letter-spacing: 1.5px; text-transform: uppercase; white-space: nowrap; }

        .notification.show { opacity: 1; }
        
        #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9998; align-items: center; justify-content: center; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .fav-modal.open { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); border-image: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)) 1; }

        .fav-modal .close-fav { position: absolute; top: 12px; right: 16px; background: transparent; border: none; color: #888; font-size: 1.5rem; cursor: pointer; }
        .fav-modal .close-fav:active { color: #fff; }
        .fav-list { max-height: 50vh; overflow-y: auto; text-align: left; margin-bottom: 15px; }
        .fav-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); color: white; }
        .fav-item .info { flex: 1; cursor: pointer; min-width: 0; }
        .fav-item .info .title { font-weight: bold; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fav-item .info .artist { font-size: 0.7rem; color: #aaa; }
        .fav-item .remove { background: transparent; border: none; color: #ff2d7f; font-size: 1.1rem; cursor: pointer; padding: 4px 8px; }
        .fav-empty { color: #888; padding: 30px; text-align: center; }
        .fav-modal .close-btn { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); border: none; padding: 12px; border-radius: 30px; color: #000; font-weight: bold; cursor: pointer; margin-top: 0; font-size: 0.95rem; }
        .fav-modal .close-btn:active { transform: scale(0.95); }
        
        .genres-modal { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20,20,40,0.95); backdrop-filter: blur(20px); border-radius: 30px 30px 0 0; padding: 16px 10px 20px; z-index: 2000; transform: translateY(100%); transition: transform 0.3s ease; max-height: 60vh; overflow-y: auto; border-top: 2px solid transparent; border-image: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)) 1; box-shadow: 0 -10px 40px rgba(0,243,255,0.15); }
        .genres-modal.open { transform: translateY(0); }
        .genres-modal h3 { text-align: center; margin-bottom: 12px; font-size: 0.9rem; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .genres-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
        .genre-card { border-radius: 14px; cursor: pointer; transition: all 0.25s ease; border: 2px solid rgba(255,255,255,0.12); aspect-ratio: 4 / 2.4; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; text-align: center; color: white; font-weight: 700; font-size: 0.7rem; padding: 6px; }

    <div id="splash">

            };

            // ============================================================
            // VARIÁVEIS PRINCIPAIS
            // ============================================================
            let musicas = [...musicasExemplo];
            let indiceAtual = 0;  // Índice SIMPLES
            let isPlaying = false;
            let shuffleMode = false;
            let isBackgroundActive = false;
            let timerRAF = null;
            let favorites = [];
            let carregandoMusica = false;
            let modoTVAtivo = false;
            let fabOpen = false;
            let hideControlsTimeout = null;
            let keepAliveInterval = null;
            let audioContext = null;

            const audio = document.getElementById('musicPlayer');
            const playBtn = document.getElementById('playBtn');
            const progressFill = document.getElementById('progressFill');
            const currentTimeEl = document.getElementById('currentTime');
            const totalTimeEl = document.getElementById('totalTime');
            const genreBadge = document.getElementById('genreBadge');
            const scrollText = document.getElementById('scrollText');
            const splash = document.getElementById('splash');
            const tapToStart = document.getElementById('tap-to-start');
            const appContainer = document.getElementById('appContainer');
            const notification = document.getElementById('notification');
            const bottomControls = document.getElementById('bottomControls');
            const shuffleBtn = document.getElementById('shuffleBtn');
            const bgVideo = document.getElementById('bgVideo');
            const heartBtn = document.getElementById('heartBtn');
            const favTopBtn = document.getElementById('favTopBtn');
            const favCount = document.getElementById('favCount');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const backgroundAudio = document.getElementById('backgroundAudio');
            const teachingBar = document.getElementById('teachingBar');
            const audioStatusBtn = document.getElementById('audioStatusBtn');
            const menuPopup = document.getElementById('menuPopup');
            const menuButton = document.getElementById('menuButton');

            // ============================================================
            // FUNÇÕES AUXILIARES
            // ============================================================
            function showNotification(msg, duration = 1500) {
                notification.textContent = msg;
                notification.classList.add('show');
                setTimeout(() => notification.classList.remove('show'), duration);
            }

            function formatTime(sec) {
                if (!sec || isNaN(sec) || !isFinite(sec)) return "0:00";
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            }

            function showLoading(show) {
                loadingOverlay.classList.toggle('active', show);
            }

            function showControls() {
                bottomControls.classList.add('visible');
                if (hideControlsTimeout) clearTimeout(hideControlsTimeout);
                hideControlsTimeout = setTimeout(() => bottomControls.classList.remove('visible'), 5000);
            }

            function shuffleArray(arr) {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            function goFullscreen() {
                try {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    } else if (document.documentElement.webkitRequestFullscreen) {
                        document.documentElement.webkitRequestFullscreen();
                    }
                } catch(e) {}
            }

            function updateFavCount() {
                favCount.textContent = favorites.length;
            }

            function toggleFavorito(musicId) {
                const index = favorites.indexOf(musicId);
                if (index > -1) {
                    favorites.splice(index, 1);
                } else {
                    favorites.push(musicId);
                }
                localStorage.setItem('radio_favorites_simple', JSON.stringify(favorites));
                updateHeartIcon(musicId);
                renderFavList();
                updateFavCount();
            }

            function updateHeartIcon(musicId) {
                if (favorites.includes(musicId)) {
                    heartBtn.className = 'fav-heart active';
                    heartBtn.innerHTML = '<i class="fas fa-heart"></i>';
                } else {
                    heartBtn.className = 'fav-heart';
                    heartBtn.innerHTML = '<i class="far fa-heart"></i>';
                }
                updateFavCount();
            }

            function renderFavList() {
                const favList = document.getElementById('favList');
                favList.innerHTML = '';
                if (favorites.length === 0) {
                    favList.innerHTML = '<div class="fav-empty">Nenhuma música favorita</div>';
                    return;
                }
                const favMusicas = favorites.map(id => musicas.find(m => m.id === id)).filter(Boolean);
                favMusicas.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'fav-item';
                    div.dataset.id = m.id;
                    div.innerHTML = `
                        <div class="info" data-id="${m.id}">
                            <div class="title">${m.title}</div>
                            <div class="artist">${m.artist}</div>
                        </div>
                        <button class="remove" data-id="${m.id}"><i class="fas fa-times-circle"></i></button>
                    `;
                    favList.appendChild(div);
                });
            }

            function openFavModal() {
                renderFavList();
                document.getElementById('favModal').classList.add('open');
            }

            // ============================================================
            // CARREGAR PLAYLIST
            // ============================================================
            async function carregarPlaylistPorGenero(genero) {
                const url = GENRE_URLS[genero];
                if (!url) return null;
                
                try {
                    showLoading(true);
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`Erro HTTP ${response.status}`);
                    let data = await response.json();
                    
                    if (!Array.isArray(data)) {
                        if (data.musicas && Array.isArray(data.musicas)) data = data.musicas;
                        else if (data.data && Array.isArray(data.data)) data = data.data;
                        else {
                            const vals = Object.values(data);
                            if (vals.length && Array.isArray(vals[0])) data = vals[0];
                            else throw new Error('Formato inválido');
                        }
                    }
                    
                    const lista = data.filter(m => m.src && m.src.trim() && m.title && m.title.trim());
                    lista.forEach(m => {
                        m.id = m.id || `gen_${genero}_${Math.random().toString(36).substr(2, 6)}`;
                        m.genero = genero;
                    });
                    
                    showLoading(false);
                    return lista;
                } catch (error) {
                    showLoading(false);
                    return null;
                }
            }

            async function selecionarGenero(genero) {
                const lista = await carregarPlaylistPorGenero(genero);
                if (!lista || lista.length === 0) {
                    showNotification(`⚠️ Nenhuma música para ${genero}`, 2000);
                    return;
                }
                
                // Para a música atual
                audio.pause();
                audio.src = '';
                audio.load();
                isPlaying = false;
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                stopTimer();
                carregandoMusica = false;
                
                musicas = lista;
                indiceAtual = 0;
                genreBadge.innerHTML = genero;
                
                const primeira = musicas[0];
                if (primeira) {
                    scrollText.innerHTML = `🎵 ${primeira.title} - ${primeira.artist}`;
                    updateHeartIcon(primeira.id);
                }
                
                buildGenresGrid();
                showNotification(`🎵 ${genero} (${musicas.length} músicas)`, 2000);
                
                if (isBackgroundActive) {
                    setTimeout(() => playMusic(), 300);
                }
            }

            // ============================================================
            // REPRODUÇÃO - SIMPLES E DEFINITIVA
            // ============================================================
            function playMusic() {
                if (carregandoMusica) return;
                if (!isBackgroundActive) return;
                if (!musicas || !musicas.length) return;

                carregandoMusica = true;

                // Pega a música atual
                const track = musicas[indiceAtual % musicas.length];
                if (!track) {
                    carregandoMusica = false;
                    setTimeout(() => playMusic(), 500);
                    return;
                }

                // Atualiza a interface
                scrollText.innerHTML = `🎵 ${track.title} - ${track.artist}`;
                updateHeartIcon(track.id);

                // Cria a URL
                let url = track.src;
                if (url && !url.startsWith('http://') && !url.startsWith('https://')) {
                    url = `https://raw.githubusercontent.com/radiolojasjc-hub/play12/refs/heads/main/${url}`;
                }

                if (!url) {
                    carregandoMusica = false;
                    setTimeout(() => {
                        indiceAtual++;
                        playMusic();
                    }, 500);
                    return;
                }

                // Remove listeners antigos
                audio.oncanplay = null;
                audio.onerror = null;
                audio.onended = null;
                audio.ontimeupdate = null;

                try {
                    audio.pause();
                } catch(e) {}
                audio.src = url;
                audio.load();

                let timeoutId = setTimeout(() => {
                    console.warn('⏰ Timeout carregando música');
                    carregandoMusica = false;
                    indiceAtual++;
                    setTimeout(() => playMusic(), 500);
                }, 10000);

                audio.oncanplay = function() {
                    clearTimeout(timeoutId);
                    audio.play()
                        .then(() => {
                            isPlaying = true;
                            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                            startTimer();
                            carregandoMusica = false;
                            console.log(`🎵 Tocando: ${track.title}`);
                        })
                        .catch(() => {
                            carregandoMusica = false;
                            indiceAtual++;
                            setTimeout(() => playMusic(), 500);
                        });
                };

                audio.onerror = function() {
                    clearTimeout(timeoutId);
                    carregandoMusica = false;
                    indiceAtual++;
                    setTimeout(() => playMusic(), 500);
                };

                audio.onended = function() {
                    if (carregandoMusica) return;
                    indiceAtual++;
                    setTimeout(() => playMusic(), 100);
                };

                audio.ontimeupdate = function() {
                    if (audio.duration && isFinite(audio.duration) && audio.duration > 0) {
                        const pct = Math.min(100, (audio.currentTime / audio.duration) * 100);
                        progressFill.style.width = pct + '%';
                        currentTimeEl.textContent = formatTime(audio.currentTime);
                        totalTimeEl.textContent = formatTime(audio.duration);
                    }
                };
            }

            // ============================================================
            // CONTROLES
            // ============================================================
            function stopTimer() {
                if (timerRAF) {
                    cancelAnimationFrame(timerRAF);
                    timerRAF = null;
                }
            }

            function startTimer() {
                stopTimer();
                if (!audio.duration || !isFinite(audio.duration) || audio.duration <= 0) return;
                
                function update() {
                    if (isPlaying && audio.duration && isFinite(audio.duration) && audio.duration > 0 && !audio.paused) {
                        const pct = Math.min(100, (audio.currentTime / audio.duration) * 100);
                        progressFill.style.width = pct + '%';
                        currentTimeEl.textContent = formatTime(audio.currentTime);
                        totalTimeEl.textContent = formatTime(audio.duration);
                    }
                    if (isPlaying) {
                        timerRAF = requestAnimationFrame(update);
                    }
                }
                timerRAF = requestAnimationFrame(update);
            }

            function togglePlay() {
                if (!isBackgroundActive) return;
                if (audio.paused) {
                    if (carregandoMusica) return;
                    playMusic();
                } else {
                    audio.pause();
                    isPlaying = false;
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    stopTimer();
                }
                showControls();
            }

            function nextTrack() {
                if (carregandoMusica) return;
                audio.pause();
                audio.src = '';
                audio.load();
                isPlaying = false;
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                stopTimer();
                carregandoMusica = false;
                indiceAtual++;
                setTimeout(() => playMusic(), 200);
                showControls();
            }

            function prevTrack() {
                if (carregandoMusica) return;
                audio.pause();
                audio.src = '';
                audio.load();
                isPlaying = false;
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                stopTimer();
                carregandoMusica = false;
                indiceAtual -= 2;
                if (indiceAtual < 0) indiceAtual = musicas.length - 1;
                setTimeout(() => playMusic(), 200);
                showControls();
            }

            function toggleShuffle() {
                shuffleMode = !shuffleMode;
                shuffleBtn.classList.toggle('active', shuffleMode);
                if (shuffleMode && musicas.length > 1) {
                    const atual = musicas[indiceAtual % musicas.length];
                    const outras = musicas.filter(m => m.id !== atual.id);
                    const embaralhadas = shuffleArray(outras);
                    musicas = [atual, ...embaralhadas];
                    indiceAtual = 0;
                }
                showControls();
            }

            // ============================================================
            // ÁUDIO EM SEGUNDO PLANO
            // ============================================================
            function createSilentAudio() {
                try {
                    const sampleRate = 44100, duration = 1, numSamples = sampleRate * duration;
                    const buffer = new ArrayBuffer(44 + numSamples * 2);
                    const view = new DataView(buffer);
                    const writeString = (view, offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
                    writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + numSamples * 2, true);
                    writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt ');
                    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
                    view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
                    view.setUint16(32, 2, true); view.setUint16(34, 16, true);
                    writeString(view, 36, 'data'); view.setUint32(40, numSamples * 2, true);
                    let offset = 44;
                    for (let i = 0; i < numSamples; i++) { view.setInt16(offset, 0, true); offset += 2; }
                    return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
                } catch(e) { return ''; }
            }

            async function ativarAudio() {
                try {
                    showLoading(true);
                    
                    // Cria áudio silencioso para manter ativo
                    const silentUrl = createSilentAudio();
                    if (silentUrl) {
                        backgroundAudio.src = silentUrl;
                        backgroundAudio.loop = true;
                        backgroundAudio.volume = 0.001;
                        await backgroundAudio.play();
                    }
                    
                    isBackgroundActive = true;
                    audioStatusBtn.innerHTML = '<span class="dot"></span> Ativado';
                    audioStatusBtn.className = 'top-btn ativo';
                    
                    playMusic();
                    showLoading(false);
                    return true;
                } catch (error) {
                    isBackgroundActive = true;
                    audioStatusBtn.innerHTML = '<span class="dot"></span> Ativado';
                    audioStatusBtn.className = 'top-btn ativo';
                    playMusic();
                    showLoading(false);
                    return true;
                }
            }

            // ============================================================
            // GRID DE GÊNEROS
            // ============================================================
            function buildGenresGrid() {
                const genresGrid = document.getElementById('genresGrid');
                genresGrid.innerHTML = '';

                const favCard = document.createElement('div');
                favCard.className = 'genre-card fav-card';
                favCard.innerHTML = `<i class="fas fa-heart" style="color:#ff2d7f;margin-right:3px;"></i> FAVORITOS (${favorites.length})`;
                favCard.onclick = () => { document.getElementById('genresModal').classList.remove('open'); entrarModoFavoritos(); };
                genresGrid.appendChild(favCard);

                const generos = Object.keys(GENRE_URLS);
                generos.forEach(genero => {
                    const card = document.createElement('div');
                    card.className = 'genre-card';
                    const cor = CORES_POR_GENERO[genero] || '#ffffff';
                    card.style.border = `2px solid ${cor}`;
                    card.style.color = cor;
                    card.textContent = genero;
                    card.onclick = () => {
                        selecionarGenero(genero);
                    };
                    genresGrid.appendChild(card);
                });
            }

            function entrarModoFavoritos() {
                if (favorites.length === 0) { showNotification('⚠️ Nenhuma favorita!', 1500); return; }
                const favMusicas = favorites.map(id => musicas.find(m => m.id === id)).filter(Boolean);
                if (favMusicas.length === 0) { return; }
                
                musicas = favMusicas;
                indiceAtual = 0;
                genreBadge.innerHTML = `<i class="fas fa-heart" style="color:#ff2d7f;"></i> ❤️ FAVORITOS (${favorites.length})`;
                const primeira = musicas[0];
                if (primeira) {
                    scrollText.innerHTML = `🎵 ${primeira.title} - ${primeira.artist}`;
                    updateHeartIcon(primeira.id);
                }
                if (isBackgroundActive) setTimeout(() => playMusic(), 200);
            }

            // ============================================================
            // INICIALIZAÇÃO
            // ============================================================
            async function iniciar() {
                try {
                    const saved = localStorage.getItem('radio_favorites_simple');
                    if (saved) favorites = JSON.parse(saved);
                } catch(e) { favorites = []; }
                updateFavCount();
                renderFavList();
                buildGenresGrid();

                // Carrega playlist MPB
                const listaMPB = await carregarPlaylistPorGenero('MPB');
                if (listaMPB && listaMPB.length > 0) {
                    musicas = listaMPB;
                    indiceAtual = 0;
                    const primeira = musicas[0];
                    if (primeira) {
                        scrollText.innerHTML = `🎵 ${primeira.title} - ${primeira.artist}`;
                        updateHeartIcon(primeira.id);
                    }
                    genreBadge.innerHTML = 'MPB';
                }

                bgVideo.src = 'abc1.mp4';
                bgVideo.load();
                bgVideo.play().catch(() => {});

                setTimeout(() => {
                    splash.classList.add('hidden');
                    setTimeout(() => {
                        splash.style.display = 'none';
                        appContainer.style.display = 'block';
                        tapToStart.style.display = 'block';
                        goFullscreen();
                    }, 500);
                }, 500);
            }

            // ============================================================
            // EVENTOS DOM
            // ============================================================
            audio.addEventListener('play', () => { 
                isPlaying = true; 
                playBtn.innerHTML = '<i class="fas fa-pause"></i>'; 
                startTimer();
            });
            audio.addEventListener('pause', () => { 
                isPlaying = false; 
                playBtn.innerHTML = '<i class="fas fa-play"></i>'; 
                stopTimer(); 
            });

            heartBtn.addEventListener('click', () => {
                const music = musicas[indiceAtual % musicas.length] || musicas[0];
                if (music) { toggleFavorito(music.id); }
            });

            document.getElementById('favTopBtn').addEventListener('click', openFavModal);
            document.getElementById('closeFavModal').addEventListener('click', () => document.getElementById('favModal').classList.remove('open'));
            document.getElementById('closeFavBtn').addEventListener('click', () => document.getElementById('favModal').classList.remove('open'));
            document.getElementById('closeGenresBtn').addEventListener('click', () => document.getElementById('genresModal').classList.remove('open'));

            const fabMain = document.getElementById('fabMain');
            const fabSub = document.getElementById('fabSub');
            fabMain.addEventListener('click', () => {
                fabOpen = !fabOpen;
                fabSub.classList.toggle('open', fabOpen);
                fabMain.innerHTML = fabOpen ? '<i class="fas fa-times"></i>' : '<i class="fas fa-plus"></i>';
            });

            document.getElementById('fabGeneros').addEventListener('click', () => { openGenres(); fabMain.click(); });
            document.getElementById('fabShare').addEventListener('click', () => {
                const track = musicas[indiceAtual % musicas.length] || musicas[0];
                if (!track) return;
                const msg = `🎵 Estou ouvindo "${track.title}" - ${track.artist} no Play 12! 📻`;
                if (navigator.share) {
                    navigator.share({ title: 'Play 12', text: msg, url: location.href }).catch(() => {});
                } else {
                    navigator.clipboard.writeText(msg + ' ' + location.href).catch(() => {});
                }
                fabMain.click();
            });

            playBtn.addEventListener('click', togglePlay);
            document.getElementById('nextBtn').addEventListener('click', nextTrack);
            document.getElementById('prevBtn').addEventListener('click', prevTrack);
            shuffleBtn.addEventListener('click', toggleShuffle);

            document.getElementById('fullscreenMenuBtn').addEventListener('click', () => { 
                menuPopup.classList.remove('open'); 
                goFullscreen();
            });
            
            document.getElementById('reloadPlaylistBtn').addEventListener('click', () => {
                menuPopup.classList.remove('open');
                selecionarGenero('MPB');
            });

            document.getElementById('sleepMenuBtn').addEventListener('click', () => { 
                menuPopup.classList.remove('open'); 
                const minutos = prompt('⏰ Desligar em quantos minutos?', '15');
                if (!minutos) return;
                const mins = parseInt(minutos);
                if (isNaN(mins) || mins < 1) return;
                setTimeout(() => { 
                    audio.pause();
                    isPlaying = false;
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    stopTimer();
                }, mins * 60000);
            });

            const progressBar = document.getElementById('progressBar');
            progressBar.addEventListener('click', (e) => {
                if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration) && audio.duration > 0) {
                    const rect = progressBar.getBoundingClientRect();
                    let x = (e.clientX - rect.left) / rect.width;
                    x = Math.max(0, Math.min(1, x));
                    audio.currentTime = x * audio.duration;
                    showControls();
                }
            });

            menuButton.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                menuPopup.classList.toggle('open'); 
                showControls(); 
            });

            document.getElementById('closeMenuBtn').addEventListener('click', () => { 
                menuPopup.classList.remove('open'); 
            });

            document.addEventListener('click', (e) => {
                if (menuPopup.classList.contains('open') && !menuPopup.contains(e.target) && e.target !== menuButton) {
                    menuPopup.classList.remove('open');
                }
                showControls();
            });

            tapToStart.addEventListener('click', async () => {
                await ativarAudio();
                tapToStart.style.display = 'none';
                goFullscreen();
            });

            document.getElementById('favModal').addEventListener('click', (e) => { if (e.target === document.getElementById('favModal')) document.getElementById('favModal').classList.remove('open'); });
            document.getElementById('genresModal').addEventListener('click', (e) => { if (e.target === document.getElementById('genresModal')) document.getElementById('genresModal').classList.remove('open'); });

            let lastTap = 0;
            document.getElementById('nowPlaying').addEventListener('click', (e) => {
                const now = Date.now();
                if (now - lastTap < 300 && now - lastTap > 50) {
                    const music = musicas[indiceAtual % musicas.length] || musicas[0];
                    if (music) { toggleFavorito(music.id); }
                }
                lastTap = now;
                showControls();
                teachingBar.classList.add('show');
                setTimeout(() => teachingBar.classList.remove('show'), 3000);
            });

            function openGenres() {
                buildGenresGrid();
                document.getElementById('genresModal').classList.add('open');
                showControls();
            }

            document.getElementById('favList').addEventListener('click', (e) => {
                const item = e.target.closest('.fav-item');
                if (!item) return;
                const id = item.dataset.id;
                if (!id) return;
                if (e.target.closest('.remove')) {
                    toggleFavorito(id);
                    renderFavList();
                    updateFavCount();
                    return;
                }
                if (e.target.closest('.info')) {
                    // Toca a música
                    const music = musicas.find(m => m.id === id);
                    if (music) {
                        audio.pause();
                        audio.src = '';
                        audio.load();
                        isPlaying = false;
                        playBtn.innerHTML = '<i class="fas fa-play"></i>';
                        stopTimer();
                        carregandoMusica = false;
                        // Reorganiza playlist
                        const outras = musicas.filter(m => m.id !== id);
                        musicas = [music, ...outras];
                        indiceAtual = 0;
                        scrollText.innerHTML = `🎵 ${music.title} - ${music.artist}`;
                        updateHeartIcon(music.id);
                        document.getElementById('favModal').classList.remove('open');
                        if (isBackgroundActive) setTimeout(() => playMusic(), 200);
                    }
                }
            });

            window.addEventListener('load', iniciar);
        })();
    </script>
