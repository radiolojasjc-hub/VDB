<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Timer</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: Arial;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #timer {
            font-size: 5rem;
            color: #00f3ff;
            margin: 20px;
            font-weight: bold;
        }
        #senhaInput {
            padding: 15px;
            font-size: 1.5rem;
            border-radius: 30px;
            border: 2px solid #00f3ff;
            background: #111;
            color: #fff;
            text-align: center;
            width: 250px;
            margin: 10px;
        }
        #btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 30px;
            border: none;
            background: #00f3ff;
            color: #000;
            cursor: pointer;
            margin: 10px;
        }
        #msg {
            color: #ff2d7f;
            margin: 10px;
            font-size: 1.2rem;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <h1>⏳ Timer Teste</h1>
    <div id="timer">05:00</div>
    <input type="password" id="senhaInput" placeholder="Digite a senha">
    <button id="btn">Desbloquear</button>
    <div id="msg"></div>

    <script>
        // ================================================
        //  CONFIGURAÇÕES
        // ================================================
        const SENHA = 'boi1685@';
        const TEMPO_INICIAL = 300; // 5 minutos (em segundos)

        // ================================================
        //  ELEMENTOS
        // ================================================
        const timerDisplay = document.getElementById('timer');
        const senhaInput = document.getElementById('senhaInput');
        const msg = document.getElementById('msg');

        // ================================================
        //  VARIÁVEIS DE ESTADO
        // ================================================
        let tempoRestante = TEMPO_INICIAL;
        let timerInterval = null;
        let bloqueado = false;

        // ================================================
        //  ATUALIZAR TIMER NA TELA
        // ================================================
        function atualizarTimer() {
            const mins = String(Math.floor(tempoRestante / 60)).padStart(2, '0');
            const segs = String(tempoRestante % 60).padStart(2, '0');
            timerDisplay.textContent = `${mins}:${segs}`;

            // Se acabou o tempo
            if (tempoRestante <= 0) {
                timerDisplay.textContent = '00:00';
                timerDisplay.style.color = '#ff2d7f';
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                if (!bloqueado) {
                    bloqueado = true;
                    msg.textContent = '⏳ TESTE EXPIROU! Digite a senha para desbloquear.';
                    senhaInput.style.display = 'block';
                }
            }
        }

        // ================================================
        //  INICIAR TIMER (contagem regressiva)
        // ================================================
        function iniciarTimer() {
            // Se já tiver um timer rodando, para
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            // Se já estiver bloqueado, não inicia
            if (bloqueado) return;

            // Se o tempo já acabou, bloqueia imediatamente
            if (tempoRestante <= 0) {
                tempoRestante = 0;
                bloqueado = true;
                msg.textContent = '⏳ TESTE EXPIROU! Digite a senha para desbloquear.';
                senhaInput.style.display = 'block';
                atualizarTimer();
                return;
            }

            // Inicia o intervalo
            timerInterval = setInterval(() => {
                tempoRestante--;
                atualizarTimer();
                if (tempoRestante <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
            }, 1000);

            atualizarTimer();
        }

        // ================================================
        //  VERIFICAR SENHA
        // ================================================
        function verificarSenha() {
            const senha = senhaInput.value.trim();
            if (!senha) {
                msg.textContent = 'Digite a senha!';
                return;
            }
            if (senha === SENHA) {
                msg.textContent = '✅ DESBLOQUEADO! O timer sumiu.';
                senhaInput.style.display = 'none';
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                timerDisplay.textContent = '🔓 LIBERADO';
                timerDisplay.style.color = '#4ade80';
                bloqueado = false;
            } else {
                msg.textContent = '❌ Senha incorreta!';
                senhaInput.value = '';
                senhaInput.focus();
            }
        }

        // ================================================
        //  CARREGAR ESTADO (localStorage)
        // ================================================
        function carregarEstado() {
            // Verifica se já foi desbloqueado permanentemente
            if (localStorage.getItem('vdb_desbloqueado_teste') === 'true') {
                timerDisplay.textContent = '🔓 LIBERADO';
                timerDisplay.style.color = '#4ade80';
                senhaInput.style.display = 'none';
                msg.textContent = '✅ Já desbloqueado!';
                bloqueado = false;
                return;
            }

            // Verifica se tem tempo salvo
            const salvo = localStorage.getItem('vdb_tempo_teste');
            if (salvo) {
                const expira = parseInt(salvo, 10);
                const agora = Date.now();
                if (expira > agora) {
                    // Ainda tem tempo
                    tempoRestante = Math.floor((expira - agora) / 1000);
                    if (tempoRestante < 0) tempoRestante = 0;
                    bloqueado = false;
                    senhaInput.style.display = 'block';
                    msg.textContent = '';
                    iniciarTimer();
                    return;
                } else {
                    // Tempo expirou
                    localStorage.removeItem('vdb_tempo_teste');
                    tempoRestante = 0;
                    bloqueado = true;
                    msg.textContent = '⏳ TESTE EXPIROU! Digite a senha para desbloquear.';
                    senhaInput.style.display = 'block';
                    atualizarTimer();
                    return;
                }
            }

            // Primeira vez: inicia timer com 5 minutos
            const expira = Date.now() + (TEMPO_INICIAL * 1000);
            localStorage.setItem('vdb_tempo_teste', expira.toString());
            tempoRestante = TEMPO_INICIAL;
            bloqueado = false;
            senhaInput.style.display = 'block';
            msg.textContent = '';
            iniciarTimer();
        }

        // ================================================
        //  EVENTOS
        // ================================================
        document.getElementById('btn').addEventListener('click', verificarSenha);
        senhaInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') verificarSenha();
        });

        // ================================================
        //  INICIAR
        // ================================================
        window.addEventListener('load', () => {
            // Inicialmente esconde o campo de senha (só mostra quando bloquear)
            senhaInput.style.display = 'block';
            carregarEstado();
        });

        // Para testes: clique no timer para resetar (remova depois)
        timerDisplay.addEventListener('dblclick', () => {
            localStorage.removeItem('vdb_desbloqueado_teste');
            localStorage.removeItem('vdb_tempo_teste');
            location.reload();
        });
    </script>
</body>
</html>
