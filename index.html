    let tempoRestante=TEMPO_INICIAL,desbloqueado=false,timerInterval=null,backgroundInterval=null,wakeLock=null,musicas=[],playlistAtual=[],indiceAtual=0,isPlaying=false,shuffleMode=false,isBackgroundActive=false,modoAtual='BÔNUS',carregandoMusica=false,favorites=[],fabOpen=false,sleepTimer=null,hideControlsTimeout=null,midiaAtual=0,mediaTimer=null,letreiroInterval=null,letreiroIndex=0;

    function notif(msg,dur=1500){notification.textContent=msg;notification.classList.add('show');setTimeout(()=>notification.classList.remove('show'),dur);}
    function showLoad(s){loadingOverlay.classList.toggle('active',s);}
    function fmt(s){if(!s||isNaN(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+(sec<10?'0':'')+sec;}
    function shuf(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
    function fullscreen(){try{document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}}
    function showCtrl(){bottomControls.classList.add('visible');clearTimeout(hideControlsTimeout);hideControlsTimeout=setTimeout(()=>bottomControls.classList.remove('visible'),4000);}
    function fmtTempo(s){if(s<0)s=0;const m=Math.floor(s/60),sec=Math.floor(s%60);return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');}

    }

    function updTimer(){

    }
    function startTimer(){clearInterval(timerInterval);if(desbloqueado)return;timerInterval=setInterval(()=>{if(!desbloqueado){tempoRestante--;if(tempoRestante<=0){clearInterval(timerInterval);bloquear();}updTimer();}},1000);updTimer();}
    function bloquear(){desbloqueado=false;blockOverlay.classList.add('active');audio.pause();localStorage.setItem('vdb_bloqueado_permanente','true');localStorage.removeItem('vdb_desbloqueado');}
    function desbloquear(){desbloqueado=true;blockOverlay.classList.remove('active');localStorage.setItem('vdb_desbloqueado','true');localStorage.removeItem('vdb_bloqueado_permanente');timerTop.textContent='🔓 LIBERADO';}

    function carregarEstado(){
        if(localStorage.getItem('vdb_bloqueado_permanente')==='true'){playerContainer.classList.add('visible');loadingScreen.style.display='none';bloquear();return;}
        if(localStorage.getItem('vdb_desbloqueado')==='true'){desbloqueado=true;playerContainer.classList.add('visible');loadingScreen.style.display='none';timerTop.textContent='🔓 LIBERADO';iniciar();return;}
        const salvo=localStorage.getItem('vdb_tempo_restante');
        if(salvo&&parseInt(salvo)>Date.now()){tempoRestante=Math.floor((parseInt(salvo)-Date.now())/1000);playerContainer.classList.add('visible');loadingScreen.style.display='none';startTimer();iniciar();return;}
        if(salvo){playerContainer.classList.add('visible');loadingScreen.style.display='none';bloquear();return;}
        localStorage.setItem('vdb_tempo_restante',String(Date.now()+TEMPO_INICIAL*1000));
        tempoRestante=TEMPO_INICIAL;playerContainer.classList.add('visible');loadingScreen.style.display='none';startTimer();iniciar();

    function criarMidia(){
        const midias=[{t:'img',s:'vd14.png'},{t:'vid',s:'vai1.mp4'},{t:'img',s:'vd15.png'},{t:'img',s:'vd12.png'},{t:'img',s:'vd11.png'},{t:'img',s:'vd10.png'},{t:'img',s:'vai1.png'}];
        midias.forEach((m,i)=>{let el;if(m.t==='vid'){el=document.createElement('video');el.src=m.s;el.muted=true;el.playsInline=true;el.loop=true;el.load();}else{el=document.createElement('img');el.src=m.s;}el.className=i===0?'active':'inactive';mediaContainer.appendChild(el);if(i===0&&m.t==='vid')el.play().catch(()=>{});});
        const els=mediaContainer.children;if(els.length>1)mediaTimer=setInterval(()=>{const a=els[midiaAtual],b=els[(midiaAtual+1)%els.length];if(!a||!b)return;a.className='inactive';if(a.tagName==='VIDEO'){a.pause();}b.className='active';if(b.tagName==='VIDEO')b.play().catch(()=>{});midiaAtual=(midiaAtual+1)%els.length;},5000);
    }

    function silentAudio(){const sr=44100,ns=sr*5,b=new ArrayBuffer(44+ns*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};w(0,'RIFF');v.setUint32(4,36+ns*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,ns*2,true);return new Blob([b],{type:'audio/wav'});}

    function manutencao(){clearInterval(backgroundInterval);backgroundInterval=setInterval(async()=>{try{if(backgroundAudio.paused&&isBackgroundActive)backgroundAudio.play().catch(()=>{});if(isPlaying&&audio.paused&&!audio.ended)audio.play().catch(()=>{});if(audio.ended&&isPlaying)next();}catch(e){}},1000);}

    async function ativar(){
        try{showLoad(true);const u=URL.createObjectURL(silentAudio());backgroundAudio.src=u;backgroundAudio.loop=true;backgroundAudio.volume=0.001;await backgroundAudio.play();isBackgroundActive=true;audioStatus.textContent='● Ativado';audioStatus.classList.add('active');manutencao();if('wakeLock'in navigator)try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}showLoad(false);const b=document.querySelector('.btn-ativar-player');if(b)b.classList.add('hidden');await tocar();}
        catch(e){isBackgroundActive=true;audioStatus.textContent='● Ativado';showLoad(false);const b=document.querySelector('.btn-ativar-player');if(b)b.classList.add('hidden');await tocar();}
    }

    function urls(m){const s=m.src||'';if(!s)return[];if(s.startsWith('http'))return[s];const n=s.replace(/^\.\//,'').replace(/[^a-zA-Z0-9\-_.]/g,'');const r=REPOS[m.genero]||'play12';const u=['https://raw.githubusercontent.com/radiolojasjc-hub/'+r+'/refs/heads/main/'+n];TODOS_REPOS.forEach(x=>{if(x!==r)u.push('https://raw.githubusercontent.com/radiolojasjc-hub/'+x+'/refs/heads/main/'+n);});u.push(s);return u;}

    async function carregar(g){const u=GENRE_URLS[g];if(!u)return null;try{const c=new AbortController(),t=setTimeout(()=>c.abort(),15000),r=await fetch(u,{signal:c.signal});clearTimeout(t);let d=await r.json();if(!Array.isArray(d)){d=d.musicas||d.data||Object.values(d)[0];}return d.filter(m=>m.src&&m.title).map(m=>({...m,id:'g_'+Math.random().toString(36).slice(2),genero:g,artist:m.artist||'Artista'}));}catch(e){return null;}}

    async function selecionar(g){showLoad(true);const l=await carregar(g);if(!l||!l.length){showLoad(false);notif('Erro '+g);$('genresModal').classList.remove('open');return;}audio.pause();musicas=l;modoAtual=g;playlistAtual=shuf(musicas);indiceAtual=0;genreBadge.textContent=(EMOJIS[g]||'🎧')+' '+g;genreBadge.style.color=CORES[g]||'#fff';const m=playlistAtual[0];if(m){scrollText.textContent='🎵 '+m.title+' - '+m.artist+' ['+g+'] 🎵';scrollText.style.animation='none';scrollText.offsetHeight;scrollText.style.animation='scrollText 12s linear infinite';updHeart(m.id);}grid();showLoad(false);$('genresModal').classList.remove('open');fullscreen();if(isBackgroundActive)setTimeout(tocar,300);}

    function atual(){if(!playlistAtual.length)return null;if(indiceAtual>=playlistAtual.length){playlistAtual=shuf(musicas);indiceAtual=0;}return playlistAtual[indiceAtual];}
    function next(){if(carregandoMusica)return;indiceAtual=(indiceAtual+1)%playlistAtual.length;const t=atual();if(t&&isBackgroundActive)setTimeout(tocar,100);showCtrl();}
    function prev(){if(carregandoMusica)return;indiceAtual=(indiceAtual-1+playlistAtual.length)%playlistAtual.length;const t=atual();if(t&&isBackgroundActive)setTimeout(tocar,100);showCtrl();}

    async function tocar(){if(!isBackgroundActive||carregandoMusica||!musicas.length)return;carregandoMusica=true;const t=atual();if(!t){carregandoMusica=false;return;}scrollText.textContent='🎵 '+t.title+' - '+t.artist+' ['+t.genero+'] 🎵';scrollText.style.animation='none';scrollText.offsetHeight;scrollText.style.animation='scrollText 12s linear infinite';updHeart(t.id);audio.pause();audio.src='';const us=urls(t).slice(0,8);let ok=false;for(const u of us){try{const r=await new Promise(res=>{const to=setTimeout(()=>{audio.oncanplay=null;audio.onerror=null;res(false);},8000);audio.oncanplay=()=>{clearTimeout(to);res(true);};audio.onerror=()=>{clearTimeout(to);res(false);};audio.src=u;audio.load();});if(r){ok=true;break;}}catch(e){}}carregandoMusica=false;if(ok){try{await audio.play();isPlaying=true;playBtn.innerHTML='<i class="fas fa-pause"></i>';notif('✅ '+t.title);}catch(e){next();}}else{next();}}

    function togglePlay(){if(!isBackgroundActive){notif('🔊 Clique em ATIVAR!');return;}if(audio.paused)tocar();else{audio.pause();isPlaying=false;playBtn.innerHTML='<i class="fas fa-play"></i>';}showCtrl();}
    function toggleShuf(){shuffleMode=!shuffleMode;shuffleBtn.classList.toggle('active',shuffleMode);playlistAtual=shuf(musicas);notif(shuffleMode?'🔀 ON':'➡️ Seq');}

    function grid(){$('genresGrid').innerHTML='';ORDEM.forEach(g=>{const c=document.createElement('div');c.className='genre-card';c.style.borderColor=CORES[g];c.style.color=CORES[g];c.textContent=(EMOJIS[g]||'🎧')+' '+g;c.onclick=()=>selecionar(g);$('genresGrid').appendChild(c);});}
