        html,body{height:100%;margin:0;padding:0;background:#000;overflow:hidden;position:fixed;width:100%;top:0;left:0}

        #blockOverlay .btn-senha{background:linear-gradient(135deg,var(--neon-cyan),var(--neon-pink));border:none;padding:12px 30px;border-radius:40px;color:#000;font-weight:bold;font-size:1rem;cursor:pointer}
        #blockOverlay .erro-senha{color:#ff2d7f;font-size:.85rem;min-height:18px;margin-top:4px}
        #blockOverlay .preco-vitalicio{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#000;padding:6px 15px;border-radius:20px;font-weight:bold;font-size:.9rem;display:inline-block}

        .btn-ativar-player::before,.btn-ativar-player::after{content:'';position:absolute;top:-3px;left:-3px;right:-3px;bottom:-3px;border-radius:45px;border:2px solid transparent;animation:borderRotate 3s linear infinite;pointer-events:none}
        .btn-ativar-player::before{border-top-color:var(--neon-cyan);border-bottom-color:var(--neon-pink)}
        .btn-ativar-player::after{border-left-color:var(--neon-pink);border-right-color:var(--neon-cyan);animation-duration:2s;animation-direction:reverse}
        .btn-ativar-player.hidden{display:none !important}
        @keyframes borderRotate{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

        #adminPanel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,10,30,0.98);border-radius:20px;padding:20px;z-index:99999;width:90%;max-width:380px;border:1px solid #00f3ff;flex-direction:column;gap:10px;color:white}

    function carregarEstado(){

            playerContainer.classList.add('visible');

            bloquearPlayer();
            return;
        }
        if(localStorage.getItem('vdb_desbloqueado')==='true'){

            playerContainer.classList.add('visible');
            loadingScreen.style.display='none';
            timerTop.textContent='🔓 LIBERADO';
            timerTop.className='timer-top liberado';
            iniciarPlayer();
            return;
        }
        const salvo=localStorage.getItem('vdb_tempo_restante');
        if(salvo&&parseInt(salvo)>Date.now()){
            tempoRestante=Math.floor((parseInt(salvo)-Date.now())/1000);
            playerContainer.classList.add('visible');
            loadingScreen.style.display='none';
            iniciarTimer();
            iniciarPlayer();
            return;
        }
        if(salvo&&parseInt(salvo)<=Date.now()){

            loadingScreen.style.display='none';
            bloquearPlayer();
            return;
        }
        localStorage.setItem('vdb_tempo_restante',String(Date.now()+TEMPO_INICIAL*1000));

    function alternarMidias(){

            const prox=els[proxIdx];
            if(!atual||!prox)return;
            atual.classList.remove('active');atual.classList.add('inactive');
            if(atual.tagName==='VIDEO'){atual.pause();atual.currentTime=0;}
            prox.classList.remove('inactive');prox.classList.add('active');
            if(prox.tagName==='VIDEO'){prox.play().catch(()=>{});}
            midiaAtual=proxIdx;
        },5000);
    }

    function createSilentAudio(){
        const sr=44100,dur=5,ns=sr*dur;
        const buf=new ArrayBuffer(44+ns*2);
        const v=new DataView(buf);
        const ws=(off,str)=>{for(let i=0;i<str.length;i++)v.setUint8(off+i,str.charCodeAt(i));};
        ws(0,'RIFF');v.setUint32(4,36+ns*2,true);ws(8,'WAVE');
        ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);
        v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);
        v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');
        v.setUint32(40,ns*2,true);
        return new Blob([buf],{type:'audio/wav'});
    }

    function gerarUrlsAlternativas(musica){
        var urls=[];
        var src=musica.src||'';
        if(!src||!src.trim())return[];
        if(src.startsWith('http://')||src.startsWith('https://'))return[src];
        var nome=src.replace(/^\.\//,'').replace(/^\/+/,'');
        nome=nome.replace(/[^a-zA-Z0-9\-_.]/g,'');
        if(!nome)return[];
        var repoPrincipal=REPOS[musica.genero]||'play12';
        urls.push('https://raw.githubusercontent.com/radiolojasjc-hub/'+repoPrincipal+'/refs/heads/main/'+nome);
        TODOS_REPOS.forEach(function(repo){
            if(repo!==repoPrincipal){urls.push('https://raw.githubusercontent.com/radiolojasjc-hub/'+repo+'/refs/heads/main/'+nome);}
        });
        urls.push(src);
        return urls;
    }

    async function carregarPlaylistPorGenero(genero){
        const url=GENRE_URLS[genero];
        if(!url)return null;
        try{
            const controller=new AbortController();
            const timeoutId=setTimeout(()=>controller.abort(),15000);
            const r=await fetch(url,{signal:controller.signal});
            clearTimeout(timeoutId);
            if(!r.ok)throw new Error('HTTP '+r.status);
            let d=await r.json();
            if(!Array.isArray(d)){if(d.musicas)d=d.musicas;else if(d.data)d=d.data;else d=Object.values(d)[0];}
            const lista=d.filter(m=>m.src&&m.title);
            lista.forEach(m=>{m.id='gen_'+genero+'_'+Math.random().toString(36).substr(2,6);m.genero=genero;if(!m.artist)m.artist='Artista';});
            return lista;
        }catch(e){return null;}
    }

    async function selecionarGenero(genero){
        showLoad(true);

        if(!lista||lista.length===0){

            showNotification('❌ Erro ao carregar '+genero,2000);
            document.getElementById('genresModal').classList.remove('open');
            return;

        audio.pause();audio.src='';audio.load();

        genreBadge.textContent=(EMOJIS[genero]||'🎧')+' '+genero;

        showLoad(false);
        document.getElementById('genresModal').classList.remove('open');
        goFullscreen();
        if(isBackgroundActive)setTimeout(()=>playMusic(),300);
    }

    function obterMusicaAtual(){
        if(!playlistAtual||playlistAtual.length===0)return null;
        if(indiceAtual>=playlistAtual.length){playlistAtual=shuffleArray(musicas);indiceAtual=0;}
        return playlistAtual[indiceAtual]||null;
    }

    function avancarMusica(){
        if(!playlistAtual||playlistAtual.length===0){playlistAtual=shuffleArray(musicas);indiceAtual=0;}
        else{indiceAtual++;if(indiceAtual>=playlistAtual.length){playlistAtual=shuffleArray(musicas);indiceAtual=0;}}
        return obterMusicaAtual();
    }

    function voltarMusica(){
        if(!playlistAtual||playlistAtual.length===0){playlistAtual=shuffleArray(musicas);indiceAtual=0;}
        else{indiceAtual--;if(indiceAtual<0)indiceAtual=playlistAtual.length-1;}
        return obterMusicaAtual();
    }

    async function playMusic(){
        if(!isBackgroundActive||carregandoMusica||!musicas.length)return;
        carregandoMusica=true;
        const track=obterMusicaAtual();
        if(!track){carregandoMusica=false;return;}
        scrollText.textContent='🎵 '+track.title+' - '+track.artist+' ['+track.genero+'] 🎵';
        scrollText.style.animation='none';
        scrollText.offsetHeight;
        scrollText.style.animation='scrollText 12s linear infinite';
        updateHeart(track.id);
        audio.pause();audio.src='';audio.load();
        var urls=gerarUrlsAlternativas(track);
        if(track.src.startsWith('http'))urls=[track.src].concat(urls.filter(u=>u!==track.src));
        urls=urls.slice(0,8);
        if(urls.length===0){carregandoMusica=false;nextTrack();return;}
        var sucesso=false;
        for(var i=0;i<urls.length;i++){
            try{
                var ok=await new Promise((resolve)=>{
                    var timeout=setTimeout(()=>{audio.oncanplay=null;audio.onerror=null;resolve(false);},8000);
                    audio.oncanplay=()=>{clearTimeout(timeout);audio.oncanplay=null;audio.onerror=null;resolve(true);};
                    audio.onerror=()=>{clearTimeout(timeout);audio.oncanplay=null;audio.onerror=null;resolve(false);};
                    audio.src=urls[i];audio.load();
                });
                if(ok){sucesso=true;break;}
            }catch(e){}
        }
        carregandoMusica=false;
        if(sucesso){
            try{await audio.play();isPlaying=true;playBtn.innerHTML='<i class="fas fa-pause"></i>';showNotification('✅ '+track.title,1200);}
            catch(e){isPlaying=false;playBtn.innerHTML='<i class="fas fa-play"></i>';nextTrack();}
        }else{nextTrack();}
    }

    document.getElementById('senhaPermanente').addEventListener('keydown',(e)=>{if(e.key==='Enter')document.getElementById('btnSenhaPermanente').click();});
    document.getElementById('btnWhatsApp').addEventListener('click',()=>window.open('https://wa.me/'+NUMERO_WHATSAPP+'?text=Quero comprar a senha VITALÍCIA','_blank'));
    document.getElementById('btnPix').addEventListener('click',()=>navigator.clipboard.writeText(CHAVE_PIX).then(()=>showNotification('✅ PIX copiado!',1500)));

    document.getElementById('adminGerarBtn').addEventListener('click',()=>{
        const celular=document.getElementById('adminCelular').value.trim();
        const email=document.getElementById('adminEmail').value.trim();
        if(!celular)return;
        const expiracao=Date.now()+(100*365*24*60*60*1000);
        const senha=email+':'+celular+':'+expiracao+':'+btoa(email+celular+expiracao+SECRET_KEY).substring(0,40);
        document.getElementById('adminSenhaGerada').value=senha;
        document.getElementById('adminSenhaGerada').style.color='#4ade80';
    });
    document.getElementById('btnCopiarSenha').addEventListener('click',()=>{
        const texto=document.getElementById('adminSenhaGerada').value;
        if(texto)navigator.clipboard.writeText(texto).then(()=>showNotification('📋 Copiada!',1500));
    });
    document.getElementById('adminCloseBtn').addEventListener('click',()=>document.getElementById('adminPanel').classList.remove('open'));

    audio.addEventListener('timeupdate',()=>{if(audio.duration){progressFill.style.width=(audio.currentTime/audio.duration*100)+'%';currentTimeEl.textContent=formatTime(audio.currentTime);totalTimeEl.textContent=formatTime(audio.duration);}});
    audio.addEventListener('ended',()=>{if(!carregandoMusica)nextTrack();});
    audio.addEventListener('error',()=>{if(!carregandoMusica)nextTrack();});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&isPlaying&&isBackgroundActive){audio.play().catch(()=>{});}});
    window.addEventListener('beforeunload',()=>{if(backgroundInterval)clearInterval(backgroundInterval);if(timerInterval)clearInterval(timerInterval);if(mediaTimer)clearInterval(mediaTimer);if(letreiroInterval)clearInterval(letreiroInterval);if(sleepTimer)clearTimeout(sleepTimer);if(wakeLock)wakeLock.release().catch(()=>{});});

    const fabMain=document.getElementById('fabMain');
    const fabSub=document.getElementById('fabSub');
    fabMain.addEventListener('click',()=>{fabOpen=!fabOpen;fabSub.classList.toggle('open',fabOpen);fabMain.innerHTML=fabOpen?'<i class="fas fa-times"></i>':'<i class="fas fa-plus"></i>';});
    document.getElementById('fabGeneros').addEventListener('click',()=>{buildGenresGrid();document.getElementById('genresModal').classList.add('open');fabMain.click();});
    document.getElementById('closeGenresBtn').addEventListener('click',()=>document.getElementById('genresModal').classList.remove('open'));
    document.getElementById('fabYoutube').addEventListener('click',()=>{window.open('https://sites.google.com/view/rogersjc/in%C3%ADcio','_blank');fabMain.click();});
    document.getElementById('fabShare').addEventListener('click',()=>{navigator.clipboard.writeText(location.href).then(()=>showNotification('📋 Link copiado!',1500));fabMain.click();});
    document.getElementById('fabQrCode').addEventListener('click',()=>{window.open('https://api.qrserver.com/v1/create-qr-code/?data='+encodeURIComponent(location.href),'_blank');fabMain.click();});
    document.getElementById('fabFeedback').addEventListener('click',()=>{document.getElementById('feedbackModal').classList.add('open');fabMain.click();});

    document.querySelectorAll('.star').forEach(star=>{
        star.addEventListener('click',()=>{
            const r=parseInt(star.dataset.rating);
            document.querySelectorAll('.star').forEach((s,i)=>{s.className=i<r?'fas fa-star star active':'far fa-star star';});
        });
    });
    document.getElementById('sendFeedbackBtn').addEventListener('click',()=>{
        const comment=document.getElementById('feedbackText').value;
        const stars=document.querySelectorAll('.star.active').length;
        window.open('https://wa.me/'+NUMERO_WHATSAPP+'?text='+encodeURIComponent('🎵 VDB MUSIC ⭐'+'★'.repeat(stars)+'💬 '+comment),'_blank');
        document.getElementById('feedbackModal').classList.remove('open');
    });

    document.getElementById('favTopBtn').addEventListener('click',()=>{
        const favs=favorites.map(id=>musicas.find(m=>m.id===id)).filter(Boolean);
        const list=document.getElementById('favList');
        list.innerHTML='';
        if(favs.length===0){list.innerHTML='<div class="fav-empty">Nenhuma favorita</div>';}
        else{favs.forEach(m=>{
            const div=document.createElement('div');
            div.className='fav-item';
            div.innerHTML='<div class="info"><div class="title">'+m.title+'</div><div class="artist">'+m.artist+'</div></div><button class="remove" data-id="'+m.id+'"><i class="fas fa-times-circle"></i></button>';
            div.querySelector('.remove').addEventListener('click',(e)=>{e.stopPropagation();toggleFavorito(m.id);document.getElementById('favTopBtn').click();});
            list.appendChild(div);
        });}
        document.getElementById('favModal').classList.add('open');
    });
    document.getElementById('closeFavModal').addEventListener('click',()=>document.getElementById('favModal').classList.remove('open'));
    document.getElementById('closeFavBtn').addEventListener('click',()=>document.getElementById('favModal').classList.remove('open'));

    window.openGenres=()=>{buildGenresGrid();document.getElementById('genresModal').classList.add('open');};
    let adminClicks=0;
    window.ativarAdmin=function(){adminClicks++;setTimeout(()=>adminClicks=0,1500);if(adminClicks>=5){adminClicks=0;document.getElementById('adminPanel').classList.toggle('open');}};

    carregarEstado();
})();
</script>
</body>
</html>
