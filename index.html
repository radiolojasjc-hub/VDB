<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vai de Boa! Music</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height:100%; margin:0; padding:0; background:#000; overflow:hidden; position:fixed; width:100%; top:0; left:0; }
        body { background:#000; overflow:hidden; }
        :root { --neon-cyan: #00f3ff; --neon-pink: #ff2d7f; }
        .media-container { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:0; background:#000; }
        .media-container video, .media-container img { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; transition:opacity 1s ease; opacity:0; z-index:1; }
        .media-container .active { opacity:1; z-index:3; }
        .media-container .inactive { opacity:0; z-index:0; }
        .project-title { position:fixed; top:12%; left:50%; transform:translateX(-50%); z-index:9999; color:white; font-size:2.2rem; font-weight:900; text-shadow:0 0 30px rgba(0,243,255,0.5), 0 0 60px rgba(255,45,127,0.3); letter-spacing:6px; text-align:center; background:rgba(0,0,0,0.3); padding:10px 25px; border-radius:20px; backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,0.1); display:block; }
        .project-title span { color:var(--neon-cyan); }
        .btn-ativar { position:fixed; bottom:30%; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#00f3ff,#00d4ff); color:#000; padding:18px 40px; border-radius:60px; font-weight:900; font-size:1.4rem; z-index:10000; cursor:pointer; border:none; box-shadow:0 0 40px rgba(0,243,255,0.5); letter-spacing:2px; text-transform:uppercase; white-space:nowrap; transition:0.3s; display:block; animation:pulseModern 2s infinite; }
        .btn-ativar:hover { transform:translateX(-50%) scale(1.05); box-shadow:0 0 60px rgba(0,243,255,0.8); }
        .btn-ativar:active { transform:translateX(-50%) scale(0.95); }
        .btn-ativar .subtitulo { display:block; font-size:0.6rem; font-weight:400; letter-spacing:4px; opacity:0.7; margin-top:2px; }
        @keyframes pulseModern { 0% { box-shadow:0 0 30px rgba(0,243,255,0.3); } 50% { box-shadow:0 0 60px rgba(0,243,255,0.7); } 100% { box-shadow:0 0 30px rgba(0,243,255,0.3); } }
        .app { position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:10; display:block; flex-direction:column; background:transparent; }
        .top-bar { position:fixed; top:0; left:0; width:100%; z-index:35; display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:transparent; flex-wrap:nowrap; gap:4px; height:42px; }
        .genre-badge { background:rgba(0,0,0,0.3); padding:3px 8px; border-radius:30px; font-size:0.55rem; font-weight:bold; color:#fff; border-left:2px solid #00f3ff; display:flex; align-items:center; gap:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:30%; cursor:pointer; flex-shrink:1; min-width:40px; }
        .genre-badge:active { transform:scale(0.95); }
        .genre-badge.favoritos { border-left-color:#ff2d7f; color:#ff2d7f; background:rgba(255,45,127,0.15); }
        .top-buttons { display:flex; gap:4px; align-items:center; flex-wrap:nowrap; flex-shrink:0; }
        .fav-top-btn { background:rgba(255,45,127,0.15); border:1px solid #ff2d7f; color:#ff2d7f; padding:2px 8px; border-radius:30px; font-size:0.5rem; cursor:pointer; display:flex; align-items:center; gap:3px; flex-shrink:0; }
        .fav-top-btn:active { transform:scale(0.92); background:#ff2d7f; color:#000; }
        .fav-top-btn .badge { background:#ff2d7f; color:#000; border-radius:50%; padding:0 4px; font-size:0.45rem; font-weight:bold; min-width:14px; text-align:center; }
        .audio-status { font-size:0.45rem; color:#fff; display:flex; align-items:center; gap:3px; background:rgba(0,0,0,0.3); padding:1px 6px; border-radius:20px; border:1px solid rgba(255,255,255,0.2); flex-shrink:0; }
        .audio-status.active { color:#4ade80; border-color:#4ade80; }
        .audio-status .dot { width:4px; height:4px; border-radius:50%; background:#666; display:inline-block; }
        .audio-status.active .dot { background:#4ade80; animation:pulse-dot 1s infinite; }
        @keyframes pulse-dot { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
        .menu-button { background:rgba(0,0,0,0.3); color:white; width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.7rem; cursor:pointer; border:1px solid rgba(255,255,255,0.2); flex-shrink:0; }
        .menu-button:active { background:var(--neon-cyan); color:#000; }
        .menu-popup { position:absolute; top:42px; right:8px; background:rgba(0,0,0,0.85); backdrop-filter:blur(10px); border-radius:16px; padding:6px; z-index:32; display:none; flex-direction:column; gap:4px; border:1px solid var(--neon-cyan); min-width:130px; }
        .menu-popup.open { display:flex; }
        .menu-popup button { background:rgba(255,255,255,0.08); border:none; color:white; padding:5px 12px; border-radius:30px; font-size:0.6rem; display:flex; align-items:center; gap:6px; cursor:pointer; text-align:left; }
        .menu-popup button:active { background:var(--neon-cyan); color:#000; }
        .menu-popup .close-menu-btn { background:rgba(255,45,127,0.2); border:1px solid #ff2d7f; color:#ff2d7f; }
        .info-scroll { position:fixed; top:35px; left:0; right:0; z-index:30; background:transparent; padding:4px 12px; border-bottom:none; overflow:hidden; white-space:nowrap; height:32px; display:flex; align-items:center; }
        .info-scroll p { color:white; font-size:0.85rem; font-weight:900; letter-spacing:2px; animation:scrollText 20s linear infinite; display:inline-block; padding-right:50px; text-shadow:0 0 20px rgba(0,0,0,0.9); text-transform:uppercase; margin:0; }
        @keyframes scrollText { 0% { transform:translateX(100%); } 100% { transform:translateX(-100%); } }
        .now-playing { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; z-index:15; width:90%; max-width:400px; user-select:none; -webkit-user-select:none; margin-top:-10px; }
        .now-playing .music-title, .now-playing .music-artist { display:none; }
        .fav-heart-center { display:flex; justify-content:center; margin:0; }
        .now-playing .fav-heart { font-size:4rem; color:#555; cursor:pointer; transition:0.3s; text-shadow:0 0 30px rgba(0,0,0,0.9); display:inline-block; }
        .now-playing .fav-heart.active { color:#ff2d7f; text-shadow:0 0 40px rgba(255,45,127,0.5); }
        .now-playing .fav-heart:active { transform:scale(1.2); }
        .bottom-controls { position:fixed; bottom:0; left:0; right:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(12px); border-top:1px solid rgba(255,255,255,0.1); padding:6px 12px 10px; z-index:20; transform:translateY(100%); transition:0.3s; }
        .bottom-controls.visible { transform:translateY(0); }
        .progress-time { display:flex; justify-content:space-between; font-size:0.5rem; color:#ccc; margin-bottom:2px; }
        .progress-bar { height:3px; background:rgba(255,255,255,0.2); cursor:pointer; border-radius:4px; overflow:hidden; }
        .progress-fill { height:100%; background:linear-gradient(90deg, var(--neon-cyan), var(--neon-pink)); width:0%; border-radius:4px; }
        .buttons-row { display:flex; align-items:center; justify-content:center; gap:12px; margin-top:4px; }
        .ctrl-btn { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; font-size:0.8rem; width:34px; height:34px; border-radius:50%; cursor:pointer; }
        .ctrl-btn:active { transform:scale(0.92); background:var(--neon-cyan); color:#000; }
        .play-big { background:linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); width:44px; height:44px; font-size:1.1rem; color:#000; border:none; }
        .shuffle-btn { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; font-size:0.7rem; width:34px; height:34px; border-radius:50%; cursor:pointer; }
        .shuffle-btn.active { background:var(--neon-cyan); color:#000; border-color:var(--neon-cyan); }
        .fab-container { position:fixed; bottom:100px; right:12px; z-index:40; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
        .fab-main { background:rgba(0,0,0,0.4); backdrop-filter:blur(8px); width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:white; font-size:1.2rem; box-shadow:0 0 30px rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.1); }
        .fab-main:active { transform:scale(0.92); }
        .fab-main i { pointer-events:none; }
        .fab-sub { background:rgba(0,0,0,0.8); backdrop-filter:blur(14px); border-radius:30px; padding:5px; display:none; flex-direction:column; gap:3px; border:1px solid rgba(255,255,255,0.1); }
        .fab-sub.open { display:flex; }
        .fab-sub-btn { background:rgba(255,255,255,0.05); border:none; color:white; padding:6px 14px; border-radius:25px; font-size:0.65rem; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap; min-width:100px; }
        .fab-sub-btn:active { background:var(--neon-cyan); color:#000; }
        .fab-sub-btn i { font-size:0.85rem; width:18px; text-align:center; pointer-events:none; }
        .fab-sub-btn .fab-icon-youtube { color:#FF0000; }
        .notification { position:fixed; top:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); backdrop-filter:blur(10px); color:var(--neon-cyan); padding:3px 12px; border-radius:30px; font-size:0.55rem; z-index:10001; opacity:0; transition:0.3s; pointer-events:none; border-left:3px solid var(--neon-cyan); }
        .notification.show { opacity:1; }
        #loadingOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9998; align-items:center; justify-content:center; }
        #loadingOverlay.active { display:flex; }
        #loadingOverlay i { font-size:3rem; color:var(--neon-cyan); animation:spin 1s linear infinite; }
        @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
        .fav-modal, .feedback-modal, .historico-modal { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.9); background:rgba(20,20,40,0.95); backdrop-filter:blur(20px); border-radius:30px; padding:25px; z-index:5000; width:90%; max-width:420px; text-align:center; display:none; flex-direction:column; opacity:0; transition:0.3s; border:2px solid transparent; box-shadow:0 0 40px rgba(0,243,255,0.2); }
        .fav-modal.open, .feedback-modal.open, .historico-modal.open { display:flex; opacity:1; transform:translate(-50%,-50%) scale(1); border-image:linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)) 1; }
        .fav-modal h3, .feedback-modal h3, .historico-modal h3 { font-size:1.2rem; margin-bottom:15px; background:linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .fav-modal .close-fav, .historico-modal .close-hist { position:absolute; top:12px; right:16px; background:transparent; border:none; color:#888; font-size:1.5rem; cursor:pointer; }
        .fav-list, .historico-list { max-height:50vh; overflow-y:auto; text-align:left; margin-bottom:15px; }
        .fav-item, .historico-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.05); color:white; }
        .fav-item .info, .historico-item .info { flex:1; cursor:pointer; min-width:0; }
        .fav-item .info .title, .historico-item .info .title { font-weight:bold; font-size:0.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .fav-item .info .artist, .historico-item .info .artist { font-size:0.7rem; color:#aaa; }
        .fav-item .remove { background:transparent; border:none; color:#ff2d7f; font-size:1.1rem; cursor:pointer; padding:4px 8px; }
        .fav-empty { color:#888; padding:30px; text-align:center; }
        .fav-modal .close-btn, .historico-modal .close-btn { background:linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); border:none; padding:12px; border-radius:30px; color:#000; font-weight:bold; cursor:pointer; margin-top:0; font-size:0.95rem; }
        .search-fav { width:100%; padding:8px 12px; border-radius:30px; border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.08); color:white; font-size:0.8rem; margin-bottom:12px; outline:none; }
        .search-fav::placeholder { color:#666; }
        .search-fav:focus { border-color:var(--neon-cyan); }
        .fav-actions { display:flex; gap:6px; justify-content:center; margin-bottom:12px; flex-wrap:wrap; }
        .fav-actions button { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); color:#ccc; padding:4px 12px; border-radius:30px; font-size:0.6rem; cursor:pointer; display:flex; align-items:center; gap:4px; }
        .fav-actions button:active { background:var(--neon-cyan); color:#000; }
        .genres-modal { position:fixed; bottom:0; left:0; right:0; background:rgba(20,20,40,0.95); backdrop-filter:blur(20px); border-radius:30px 30px 0 0; padding:16px 10px 20px; z-index:2000; transform:translateY(100%); transition:0.3s; max-height:60vh; overflow-y:auto; border-top:2px solid transparent; border-image:linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)) 1; }
        .genres-modal.open { transform:translateY(0); }
        .genres-modal h3 { text-align:center; margin-bottom:12px; font-size:0.9rem; background:linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .genres-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
        .genre-card { border-radius:14px; cursor:pointer; border:2px solid rgba(255,255,255,0.12); aspect-ratio:4/2.4; background:rgba(255,255,255,0.04); display:flex; align-items:center; justify-content:center; text-align:center; color:white; font-weight:700; font-size:0.7rem; padding:6px; }
        .genre-card:active { transform:scale(0.94); }
        .genre-card.fav-card { border-color:#ff2d7f; background:rgba(255,45,127,0.15); }
        .close-genres { width:100%; padding:10px; background:linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); border:none; border-radius:30px; color:#000; font-size:0.8rem; cursor:pointer; font-weight:bold; }
        .feedback-modal .stars { display:flex; justify-content:center; gap:6px; margin:10px 0; }
        .feedback-modal .star { font-size:1.8rem; color:#555; cursor:pointer; transition:0.15s; }
        .feedback-modal .star.active { color:#ffd700; text-shadow:0 0 15px #ffd700; }
        .feedback-modal textarea { width:100%; height:80px; background:rgba(255,255,255,0.08); border:1px solid rgba(0,243,255,0.2); border-radius:15px; padding:10px; color:white; resize:none; font-size:0.85rem; }
        .feedback-modal textarea::placeholder { color:#666; }
        .feedback-modal button { background:linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); border:none; padding:12px; border-radius:30px; color:#000; font-weight:bold; cursor:pointer; margin-top:8px; font-size:0.95rem; }
        .feedback-modal button:active { transform:scale(0.95); }
        .feedback-modal .close-feedback { background:rgba(255,255,255,0.1) !important; color:white !important; margin-top:5px; }
        @media (max-width:480px) {
            .btn-ativar { padding:14px 24px; font-size:1rem; bottom:25%; }
            .btn-ativar .subtitulo { font-size:0.5rem; }
            .project-title { font-size:1.6rem; top:8%; padding:8px 16px; letter-spacing:3px; }
            .now-playing .fav-heart { font-size:3rem; }
            .genre-badge { font-size:0.45rem; max-width:22%; padding:2px 6px; }
            .fav-top-btn { font-size:0.45rem; padding:2px 6px; }
            .fab-main { width:42px; height:42px; font-size:1rem; }
            .fab-sub-btn { padding:5px 10px; font-size:0.55rem; min-width:85px; }
            .top-bar { padding:4px 6px; height:38px; }
            .info-scroll { top:32px; height:28px; padding:2px 10px; }
            .info-scroll p { font-size:0.7rem; letter-spacing:1px; }
            .ctrl-btn { width:28px; height:28px; font-size:0.65rem; }
            .play-big { width:36px; height:36px; font-size:0.9rem; }
            .buttons-row { gap:8px; }
            .bottom-controls { padding:4px 8px 8px; }
            .genres-grid { grid-template-columns:repeat(2,1fr); gap:8px; }
            .genre-card { font-size:0.6rem; aspect-ratio:4/2.2; }
            .audio-status { font-size:0.4rem; padding:1px 4px; }
            .fab-container { bottom:80px; right:8px; }
            .menu-button { width:24px; height:24px; font-size:0.6rem; }
            .fav-modal, .feedback-modal, .historico-modal { padding:20px; max-width:340px; }
            .feedback-modal .star { font-size:1.5rem; }
        }

        /* OVERLAY DE LICENÇA */
        #licenseOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:99999; align-items:center; justify-content:center; flex-direction:column; padding:20px; text-align:center; }
        #licenseOverlay.show { display:flex; }
        #licenseOverlay h2 { font-size:2rem; background:linear-gradient(135deg,#00f3ff,#ff2d7f); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        #licenseOverlay p { color:#aaa; margin-bottom:20px; font-size:1rem; }
        #licenseOverlay input { padding:12px 20px; border-radius:30px; border:2px solid #00f3ff; background:transparent; color:#fff; font-size:1rem; width:80%; max-width:300px; margin-bottom:15px; outline:none; text-align:center; }
        #licenseOverlay input:focus { border-color:#ff2d7f; }
        #licenseOverlay .btn-ativar-licenca { background:linear-gradient(135deg,#00f3ff,#ff2d7f); color:#000; border:none; padding:12px 30px; border-radius:30px; font-weight:bold; font-size:1rem; cursor:pointer; }
        #licenseOverlay .btn-ativar-licenca:active { transform:scale(0.95); }
        #licenseOverlay .timer-info { margin-top:15px; font-size:0.9rem; color:#888; }
        .status-badge { position:fixed; top:10px; right:10px; background:rgba(0,0,0,0.6); padding:4px 14px; border-radius:20px; font-size:0.7rem; border:1px solid #facc15; color:#facc15; z-index:50; }
        .status-badge.active { border-color:#4ade80; color:#4ade80; }
        .status-badge.blocked { border-color:#ff2d7f; color:#ff2d7f; }
    </style>
</head>
<body>

    <!-- Mídia -->
    <div class="media-container" id="mediaContainer"></div>

    <!-- Título -->
    <div class="project-title" id="projectTitle">🎵 <span>Vai de Boa!</span> Music</div>

    <!-- Botão Ativar -->
    <button class="btn-ativar" id="btnAtivar">▶ ATIVAR RÁDIO <span class="subtitulo">Vai de Boa! Music</span></button>

    <!-- App -->
    <div class="app" id="appContainer">
        <div class="top-bar" id="topBar">
            <div class="genre-badge" id="genreBadge" onclick="openGenres()">MPB</div>
            <div class="top-buttons">
                <span class="audio-status" id="audioStatus"><span class="dot"></span> Aguardando</span>
                <button class="fav-top-btn" id="favTopBtn"><i class="fas fa-heart"></i> <span class="badge" id="favCount">0</span></button>
                <div class="menu-button" id="menuButton"><i class="fas fa-ellipsis-v"></i></div>
            </div>
        </div>
        <div class="info-scroll" id="infoScroll"><p id="scrollText">🎵 VAI DE BOA! MUSIC - TOCANDO AGORA! 🎵</p></div>
        <div class="now-playing" id="nowPlaying">
            <div class="fav-heart-center"><div class="fav-heart" id="heartBtn"><i class="far fa-heart"></i></div></div>
        </div>
    </div>

    <!-- Overlay de Licença -->
    <div id="licenseOverlay">
        <h2>🔒 Ative o App</h2>
        <p id="licenseMsg">Seu período de teste expirou.<br>Insira o código de ativação.</p>
        <input type="text" id="licenseKey" placeholder="Código" autocomplete="off">
        <button class="btn-ativar-licenca" id="activateBtn">▶ ATIVAR</button>
        <div class="timer-info" id="timerInfo"></div>
    </div>

    <div class="status-badge" id="statusBadge">⏳ Teste</div>

    <!-- Modais (você pode manter os seus, mas vou deixar os essenciais) -->
    <div class="fav-modal" id="favModal">
        <button class="close-fav" id="closeFavModal"><i class="fas fa-times"></i></button>
        <h3><i class="fas fa-heart" style="color:#ff2d7f;"></i> Favoritas</h3>
        <div class="fav-list" id="favList"><div class="fav-empty">Nenhuma favorita</div></div>
        <button class="close-btn" id="closeFavBtn">FECHAR</button>
    </div>

    <div class="genres-modal" id="genresModal">
        <h3><i class="fas fa-head-side-brain"></i> ESCOLHA SEU ESTILO</h3>
        <div class="genres-grid" id="genresGrid"></div>
        <button class="close-genres" id="closeGenresBtn">FECHAR</button>
    </div>

    <div class="feedback-modal" id="feedbackModal">
        <h3><i class="fas fa-star"></i> Avalie</h3>
        <p style="color:#aaa;">Sua opinião é importante!</p>
        <div class="stars" id="starRating">
            <i class="far fa-star star" data-rating="1"></i>
            <i class="far fa-star star" data-rating="2"></i>
            <i class="far fa-star star" data-rating="3"></i>
            <i class="far fa-star star" data-rating="4"></i>
            <i class="far fa-star star" data-rating="5"></i>
        </div>
        <textarea id="feedbackText" placeholder="Escreva sua opinião..."></textarea>
        <button id="sendFeedbackBtn"><i class="fab fa-whatsapp"></i> Enviar</button>
        <button id="closeFeedbackBtn" class="close-feedback">Cancelar</button>
    </div>

    <div class="historico-modal" id="historicoModal">
        <button class="close-hist" id="closeHistModal"><i class="fas fa-times"></i></button>
        <h3><i class="fas fa-history"></i> Últimas Tocadas</h3>
        <div class="historico-list" id="historicoList"><div class="fav-empty">Nenhuma música</div></div>
        <button class="close-btn" id="closeHistBtn">FECHAR</button>
    </div>

    <!-- Controles -->
    <div class="bottom-controls" id="bottomControls">
        <div class="progress-time"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="buttons-row">
            <button class="ctrl-btn" id="prevBtn"><i class="fas fa-backward-step"></i></button>
            <button class="ctrl-btn play-big" id="playBtn"><i class="fas fa-play"></i></button>
            <button class="ctrl-btn" id="nextBtn"><i class="fas fa-forward-step"></i></button>
            <button class="shuffle-btn" id="shuffleBtn"><i class="fas fa-random"></i></button>
        </div>
    </div>

    <!-- FAB -->
    <div class="fab-container" id="fabContainer">
        <div class="fab-sub" id="fabSub">
            <button class="fab-sub-btn" id="fabGeneros"><i class="fas fa-guitar"></i> Gêneros</button>
            <button class="fab-sub-btn" id="fabFeedback"><i class="fas fa-star"></i> Feedback</button>
            <button class="fab-sub-btn" id="fabYoutube"><i class="fab fa-youtube fab-icon-youtube"></i> YouTube</button>
            <button class="fab-sub-btn" id="fabShare"><i class="fas fa-share-alt"></i> Compartilhar</button>
            <button class="fab-sub-btn" id="fabQrCode"><i class="fas fa-qrcode"></i> QR Code</button>
        </div>
        <div class="fab-main" id="fabMain"><i class="fas fa-plus"></i></div>
    </div>

    <!-- Menu -->
    <div class="menu-popup" id="menuPopup">
        <button class="close-menu-btn" id="closeMenuBtn"><i class="fas fa-times"></i> Fechar</button>
        <button id="fullscreenMenuBtn"><i class="fas fa-expand"></i> Tela Cheia</button>
        <button id="reloadPlaylistBtn"><i class="fas fa-sync"></i> Recarregar</button>
        <button id="btStatusMenuBtn"><i class="fab fa-bluetooth"></i> Bluetooth</button>
        <button id="feedbackMenuBtn"><i class="fas fa-star"></i> Feedback</button>
        <button id="sleepMenuBtn"><i class="fas fa-moon"></i> Sleep Timer</button>
        <button id="qrCodeMenuBtn"><i class="fas fa-qrcode"></i> QR Code</button>
    </div>

    <div class="notification" id="notification">Mensagem</div>
    <div id="loadingOverlay"><i class="fas fa-spinner fa-spin"></i></div>

    <audio id="musicPlayer" preload="auto"></audio>
    <audio id="backgroundAudio" preload="auto" style="display:none;"></audio>

    <script>
        (function() {
            'use strict';

            const MASTER_CODE = '123456';
            const TRIAL_MINUTES = 5;

            function isLicensed() { return localStorage.getItem('license_valid') === 'true'; }
            function getInstallDate() {
                let d = localStorage.getItem('install_date');
                if (!d) { d = new Date().toISOString(); localStorage.setItem('install_date', d); }
                return new Date(d);
            }
            function getRemainingMinutes() {
                const elapsed = (new Date() - getInstallDate()) / 1000 / 60;
                return Math.max(0, TRIAL_MINUTES - elapsed);
            }
            function isTrialExpired() { return getRemainingMinutes() <= 0; }

            function updateLicenseUI() {
                const badge = document.getElementById('statusBadge');
                if (isLicensed()) {
                    document.getElementById('licenseOverlay').classList.remove('show');
                    badge.textContent = '✅ Ativado';
                    badge.className = 'status-badge active';
                    return;
                }
                const remaining = getRemainingMinutes();
                if (remaining > 0) {
                    document.getElementById('licenseOverlay').classList.remove('show');
                    badge.textContent = `⏳ ${Math.ceil(remaining)} min`;
                    badge.className = 'status-badge';
                } else {
                    document.getElementById('licenseOverlay').classList.add('show');
                    badge.textContent = '⛔ Bloqueado';
                    badge.className = 'status-badge blocked';
                }
            }

            function activateLicense() {
                const code = document.getElementById('licenseKey').value.trim();
                if (code === MASTER_CODE) {
                    localStorage.setItem('license_valid', 'true');
                    document.getElementById('licenseOverlay').classList.remove('show');
                    alert('✅ Ativado com sucesso!');
                    updateLicenseUI();
                } else {
                    alert('❌ Código inválido');
                }
            }

            document.getElementById('activateBtn').addEventListener('click', activateLicense);
            document.getElementById('licenseKey').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') activateLicense();
            });

            // ========== PLAYER SIMULADO (para teste) ==========
            document.getElementById('playBtn').addEventListener('click', function() {
                if (isLicensed()) {
                    alert('🔊 Tocando música (versão liberada)');
                } else if (isTrialExpired()) {
                    document.getElementById('licenseOverlay').classList.add('show');
                } else {
                    alert('🔊 Teste grátis – música tocando!');
                }
            });

            document.getElementById('heartBtn').addEventListener('click', function() {
                this.classList.toggle('active');
            });

            // ========== INICIALIZAÇÃO ==========
            updateLicenseUI();
            setInterval(updateLicenseUI, 5000);

            // ========== FAVORITOS SIMPLES ==========
            let favorites = [];
            document.getElementById('favTopBtn').addEventListener('click', function() {
                const list = document.getElementById('favList');
                list.innerHTML = '<div class="fav-empty">Nenhuma favorita</div>';
                document.getElementById('favModal').classList.add('open');
            });
            document.getElementById('closeFavModal').addEventListener('click', function() {
                document.getElementById('favModal').classList.remove('open');
            });
            document.getElementById('closeFavBtn').addEventListener('click', function() {
                document.getElementById('favModal').classList.remove('open');
            });

            // ========== GÊNEROS ==========
            function openGenres() {
                const grid = document.getElementById('genresGrid');
                grid.innerHTML = '';
                const generos = ['MPB', 'POP', 'SERTANEJO', 'FORRÓ', 'SAMBA', 'BREGA', 'REGGAE', 'MODA TOP', 'RELIGIOSA', 'ROMÂNTICA', 'FLASHBACK'];
                generos.forEach(g => {
                    const card = document.createElement('div');
                    card.className = 'genre-card';
                    card.textContent = g;
                    card.onclick = function() { alert('🎵 ' + g + ' selecionado!'); };
                    grid.appendChild(card);
                });
                document.getElementById('genresModal').classList.add('open');
            }
            document.getElementById('closeGenresBtn').addEventListener('click', function() {
                document.getElementById('genresModal').classList.remove('open');
            });

            // ========== FEEDBACK ==========
            document.querySelectorAll('.star').forEach(star => {
                star.addEventListener('click', function() {
                    const rating = parseInt(this.dataset.rating);
                    document.querySelectorAll('.star').forEach((s, i) => {
                        if (i < rating) { s.classList.add('fas', 'active'); s.classList.remove('far'); }
                        else { s.classList.remove('fas', 'active'); s.classList.add('far'); }
                    });
                });
            });
            document.getElementById('sendFeedbackBtn').addEventListener('click', function() {
                const stars = document.querySelectorAll('.star.active').length;
                alert('⭐ ' + stars + ' estrelas! Obrigado!');
                document.getElementById('feedbackModal').classList.remove('open');
            });
            document.getElementById('closeFeedbackBtn').addEventListener('click', function() {
                document.getElementById('feedbackModal').classList.remove('open');
            });

            // ========== MENU ==========
            document.getElementById('menuButton').addEventListener('click', function() {
                document.getElementById('menuPopup').classList.toggle('open');
            });
            document.getElementById('closeMenuBtn').addEventListener('click', function() {
                document.getElementById('menuPopup').classList.remove('open');
            });
            document.getElementById('fullscreenMenuBtn').addEventListener('click', function() {
                document.getElementById('menuPopup').classList.remove('open');
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            });
            document.getElementById('sleepMenuBtn').addEventListener('click', function() {
                document.getElementById('menuPopup').classList.remove('open');
                alert('💤 Sleep Timer: 15 minutos (exemplo)');
            });
            document.getElementById('reloadPlaylistBtn').addEventListener('click', function() {
                document.getElementById('menuPopup').classList.remove('open');
                alert('🔄 Playlist recarregada!');
            });
            document.getElementById('btStatusMenuBtn').addEventListener('click', function() {
                document.getElementById('menuPopup').classList.remove('open');
                alert('🔍 Procurando Bluetooth... (simulação)');
            });
            document.getElementById('feedbackMenuBtn').addEventListener('click', function() {
                document.getElementById('menuPopup').classList.remove('open');
                document.getElementById('feedbackModal').classList.add('open');
            });
            document.getElementById('qrCodeMenuBtn').addEventListener('click', function() {
                document.getElementById('menuPopup').classList.remove('open');
                alert('📲 QR Code gerado! (simulação)');
            });

            // ========== FAB ==========
            document.getElementById('fabMain').addEventListener('click', function() {
                document.getElementById('fabSub').classList.toggle('open');
            });
            document.getElementById('fabGeneros').addEventListener('click', function() {
                openGenres();
                document.getElementById('fabSub').classList.remove('open');
            });
            document.getElementById('fabFeedback').addEventListener('click', function() {
                document.getElementById('feedbackModal').classList.add('open');
                document.getElementById('fabSub').classList.remove('open');
            });
            document.getElementById('fabYoutube').addEventListener('click', function() {
                window.open('https://sites.google.com/view/rogersjc/in%C3%ADcio', '_blank');
                document.getElementById('fabSub').classList.remove('open');
            });
            document.getElementById('fabShare').addEventListener('click', function() {
                if (navigator.share) {
                    navigator.share({ title: 'Vai de Boa! Music', text: '🎵 Ouça também!', url: location.href });
                } else {
                    alert('📋 Link copiado! (simulação)');
                }
                document.getElementById('fabSub').classList.remove('open');
            });
            document.getElementById('fabQrCode').addEventListener('click', function() {
                alert('📲 QR Code: ' + location.href);
                document.getElementById('fabSub').classList.remove('open');
            });

            // ========== BOTÃO ATIVAR RÁDIO ==========
            document.getElementById('btnAtivar').addEventListener('click', function() {
                this.style.display = 'none';
                alert('🔊 Áudio ativado! (simulação)');
            });

        })();
    </script>
</body>
</html>
