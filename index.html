    const SEGREDO = 'vdb_secret_2026_@#$%'; // ALTERE PARA UM VALOR ÚNICO

    // ============================================================

    const $ = (id) => document.getElementById(id);

    // ============================================================
    // 3. ESTADO PRIVADO
    // ============================================================
    const _state = {
        tempoRestante: TEMPO_INICIAL,
        desbloqueado: false,
        timerInterval: null,
        backgroundInterval: null,
        wakeLock: null,
        musicas: [],
        playlistAtual: [],
        indiceAtual: 0,
        isPlaying: false,
        shuffleMode: false,

        modoAtual: 'BÔNUS',

        hideControlsTimeout: null,
        midiaAtual: 0,
        mediaTimer: null,
        modoFavoritos: false,
        tentativas: 0,

        bannerInterval: null,
        bannerTimeout: null,
    };

    // ============================================================
    // 4. TOKEN HMAC (substitui booleano)
    // ============================================================
    function _gerarToken(expiraEmSegundos) {
        const payload = { exp: Date.now() + expiraEmSegundos * 1000 };
        const base64 = btoa(JSON.stringify(payload));
        const assinatura = btoa(SEGREDO + base64);
        return base64 + '.' + assinatura;
    }

    function _validarToken(token) {
        if (!token) return false;
        const partes = token.split('.');
        if (partes.length !== 2) return false;
        const [base64, assinatura] = partes;
        if (btoa(SEGREDO + base64) !== assinatura) return false;
        try {
            const payload = JSON.parse(atob(base64));
            if (Date.now() > payload.exp) return false;
            return true;
        } catch (e) {
            return false;
        }
    }

    // ============================================================
    // 5. BLOQUEIO / DESBLOQUEIO
    // ============================================================
    function _bloquear() {
        _state.desbloqueado = false;
        localStorage.removeItem('vdb_token');
        dom.blockOverlay.classList.add('active');
        dom.audio.pause();
        _state.isPlaying = false;
        dom.playBtn.innerHTML = '<i class="fas fa-play"></i>';
    }

    function _desbloquear() {
        _state.desbloqueado = true;
        const token = _gerarToken(315360000); // 10 anos
        localStorage.setItem('vdb_token', token);
        dom.blockOverlay.classList.remove('active');
        dom.timerLib.textContent = '🔓 Lib';
        dom.timerLib.className = 'timer-lib lib';
        dom.bannerVitalicio.classList.remove('active');
        clearInterval(_state.bannerTimeout);
        notif('✅ Acesso liberado!');
    }

    function _verificarAcessoInicial() {
        const token = localStorage.getItem('vdb_token');
        if (_validarToken(token)) {
            _state.desbloqueado = true;
            dom.timerLib.textContent = '🔓 Lib';
            dom.timerLib.className = 'timer-lib lib';
            dom.blockOverlay.classList.remove('active');
            return true;
        } else {
            _state.desbloqueado = false;
            const salvo = localStorage.getItem('vdb_tempo_restante');
            if (salvo && parseInt(salvo) > Date.now()) {
                _state.tempoRestante = Math.floor((parseInt(salvo) - Date.now()) / 1000);
                startTimer();
            } else if (salvo) {
                _bloquear();
            } else {
                localStorage.setItem('vdb_tempo_restante', String(Date.now() + TEMPO_INICIAL * 1000));
                _state.tempoRestante = TEMPO_INICIAL;
                startTimer();
            }
            return false;
        }
    }

    // ============================================================
    // 6. ANTI‑DEBUG
    // ============================================================
    function _antiDebug() {
        (function detect() {
            const element = new Image();
            Object.defineProperty(element, 'id', {
                get: function() {
                    localStorage.removeItem('vdb_token');
                    _state.desbloqueado = false;
                    alert('🚫 DevTools detectado! Player bloqueado.');
                    location.reload();
                }
            });
            console.log('%c', element);
            setTimeout(detect, 1000);
        })();

        setInterval(() => {
            const start = performance.now();
            debugger;
            const time = performance.now() - start;
            if (time > 100) {
                localStorage.removeItem('vdb_token');
                _state.desbloqueado = false;
                alert('🚫 Bloqueado por Debug!');
                location.reload();
            }
        }, 2000);
    }

    // ============================================================
    // 7. UTILIDADES
    // ============================================================
    function fmt(segundos) {
        if (!segundos || isNaN(segundos)) return '0:00';
        const m = Math.floor(segundos / 60);
        const s = Math.floor(segundos % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function fmtTempo(segundos) {
        if (segundos < 0) segundos = 0;
        const m = Math.floor(segundos / 60);
        const s = Math.floor(segundos % 60);
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    function shuf(arr) {
        const x = [...arr];
        for (let i = x.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [x[i], x[j]] = [x[j], x[i]];
        }
        return x;
    }

    function sanitize(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.textContent;
    }

    // ============================================================
    // 8. NOTIFICAÇÕES
    // ============================================================
    function notif(msg, dur = 1500) {
        if (!dom.notification) return;
        dom.notification.textContent = msg;
        dom.notification.classList.add('show');
        clearTimeout(dom.notification._timeout);
        dom.notification._timeout = setTimeout(() => {
            dom.notification.classList.remove('show');
        }, dur);
    }

    function showLoad(show) {
        dom.loadingOverlay.classList.toggle('active', show);
    }

    function showControls() {
        dom.bottomControls.classList.add('visible');
        clearTimeout(_state.hideControlsTimeout);
        _state.hideControlsTimeout = setTimeout(() => {
            dom.bottomControls.classList.remove('visible');
        }, 4000);
    }

    function fullscreen() {
        try {
            document.documentElement.requestFullscreen().catch(() => {});
        } catch (e) {}
    }

    // ============================================================
    // 9. BANNER VITALÍCIO
    // ============================================================
    function mostrarBannerVitalicio() {
        if (_state.desbloqueado) return;
        if (dom.bannerVitalicio.classList.contains('active')) return;
        dom.bannerVitalicio.classList.add('active');
        let segundos = 20;
        dom.bannerTimer.textContent = segundos + 's';
        clearInterval(_state.bannerTimeout);
        _state.bannerTimeout = setInterval(() => {
            segundos--;
            dom.bannerTimer.textContent = segundos + 's';
            if (segundos <= 0) {
                clearInterval(_state.bannerTimeout);
                dom.bannerVitalicio.classList.remove('active');
            }
        }, 1000);
    }

    function iniciarBannerLoop() {
        setTimeout(() => {
            if (!_state.desbloqueado) mostrarBannerVitalicio();
        }, 30000);
        clearInterval(_state.bannerInterval);
        _state.bannerInterval = setInterval(() => {
            if (!_state.desbloqueado) mostrarBannerVitalicio();
        }, 300000);
    }

    // ============================================================
    // 10. FAVORITOS
    // ============================================================
    function carregarFav() {
        try {
            const data = localStorage.getItem('vfav');
            _state.favorites = data ? JSON.parse(data) : [];
            if (!Array.isArray(_state.favorites)) _state.favorites = [];
        } catch (e) {
            _state.favorites = [];
        }
        updateFavBadge();
    }

    function salvarFav() {
        try {
            localStorage.setItem('vfav', JSON.stringify(_state.favorites));
            updateFavBadge();
        } catch (e) {}
    }

    function updateFavBadge() {
        dom.favBadge.textContent = _state.favorites.length;
    }

    function updateHeart(id) {
        if (_state.favorites.includes(id)) {
            dom.heartBtn.className = 'fav-heart active';
            dom.heartBtn.innerHTML = '<i class="fas fa-heart"></i>';
        } else {
            dom.heartBtn.className = 'fav-heart';
            dom.heartBtn.innerHTML = '<i class="far fa-heart"></i>';
        }
    }

    function toggleFav(id) {
        if (!id) return;
        const idx = _state.favorites.indexOf(id);
        if (idx > -1) {
            _state.favorites.splice(idx, 1);
            notif('💔 Removido');
        } else {
            _state.favorites.push(id);
            notif('❤️ Adicionado');
        }
        salvarFav();
        updateHeart(id);
    }

    // ============================================================
    // 11. PLAYLIST
    // ============================================================
    const GENRE_URLS = {
        'BÔNUS': 'https://raw.githubusercontent.com/radiolojasjc-hub/play12/refs/heads/main/play.json?_=' + VERSAO,
        'FLASHBACK': 'https://raw.githubusercontent.com/radiolojasjc-hub/flashbacktop/refs/heads/main/flashback.json?_=' + VERSAO,
        'RELIGIOSA': 'https://raw.githubusercontent.com/radiolojasjc-hub/religiosa/refs/heads/main/religiosa.json?_=' + VERSAO,
        'ROMÂNTICA': 'https://raw.githubusercontent.com/radiolojasjc-hub/romanticatop/refs/heads/main/romantica.json?_=' + VERSAO,
        'MPB': 'https://raw.githubusercontent.com/radiolojasjc-hub/mpbtop/refs/heads/main/mpb.json?_=' + VERSAO,
        'POP': 'https://raw.githubusercontent.com/radiolojasjc-hub/poptop/refs/heads/main/pop.json?_=' + VERSAO,
        'SERTANEJO': 'https://raw.githubusercontent.com/radiolojasjc-hub/sertanejo/refs/heads/main/sertanejo.json?_=' + VERSAO,
        'FORRÓ': 'https://raw.githubusercontent.com/radiolojasjc-hub/forrodez/refs/heads/main/forrodez.json?_=' + VERSAO,
        'SAMBA': 'https://raw.githubusercontent.com/radiolojasjc-hub/sambatop/refs/heads/main/samba.json?_=' + VERSAO,
        'BREGA': 'https://raw.githubusercontent.com/radiolojasjc-hub/bregatop/refs/heads/main/brega.json?_=' + VERSAO,
        'REGGAE': 'https://raw.githubusercontent.com/radiolojasjc-hub/reggaetop/refs/heads/main/reggae.json?_=' + VERSAO,
        'MODA TOP': 'https://raw.githubusercontent.com/radiolojasjc-hub/modatop/refs/heads/main/moda.json?_=' + VERSAO,
        'FANK': 'https://raw.githubusercontent.com/radiolojasjc-hub/fank/refs/heads/main/fank.json?_=' + VERSAO,
        'TESTE MIDIA': 'https://raw.githubusercontent.com/radiolojasjc-hub/testemidias/refs/heads/main/teste.json?_=' + VERSAO,
        'MODÃO SERTANEJO': 'https://raw.githubusercontent.com/radiolojasjc-hub/modasertaneja/refs/heads/main/modaosert.json?_=' + VERSAO,
        'CHORINHO': 'https://raw.githubusercontent.com/radiolojasjc-hub/chorinho/refs/heads/main/chorinho.json?_=' + VERSAO,
    };

    const CORES = {
        'BÔNUS': '#ffd700',
        'FLASHBACK': '#ffaa00',
        'RELIGIOSA': '#aa55ff',
        'ROMÂNTICA': '#ff2d7f',
        'MPB': '#00ff88',
        'POP': '#ff3366',
        'SERTANEJO': '#ff8800',
        'FORRÓ': '#ff8800',
        'SAMBA': '#ffdd00',
        'BREGA': '#ff66aa',
        'REGGAE': '#00ffaa',
        'MODA TOP': '#ff4400',
        'FANK': '#ff3366',
        'TESTE MIDIA': '#ffd700',
        'MODÃO SERTANEJO': '#ff8c00',
        'CHORINHO': '#1e90ff',
    };

    const ORDEM = [
        'BÔNUS', 'MPB', 'POP', 'SERTANEJO', 'FORRÓ', 'SAMBA', 'BREGA', 'REGGAE',
        'MODA TOP', 'RELIGIOSA', 'ROMÂNTICA', 'FLASHBACK', 'FANK', 'TESTE MIDIA',
        'MODÃO SERTANEJO', 'CHORINHO'
    ];

    const REPOS = {
        'BÔNUS': 'play12', 'MPB': 'mpbtop', 'POP': 'poptop', 'SERTANEJO': 'sertanejo',
        'FORRÓ': 'forrodez', 'SAMBA': 'sambatop', 'BREGA': 'bregatop', 'REGGAE': 'reggaetop',
        'MODA TOP': 'modatop', 'RELIGIOSA': 'religiosa', 'ROMÂNTICA': 'romanticatop',
        'FLASHBACK': 'flashbacktop', 'FANK': 'fank', 'TESTE MIDIA': 'testemidias',
        'MODÃO SERTANEJO': 'modasertaneja', 'CHORINHO': 'chorinho'
    };

    const TODOS_REPOS = [
        'play12', 'mpbtop', 'poptop', 'sertanejo', 'forrodez', 'sambatop', 'bregatop',
        'reggaetop', 'modatop', 'religiosa', 'romanticatop', 'flashbacktop', 'fank',
        'testemidias', 'modasertaneja', 'chorinho'
    ];

    function getUrls(musica) {
        const src = musica.src || '';
        if (!src) return [];
        if (src.startsWith('http')) return [src];
        const nome = src.replace(/^\.\//, '').replace(/[^a-zA-Z0-9\-_.]/g, '');
        const repo = REPOS[musica.genero] || 'play12';
        const urls = [
            'https://raw.githubusercontent.com/radiolojasjc-hub/' + repo + '/refs/heads/main/' + nome + '?_=' + VERSAO
        ];
        TODOS_REPOS.forEach(r => {
            if (r !== repo) {
                urls.push('https://raw.githubusercontent.com/radiolojasjc-hub/' + r + '/refs/heads/main/' + nome + '?_=' + VERSAO);
            }
        });
        urls.push(src + '?_=' + VERSAO);
        return urls;
    }

    async function carregarPlaylist(genero) {
        const url = GENRE_URLS[genero];
        if (!url) return null;
        try {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 15000);
            const response = await fetch(url, { signal: controller.signal, cache: 'no-store' });
            clearTimeout(timeout);
            let data = await response.json();
            if (!Array.isArray(data)) {
                data = data.musicas || data.data || Object.values(data)[0];
            }
            const musicas = data.filter(m => m.src && m.title).map(m => ({
                ...m,
                id: 'g_' + Math.random().toString(36).slice(2),
                genero: genero,
                artist: m.artist || 'Artista'
            }));
            return musicas;
        } catch (e) {
            return null;
        }
    }

    function atualizarPlaylist() {
        if (!_state.playlistAtual.length) return null;
        if (_state.indiceAtual >= _state.playlistAtual.length) {
            if (_state.modoFavoritos) {
                _state.modoFavoritos = false;
                _state.playlistAtual = shuf(_state.musicas);
                _state.indiceAtual = 0;
                dom.generoNome.textContent = _state.modoAtual;
                dom.generoNome.style.color = CORES[_state.modoAtual] || '#fff';
                notif('🎵 Voltei para ' + _state.modoAtual);
            } else {
                _state.playlistAtual = shuf(_state.musicas);
                _state.indiceAtual = 0;
            }
        }
        return _state.playlistAtual[_state.indiceAtual];
    }

    function atualizarLetreiro(musica) {
        if (_state.scrollPersonalizado) return;
        if (!musica) return;
        const texto = sanitize(musica.title) + ' - ' + sanitize(musica.artist) + ' [' + musica.genero + '] 🎵';
        dom.scrollText.textContent = texto;
        dom.scrollText.style.animation = 'none';
        dom.scrollText.offsetHeight;
        dom.scrollText.style.animation = 'scrollText 14s linear infinite';
    }

    // ============================================================
    // 12. PLAYER ENGINE
    // ============================================================
    function criarSilentAudio() {
        const sr = 44100;
        const ns = sr * 5;
        const buffer = new ArrayBuffer(44 + ns * 2);
        const view = new DataView(buffer);
        const write = (offset, str) => {
            for (let i = 0; i < str.length; i++) {
                view.setUint8(offset + i, str.charCodeAt(i));
            }
        };
        write(0, 'RIFF');
        view.setUint32(4, 36 + ns * 2, true);
        write(8, 'WAVE');
        write(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sr, true);
        view.setUint32(28, sr * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        write(36, 'data');
        view.setUint32(40, ns * 2, true);
        return new Blob([buffer], { type: 'audio/wav' });
    }

    function manterAudioAtivo() {
        clearInterval(_state.backgroundInterval);
        _state.backgroundInterval = setInterval(async () => {
            try {
                if (dom.backgroundAudio.paused && _state.isBackgroundActive) {
                    dom.backgroundAudio.play().catch(() => {});
                }
                if (_state.isPlaying && dom.audio.paused && !dom.audio.ended) {
                    dom.audio.play().catch(() => {});
                }
                if (dom.audio.ended && _state.isPlaying) {
                    next();
                }
            } catch (e) {}
        }, 1000);
    }

    async function ativarPlayer() {
        try {
            showLoad(true);
            const url = URL.createObjectURL(criarSilentAudio());
            dom.backgroundAudio.src = url;
            dom.backgroundAudio.loop = true;
            dom.backgroundAudio.volume = 0.001;
            await dom.backgroundAudio.play();
            _state.isBackgroundActive = true;
            dom.audioStatus.classList.add('active');
            manterAudioAtivo();
            if ('wakeLock' in navigator) {
                try {
                    _state.wakeLock = await navigator.wakeLock.request('screen');
                } catch (e) {}
            }
            showLoad(false);
            const btn = document.querySelector('.btn-ativar-player');
            if (btn) btn.classList.add('hidden');
            await tocar();
        } catch (e) {
            _state.isBackgroundActive = true;
            dom.audioStatus.classList.add('active');
            showLoad(false);
            const btn = document.querySelector('.btn-ativar-player');
            if (btn) btn.classList.add('hidden');
            await tocar();
        }
    }

    async function tocar() {
        if (!_state.isBackgroundActive || _state.carregandoMusica || !_state.musicas.length) return;

        if (!_validarToken(localStorage.getItem('vdb_token'))) {
            _state.desbloqueado = false;
            _state.isPlaying = false;
            dom.playBtn.innerHTML = '<i class="fas fa-play"></i>';
            _bloquear();
            return;
        }

        _state.carregandoMusica = true;
        const musica = atualizarPlaylist();
        if (!musica) {
            _state.carregandoMusica = false;
            return;
        }
        atualizarLetreiro(musica);
        updateHeart(musica.id);

        dom.audio.pause();
        dom.audio.src = '';
        const urls = getUrls(musica).slice(0, 8);
        let ok = false;
        for (const url of urls) {
            try {
                const loaded = await new Promise(res => {
                    const timeout = setTimeout(() => {
                        dom.audio.oncanplay = null;
                        dom.audio.onerror = null;
                        res(false);
                    }, 8000);
                    dom.audio.oncanplay = () => {
                        clearTimeout(timeout);
                        res(true);
                    };
                    dom.audio.onerror = () => {
                        clearTimeout(timeout);
                        res(false);
                    };
                    dom.audio.src = url;
                    dom.audio.load();
                });
                if (loaded) { ok = true; break; }
            } catch (e) {}
        }
        _state.carregandoMusica = false;
        if (ok) {
            try {
                await dom.audio.play();
                _state.isPlaying = true;
                dom.playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            } catch (e) {
                next();
            }
        } else {
            next();
        }
    }

    function togglePlay() {
        if (!_state.isBackgroundActive) {
            notif('🔊 Clique em ATIVAR!');
            return;
        }
        if (dom.audio.paused) {
            tocar();
        } else {
            dom.audio.pause();
            _state.isPlaying = false;
            dom.playBtn.innerHTML = '<i class="fas fa-play"></i>';
        }
        showControls();
    }

    function next() {
        if (_state.carregandoMusica) return;
        _state.indiceAtual = (_state.indiceAtual + 1) % _state.playlistAtual.length;
        if (_state.isBackgroundActive) setTimeout(tocar, 100);
        showControls();
    }

    function prev() {
        if (_state.carregandoMusica) return;
        _state.indiceAtual = (_state.indiceAtual - 1 + _state.playlistAtual.length) % _state.playlistAtual.length;
        if (_state.isBackgroundActive) setTimeout(tocar, 100);
        showControls();
    }

    function toggleShuffle() {
        _state.shuffleMode = !_state.shuffleMode;
        dom.shuffleBtn.classList.toggle('active', _state.shuffleMode);
        _state.playlistAtual = shuf(_state.musicas);
        notif(_state.shuffleMode ? '🔀 ON' : '➡️ Seq');
    }

    // ============================================================
    // 13. TIMER
    // ============================================================
    function updateTimerDisplay() {
        if (_state.desbloqueado) {
            dom.timerLib.textContent = '🔓 Lib';
            dom.timerLib.className = 'timer-lib lib';
            return;
        }
        dom.timerLib.textContent = fmtTempo(_state.tempoRestante);
        dom.timerLib.className = 'timer-lib';
        dom.timerLib.style.color = _state.tempoRestante <= 60 ? '#ff2d7f' : 'var(--neon-cyan)';
        if (_state.tempoRestante <= 0) {
            clearInterval(_state.timerInterval);
            _bloquear();
        }
    }

    function startTimer() {
        clearInterval(_state.timerInterval);
        if (_state.desbloqueado) return;
        _state.timerInterval = setInterval(() => {
            if (!_state.desbloqueado) {
                _state.tempoRestante--;
                if (_state.tempoRestante <= 0) {
                    clearInterval(_state.timerInterval);
                    _bloquear();
                }
                updateTimerDisplay();
            }
        }, 1000);
        updateTimerDisplay();
    }

    // ============================================================
    // 14. GENRES
    // ============================================================
    function renderizarGeneros() {
        dom.genresGrid.innerHTML = '';
        ORDEM.forEach(g => {
            const card = document.createElement('div');
            card.className = 'genre-card';
            card.style.borderColor = CORES[g] || '#fff';
            card.style.color = CORES[g] || '#fff';
            card.textContent = g;
            card.onclick = () => selecionarGenero(g);
            dom.genresGrid.appendChild(card);
        });
    }

    async function selecionarGenero(genero) {
        _state.modoFavoritos = false;
        showLoad(true);
        const musicas = await carregarPlaylist(genero);
        if (!musicas || !musicas.length) {
            showLoad(false);
            notif('❌ Erro ao carregar ' + genero);
            dom.genresModal.classList.remove('open');
            return;
        }
        dom.audio.pause();
        _state.musicas = musicas;
        _state.modoAtual = genero;
        _state.playlistAtual = shuf(musicas);
        _state.indiceAtual = 0;
        dom.generoNome.textContent = genero;
        dom.generoNome.style.color = CORES[genero] || '#fff';
        _state.scrollPersonalizado = false;
        const m = _state.playlistAtual[0];
        if (m) {
            atualizarLetreiro(m);
            updateHeart(m.id);
        }
        renderizarGeneros();
        showLoad(false);
        dom.genresModal.classList.remove('open');
        fullscreen();
        if (_state.isBackgroundActive) setTimeout(tocar, 300);
    }

    // ============================================================
    // 15. FAVORITOS MODAL
    // ============================================================
    function renderizarFavoritos() {
        dom.favList.innerHTML = '';
        if (_state.favorites.length === 0) {
            dom.favList.innerHTML = '<div class="fav-empty">💔 Nenhuma favorita</div>';
            return;
        }
        const favMusicas = _state.musicas.filter(m => _state.favorites.includes(m.id));
        if (favMusicas.length === 0) {
            dom.favList.innerHTML = '<div class="fav-empty">💔 Músicas não encontradas</div>';
            return;
        }
        favMusicas.forEach(m => {
            const item = document.createElement('div');
            item.className = 'fav-item';
            item.innerHTML = `
                <div class="fav-info">
                    <div class="title">${sanitize(m.title)}</div>
                    <div class="artist">${sanitize(m.artist)} • ${m.genero || 'Gênero'}</div>
                </div>
                <button class="remove"><i class="fas fa-times-circle"></i></button>
            `;
            item.querySelector('.fav-info').addEventListener('click', () => {
                dom.favModal.classList.remove('open');
                tocarFavoritaEspecifica(m.id);
            });
            item.querySelector('.remove').addEventListener('click', (e) => {
                e.stopPropagation();
                toggleFav(m.id);
                renderizarFavoritos();
                if (_state.modoFavoritos && _state.favorites.length === 0) {
                    _state.modoFavoritos = false;
                    _state.playlistAtual = shuf(_state.musicas);
                    _state.indiceAtual = 0;
                    dom.generoNome.textContent = _state.modoAtual;
                    dom.generoNome.style.color = CORES[_state.modoAtual] || '#fff';
                    if (_state.isBackgroundActive) tocar();
                    notif('🎵 Voltei para ' + _state.modoAtual);
                }
            });
            dom.favList.appendChild(item);
        });
    }

    function tocarFavoritaEspecifica(id) {
        const musica = _state.musicas.find(m => m.id === id);
        if (!musica) return;
        _state.modoFavoritos = true;
        const favMusicas = _state.musicas.filter(m => _state.favorites.includes(m.id));
        if (favMusicas.length > 0) {
            _state.playlistAtual = shuf(favMusicas);
            const idx = _state.playlistAtual.findIndex(m => m.id === id);
            if (idx > -1) {
                _state.indiceAtual = idx;
                dom.generoNome.textContent = '❤️ FAV';
                dom.generoNome.style.color = '#ff2d7f';
                if (_state.isBackgroundActive) tocar();
            }
        }
    }

    function tocarFavoritos() {
        if (_state.favorites.length === 0) {
            notif('💔 Nenhuma favorita');
            return;
        }
        _state.modoFavoritos = true;
        const favMusicas = _state.musicas.filter(m => _state.favorites.includes(m.id));
        if (favMusicas.length === 0) {
            notif('💔 Nenhuma favorita encontrada');
            return;
        }
        _state.playlistAtual = shuf(favMusicas);
        _state.indiceAtual = 0;
        dom.generoNome.textContent = '❤️ FAV';
        dom.generoNome.style.color = '#ff2d7f';
        _state.scrollPersonalizado = false;
        const m = _state.playlistAtual[0];
        if (m) {
            atualizarLetreiro(m);
            updateHeart(m.id);
        }
        if (_state.isBackgroundActive) setTimeout(tocar, 300);
        notif('❤️ Suas favoritas!');
        dom.favModal.classList.remove('open');
    }

    // ============================================================
    // 16. MIDIA CONTAINER
    // ============================================================
    function criarMidia() {
        const midias = [
            { t: 'img', s: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=800&h=800&fit=crop' },
            { t: 'img', s: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800&h=800&fit=crop' },
            { t: 'img', s: 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=800&h=800&fit=crop' },
            { t: 'img', s: 'https://images.unsplash.com/photo-1506157786151-b8491531f063?w=800&h=800&fit=crop' },
        ];
        midias.forEach((m, i) => {
            let el;
            if (m.t === 'vid') {
                el = document.createElement('video');
                el.src = m.s;
                el.muted = true;
                el.playsInline = true;
                el.loop = true;
                el.load();
            } else {
                el = document.createElement('img');
                el.src = m.s;
                el.loading = 'lazy';
            }
            el.className = i === 0 ? 'active' : 'inactive';
            dom.mediaContainer.appendChild(el);
            if (i === 0 && m.t === 'vid') el.play().catch(() => {});
        });
        const children = dom.mediaContainer.children;
        if (children.length > 1) {
            _state.mediaTimer = setInterval(() => {
                const atual = children[_state.midiaAtual];
                const prox = children[(_state.midiaAtual + 1) % children.length];
                if (!atual || !prox) return;
                atual.className = 'inactive';
                if (atual.tagName === 'VIDEO') atual.pause();
                prox.className = 'active';
                if (prox.tagName === 'VIDEO') prox.play().catch(() => {});
                _state.midiaAtual = (_state.midiaAtual + 1) % children.length;
            }, 5000);
        }
    }

    // ============================================================
    // 17. ADMIN (mantido igual)
    // ============================================================
    let adminClicks = 0;
    dom.infoScroll.onclick = () => {
        adminClicks++;
        setTimeout(() => adminClicks = 0, 2000);
        if (adminClicks >= 5) {
            adminClicks = 0;
            dom.adminPanel.classList.toggle('open');
            notif('🔐 ADMIN!');
        }
    };

    // ============================================================
    // 18. INICIALIZAÇÃO
    // ============================================================
    function iniciar() {
        criarMidia();
        carregarFav();

        _verificarAcessoInicial();

        (async () => {
            for (const g of ORDEM) {
                const musicas = await carregarPlaylist(g);
                if (musicas && musicas.length) {
                    _state.musicas = musicas;
                    _state.modoAtual = g;
                    _state.playlistAtual = shuf(musicas);
                    dom.generoNome.textContent = g;
                    dom.generoNome.style.color = CORES[g] || '#fff';
                    const m = _state.playlistAtual[0];
                    if (m) {
                        atualizarLetreiro(m);
                        updateHeart(m.id);
                    }
                    break;
                }
            }
            renderizarGeneros();
            fullscreen();
        })();

        const btnAtivar = document.createElement('button');
        btnAtivar.className = 'btn-ativar-player';
        btnAtivar.textContent = 'ATIVAR';
        btnAtivar.onclick = async function() {
            this.classList.add('hidden');
            await ativarPlayer();
            fullscreen();
        };
        document.body.appendChild(btnAtivar);

        setTimeout(() => {
            dom.loadingScreen.style.display = 'none';
            dom.playerContainer.classList.add('visible');
        }, 1500);

        _antiDebug();
        iniciarBannerLoop();

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && _state.isPlaying && _state.isBackgroundActive) {
                dom.audio.play().catch(() => {});
            }
        });
    }

    // ============================================================
    // 19. EVENTOS
    // ============================================================
    dom.playBtn.onclick = togglePlay;
    document.getElementById('nextBtn').onclick = next;
    document.getElementById('prevBtn').onclick = prev;
    dom.shuffleBtn.onclick = toggleShuffle;

    dom.progressBar.onclick = (e) => {
        if (dom.audio.duration) {
            const rect = e.currentTarget.getBoundingClientRect();
            dom.audio.currentTime = ((e.clientX - rect.left) / rect.width) * dom.audio.duration;
        }
    };

    dom.heartBtn.onclick = () => {
        const m = _state.playlistAtual[_state.indiceAtual % _state.playlistAtual.length] || _state.playlistAtual[0];
        if (m) toggleFav(m.id);
    };

    dom.btnGeneroFav.onclick = () => {
        if (_state.modoFavoritos) {
            _state.modoFavoritos = false;
            _state.playlistAtual = shuf(_state.musicas);
            _state.indiceAtual = 0;
            dom.generoNome.textContent = _state.modoAtual;
            dom.generoNome.style.color = CORES[_state.modoAtual] || '#fff';
            _state.scrollPersonalizado = false;
            if (_state.isBackgroundActive) tocar();
            notif('🎵 Voltei para ' + _state.modoAtual);
        } else {
            if (_state.favorites.length > 0) {
                dom.favModal.classList.add('open');
                renderizarFavoritos();
            } else {
                dom.genresModal.classList.add('open');
            }
        }
    };

    document.getElementById('closeFavModal').onclick = () => dom.favModal.classList.remove('open');
    document.getElementById('closeFavBtn').onclick = () => dom.favModal.classList.remove('open');

    document.getElementById('fabGeneros').onclick = () => {
        dom.genresModal.classList.add('open');
        fabSub.classList.remove('open');
        _state.fabOpen = false;
        fabMain.innerHTML = '<i class="fas fa-plus"></i>';
    };

    document.getElementById('closeGenresBtn').onclick = () => dom.genresModal.classList.remove('open');

    dom.menuButton.onclick = (e) => {
        e.stopPropagation();
        dom.menuPopup.classList.toggle('open');
    };
    document.getElementById('closeMenuBtn').onclick = () => dom.menuPopup.classList.remove('open');
    document.getElementById('fullscreenMenuBtn').onclick = () => {
        dom.menuPopup.classList.remove('open');
        fullscreen();
    };
    document.getElementById('reloadPlaylistBtn').onclick = () => {
        dom.menuPopup.classList.remove('open');
        location.reload();
    };
    document.getElementById('feedbackMenuBtn').onclick = () => {
        dom.menuPopup.classList.remove('open');
        dom.feedbackModal.classList.add('open');
    };
    document.getElementById('sleepMenuBtn').onclick = () => {
        dom.menuPopup.classList.remove('open');
        const mins = parseInt(prompt('⏰ Desligar em quantos minutos?', '15'));
        if (mins > 0) {
            clearTimeout(_state.sleepTimer);
            _state.sleepTimer = setTimeout(() => {
                dom.audio.pause();
                _state.isPlaying = false;
                dom.playBtn.innerHTML = '<i class="fas fa-play"></i>';
                notif('💤 Rádio desligada!');
            }, mins * 60000);
            notif('⏰ Sleep: ' + mins + ' min');
        }
    };
    document.getElementById('qrCodeMenuBtn').onclick = () => {
        dom.menuPopup.classList.remove('open');
        window.open('https://api.qrserver.com/v1/create-qr-code/?data=' + encodeURIComponent(location.href));
    };

    document.getElementById('bannerWhatsAppBtn').onclick = () => {
        window.open('https://wa.me/' + NUMERO_WHATSAPP + '?text=Quero%20ser%20VITAL%C3%8DCIO%20do%20VAI%20DE%20BOA%20MUSIC%20-%20R$%2039,90');
        dom.bannerVitalicio.classList.remove('active');
        clearInterval(_state.bannerTimeout);
    };
    document.getElementById('bannerCloseBtn').onclick = () => {
        dom.bannerVitalicio.classList.remove('active');
        clearInterval(_state.bannerTimeout);
    };

    const fabMain = document.getElementById('fabMain');
    const fabSub = document.getElementById('fabSub');
    fabMain.onclick = () => {
        _state.fabOpen = !_state.fabOpen;
        fabSub.classList.toggle('open', _state.fabOpen);
        fabMain.innerHTML = _state.fabOpen ? '<i class="fas fa-times"></i>' : '<i class="fas fa-plus"></i>';
    };
    document.getElementById('fabYoutube').onclick = () => {
        window.open('https://sites.google.com/view/rogersjc/in%C3%ADcio');
        fabSub.classList.remove('open');
        _state.fabOpen = false;
        fabMain.innerHTML = '<i class="fas fa-plus"></i>';
    };
    document.getElementById('fabShare').onclick = () => {
        navigator.clipboard.writeText(location.href).then(() => notif('📋 Link copiado!'));
        fabSub.classList.remove('open');
        _state.fabOpen = false;
        fabMain.innerHTML = '<i class="fas fa-plus"></i>';
    };
    document.getElementById('fabQrCode').onclick = () => {
        window.open('https://api.qrserver.com/v1/create-qr-code/?data=' + encodeURIComponent(location.href));
        fabSub.classList.remove('open');
        _state.fabOpen = false;
        fabMain.innerHTML = '<i class="fas fa-plus"></i>';
    };
    document.getElementById('fabFeedback').onclick = () => {
        dom.feedbackModal.classList.add('open');
        fabSub.classList.remove('open');
        _state.fabOpen = false;
        fabMain.innerHTML = '<i class="fas fa-plus"></i>';
    };

    document.querySelectorAll('.star').forEach(star => {
        star.onclick = () => {
            const rating = parseInt(star.dataset.rating);
            document.querySelectorAll('.star').forEach((s, i) => {
                s.className = i < rating ? 'fas fa-star star active' : 'far fa-star star';
            });
        };
    });
    document.getElementById('sendFeedbackBtn').onclick = () => {
        const stars = document.querySelectorAll('.star.active').length;
        const text = document.getElementById('feedbackText').value;
        window.open('https://wa.me/' + NUMERO_WHATSAPP + '?text=' + encodeURIComponent('⭐' + '★'.repeat(stars) + ' ' + text));
        dom.feedbackModal.classList.remove('open');
    };
    document.getElementById('closeFeedbackBtn').onclick = () => dom.feedbackModal.classList.remove('open');

    document.getElementById('btnSenhaPermanente').onclick = () => {
        if (_state.tentativas >= MAX_TENTATIVAS) {
            document.getElementById('erroSenha').textContent = '❌ BLOQUEADO! Reinicie.';
            document.getElementById('senhaPermanente').disabled = true;
            document.getElementById('btnSenhaPermanente').disabled = true;
            return;
        }
        const senha = document.getElementById('senhaPermanente').value.trim();
        if (senha === SENHA_FIXA || senha.split(':').length === 4) {
            _desbloquear();
            _state.tentativas = 0;
            document.getElementById('erroSenha').textContent = '';
            notif('✅ Liberado!');
        } else {
            _state.tentativas++;
            const restam = MAX_TENTATIVAS - _state.tentativas;
            document.getElementById('erroSenha').textContent = '❌ Inválida! Restam ' + restam + ' tentativa(s)';
        }
    };
    document.getElementById('senhaPermanente').onkeydown = (e) => {
        if (e.key === 'Enter') document.getElementById('btnSenhaPermanente').click();
    };

    document.getElementById('btnWhatsApp').onclick = () => window.open('https://wa.me/' + NUMERO_WHATSAPP);
    document.getElementById('btnPix').onclick = () => {
        navigator.clipboard.writeText(CHAVE_PIX).then(() => notif('✅ PIX copiado!'));
    };

    document.getElementById('adminGerarBtn').onclick = () => {
        const email = document.getElementById('adminEmail').value;
        const cel = document.getElementById('adminCelular').value;
        const exp = Date.now() + 999999999999;
        const hash = btoa(email + cel + 'VDB2025Secret').slice(0, 40);
        document.getElementById('adminSenhaGerada').value = email + ':' + cel + ':' + exp + ':' + hash;
    };
    document.getElementById('btnCopiarSenha').onclick = () => {
        const text = document.getElementById('adminSenhaGerada').value;
        if (text) navigator.clipboard.writeText(text).then(() => notif('📋 Copiada!'));
    };
    document.getElementById('adminCloseBtn').onclick = () => dom.adminPanel.classList.remove('open');

    dom.audio.ontimeupdate = () => {
        if (dom.audio.duration) {
            dom.progressFill.style.width = (dom.audio.currentTime / dom.audio.duration * 100) + '%';
            dom.currentTime.textContent = fmt(dom.audio.currentTime);
            dom.totalTime.textContent = fmt(dom.audio.duration);
        }
    };
    dom.audio.onended = () => {
        if (!_state.carregandoMusica) next();
    };
    dom.audio.onerror = () => {
        if (!_state.carregandoMusica) next();
    };

    let touchStartX = 0,
        touchStartY = 0;
    document.addEventListener('touchstart', (e) => {
        if (dom.genresModal.classList.contains('open')) return;
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        showControls();
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
        if (dom.genresModal.classList.contains('open')) return;
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(deltaX) > 50 && Math.abs(deltaX) > Math.abs(deltaY)) {
            if (deltaX < 0) next();
            else prev();
        }
    }, { passive: true });

    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === ' ') { e.preventDefault();
            togglePlay(); }
        if (e.key === 'ArrowRight') next();
        if (e.key === 'ArrowLeft') prev();
        if (e.key === 's' || e.key === 'S') toggleShuffle();
    });

    document.addEventListener('click', (e) => {
        if (e.target.closest('button') || e.target.closest('.genre-card') || e.target.closest('#infoScroll')) return;
        showControls();
    });

    // ============================================================
    // 20. INICIAR
    // ============================================================
    iniciar();

})();
</script>
