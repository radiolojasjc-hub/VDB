            function obterProximaMusica() {
                if (!currentPlaylist || currentPlaylist.length === 0) {
                    if (musicas.length === 0) return null;
                    currentPlaylist = shuffleArray([...musicas]);
                    if (ultimoId && currentPlaylist.length > 1) {
                        const idx = currentPlaylist.findIndex(m => m.id === ultimoId);
                        if (idx > -1) currentPlaylist.splice(idx, 1);
                    }
                    currentIndex = 0;
                }

                if (currentIndex >= currentPlaylist.length) {
                    const ultima = currentPlaylist[currentPlaylist.length - 1];
                    ultimoId = ultima ? ultima.id : null;
                    if (musicas.length === 0) return null;
                    currentPlaylist = shuffleArray([...musicas]);
                    if (ultimoId && currentPlaylist.length > 1) {
                        const idx = currentPlaylist.findIndex(m => m.id === ultimoId);
                        if (idx > -1) currentPlaylist.splice(idx, 1);
                    }
                    currentIndex = 0;
                }

                const musica = currentPlaylist[currentIndex];
                if (!musica) return null;
                currentIndex++;
                return musica;
            }

            function adicionarAoHistorico(musica) {
                if (!musica) return;
                historicoReproducao = historicoReproducao.filter(m => m.id !== musica.id);
                historicoReproducao.unshift(musica);
                if (historicoReproducao.length > 25) historicoReproducao.pop();
            }

            function updateNowPlaying(track) {
                if (track) {
                    scrollText.innerHTML = `🎵 ${track.title} - ${track.artist} [${track.genero || 'POP'}] 🎵`;
                    updateHeartIcon(track.id);
                }
            }

            async function playMusic() {
                if (carregandoMusica) return;
                if (!isBackgroundActive) {
                    showNotification("⚠️ Ative o áudio!", 1000);
                    return;
                }
                if (!musicas.length) {
                    showNotification("Playlist vazia!", 1500);
                    return;
                }
                if (!currentPlaylist || currentPlaylist.length === 0) {
                    currentPlaylist = shuffleArray([...musicas]);
                    currentIndex = 0;
                }

                carregandoMusica = true;

                const track = obterProximaMusica();
                if (!track) {
                    showNotification("Nenhuma música disponível", 1000);
                    carregandoMusica = false;
                    return;
                }

                ultimoId = track.id;
                updateNowPlaying(track);
                adicionarAoHistorico(track);

                let urls = gerarUrlsAlternativas(track);
                if (urls.length === 0) {
                    showNotification("❌ Nenhuma URL para esta música", 1000);
                    carregandoMusica = false;
                    setTimeout(() => { if (!carregandoMusica) nextTrack(); }, 300);
                    return;
                }

                const falhas = JSON.parse(localStorage.getItem('url_falhas') || '[]');
                urls = urls.filter(u => !falhas.includes(u));

                let urlIndex = 0;
                let timeoutId = null;
                let sucesso = false;
                let tentativas = 0;

                function tentarUrl() {
                    if (urlIndex >= urls.length) {
                        const novasFalhas = [...new Set([...falhas, ...urls])];
                        localStorage.setItem('url_falhas', JSON.stringify(novasFalhas));
                        showNotification("⏭️ Pulando...", 800);
                        carregandoMusica = false;
                        if (timeoutId) clearTimeout(timeoutId);
                        setTimeout(() => { if (!carregandoMusica) nextTrack(); }, 300);
                        return;
                    }

                    const url = urls[urlIndex];
                    urlIndex++;
                    tentativas++;

                    if (timeoutId) clearTimeout(timeoutId);

                    audio.pause();
                    audio.src = url;
                    audio.load();

                    timeoutId = setTimeout(() => {
                        if (!sucesso) {
                            console.warn(`⏰ Timeout (${tentativas}/${urls.length}) para ${url}`);
                            const falhasAtuais = JSON.parse(localStorage.getItem('url_falhas') || '[]');
                            if (!falhasAtuais.includes(url)) {
                                falhasAtuais.push(url);
                                localStorage.setItem('url_falhas', JSON.stringify(falhasAtuais));
                            }
                            tentarUrl();
                        }
                    }, 5000);

                    audio.oncanplay = () => {
                        if (timeoutId) clearTimeout(timeoutId);
                        audio.play()
                            .then(() => {
                                sucesso = true;
                                isPlaying = true;
                                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                                startTimer();
                                carregandoMusica = false;
                                showNotification(`✅ Tocando: ${track.title}`, 1200);
                                
                                if (url !== track.src) {
                                    try {
                                        localStorage.setItem('src_cache_' + track.id, url);
                                    } catch(e) {}
                                }
                                
                                const falhasAtuais = JSON.parse(localStorage.getItem('url_falhas') || '[]');
                                const novas = falhasAtuais.filter(f => f !== url);
                                if (novas.length !== falhasAtuais.length) {
                                    localStorage.setItem('url_falhas', JSON.stringify(novas));
                                }

                                preCarregarProxima();
                            })
                            .catch((err) => {
                                console.warn(`❌ Falha ao tocar ${url}:`, err);
                                const falhasAtuais = JSON.parse(localStorage.getItem('url_falhas') || '[]');
                                if (!falhasAtuais.includes(url)) {
                                    falhasAtuais.push(url);
                                    localStorage.setItem('url_falhas', JSON.stringify(falhasAtuais));
                                }
                                tentarUrl();
                            });
                    };

                    audio.onerror = () => {
                        if (timeoutId) clearTimeout(timeoutId);
                        console.warn(`❌ Erro de rede em ${url}`);
                        const falhasAtuais = JSON.parse(localStorage.getItem('url_falhas') || '[]');
                        if (!falhasAtuais.includes(url)) {
                            falhasAtuais.push(url);
                            localStorage.setItem('url_falhas', JSON.stringify(falhasAtuais));
                        }
                        tentarUrl();
                    };
                }

                tentarUrl();
            }

            let preloadAudio = new Audio();
            preloadAudio.preload = 'auto';

            function preCarregarProxima() {
                try {
                    const proxima = obterProximaMusica();
                    if (!proxima) return;
                    const urls = gerarUrlsAlternativas(proxima);
                    if (urls.length === 0) return;
                    const url = urls[0];
                    preloadAudio.src = url;
                    preloadAudio.load();
                    preloadAudio.oncanplay = () => {
                        console.log('✅ Pré-carregado:', proxima.title);
                        preloadAudio.oncanplay = null;
                    };
                    preloadAudio.onerror = () => {
                        preloadAudio.onerror = null;
                    };
                } catch(e) {}
            }

            function togglePlay() {
                if (!isBackgroundActive) { showNotification("Clique em ATIVAR RÁDIO!", 1000); return; }
                if (audio.paused) {
                    playMusic();
                } else {
                    audio.pause();
                }
                showControls();
            }

            function nextTrack() {
                if (carregandoMusica) return;
                if (!currentPlaylist || currentPlaylist.length === 0) {
                    currentPlaylist = shuffleArray([...musicas]);
                    currentIndex = 0;
                }
                if (isPlaying) {
                    playMusic();
                } else {
                    const track = obterProximaMusica();
                    if (track) {
                        ultimoId = track.id;
                        updateNowPlaying(track);
                        adicionarAoHistorico(track);
                        const url = track.src.startsWith('http') ? track.src : gerarUrlCompleta(track.src);
                        audio.src = url || track.src;
                        audio.load();
                    }
                }
                showControls();
            }

            function prevTrack() {
                if (carregandoMusica) return;
                if (!currentPlaylist || currentPlaylist.length === 0) {
                    nextTrack();
                    return;
                }
                if (currentIndex <= 0) {
                    currentIndex = currentPlaylist.length - 1;
                } else {
                    currentIndex -= 2;
                    if (currentIndex < 0) currentIndex = 0;
                }
                if (currentIndex >= currentPlaylist.length) currentIndex = currentPlaylist.length - 1;
                const track = currentPlaylist[currentIndex];
                if (!track) { nextTrack(); return; }
                ultimoId = track.id;
                updateNowPlaying(track);
                adicionarAoHistorico(track);
                if (isPlaying) {
                    audio.pause();
                    const url = track.src.startsWith('http') ? track.src : gerarUrlCompleta(track.src);
                    audio.src = url || track.src;
                    audio.load();
                    audio.play().catch(() => {});
                } else {
                    const url = track.src.startsWith('http') ? track.src : gerarUrlCompleta(track.src);
                    audio.src = url || track.src;
                    audio.load();
                }
                currentIndex++;
                showControls();
            }

            function toggleShuffle() {
                shuffleMode = !shuffleMode;
                shuffleBtn.classList.toggle('active', shuffleMode);
                if (shuffleMode && currentPlaylist.length > 1) {
                    const atualId = currentPlaylist[currentIndex % currentPlaylist.length]?.id;
                    currentPlaylist = shuffleArray(currentPlaylist);
                    if (atualId) {
                        const idx = currentPlaylist.findIndex(m => m.id === atualId);
                        if (idx > 0) {
                            const [atual] = currentPlaylist.splice(idx, 1);
                            currentPlaylist.unshift(atual);
                            currentIndex = 0;
                        } else {
                            currentIndex = 0;
                        }
                    } else {
                        currentIndex = 0;
                    }
                }
                showNotification(shuffleMode ? '🔀 Aleatório ON' : '➡️ Sequencial', 800);
                showControls();
            }

            function startTimer() {
                stopTimer();
                timerInterval = setInterval(() => {
                    if (isPlaying && audio.duration && !audio.paused && audio.duration !== Infinity) {
                        progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
                        currentTimeEl.textContent = formatTime(audio.currentTime);
                        totalTimeEl.textContent = formatTime(audio.duration);
                        if (audio.currentTime >= audio.duration - 0.5) {
                            if (!carregandoMusica) nextTrack();
                        }
                    }
                }, 200);
            }
            function stopTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = null; }

            function playSongById(id) {
                if (carregandoMusica) return;
                const musica = musicas.find(m => m.id === id);
                if (!musica) { showNotification("Música não encontrada", 1000); return; }
                audio.pause();
                audio.src = '';
                audio.load();
                modoFavoritosAtivo = false;
                modoAtual = musica.genero;
                const lista = musicas.filter(m => m.genero === musica.genero);
                const outras = lista.filter(m => m.id !== musica.id);
                currentPlaylist = shuffleArray([musica, ...outras]);
                currentIndex = 0;
                ultimoId = musica.id;
                historicoReproducao = [];
                updateNowPlaying(musica);
                genreBadge.innerHTML = musica.genero;
                if (isBackgroundActive) setTimeout(() => playMusic(), 200);
                showNotification(`🎵 ${musica.title} - ${musica.artist}`, 2000);
            }

            function buildGenresGrid() {
                const genresGrid = document.getElementById('genresGrid');
                genresGrid.innerHTML = '';

                const qtdFav = (playlists['Favoritos'] || []).length;
                const favCard = document.createElement('div');
                favCard.className = 'genre-card fav-card';
                favCard.innerHTML = `<i class="fas fa-heart" style="color:#ff2d7f;margin-right:3px;"></i> FAVORITOS (${qtdFav})`;
                favCard.onclick = () => { document.getElementById('genresModal').classList.remove('open'); entrarModoFavoritos(); };
                genresGrid.appendChild(favCard);

                const generosGrid = ['MPB', 'POP', 'SERTANEJO', 'FORRÓ', 'SAMBA', 'BREGA', 'REGGAE', 'MODA TOP', 'RELIGIOSA', 'ROMÂNTICA', 'FLASHBACK'];
                
                generosGrid.forEach(genero => {
                    if (GENRE_URLS[genero]) {
                        const card = document.createElement('div');
                        card.className = 'genre-card';
                        const cor = CORES_POR_GENERO[genero] || '#ffffff';
                        card.style.border = `2px solid ${cor}`;
                        card.style.color = cor;
                        card.textContent = genero;
                        card.onclick = () => {
                            selecionarGenero(genero);
                        };
                        genresGrid.appendChild(card);
                    }
                });
            }

            function createSilentAudio() {
                try {
                    const sampleRate = 44100, duration = 1, numSamples = sampleRate * duration;
                    const buffer = new ArrayBuffer(44 + numSamples * 2);
                    const view = new DataView(buffer);
                    const writeString = (view, offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
                    writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + numSamples * 2, true);
                    writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt ');
                    view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
                    view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
                    view.setUint16(32, 2, true); view.setUint16(34, 16, true);
                    writeString(view, 36, 'data'); view.setUint32(40, numSamples * 2, true);
                    let offset = 44;
                    for (let i = 0; i < numSamples; i++) { view.setInt16(offset, 0, true); offset += 2; }
                    return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
                } catch(e) { return ''; }
            }

            async function ativarAudio() {
                try {
                    showLoading(true);
                    const silentUrl = createSilentAudio();
                    if (!silentUrl) throw new Error('Erro');
                    backgroundAudio.src = silentUrl;
                    backgroundAudio.loop = true;
                    backgroundAudio.volume = 0.001;
                    await backgroundAudio.play();
                    isBackgroundActive = true;
                    audioStatus.classList.add('active');
                    audioStatus.innerHTML = '<span class="dot"></span> Ativado';
                    if ('wakeLock' in navigator) try { await navigator.wakeLock.request('screen'); } catch(e) {}
                    await playMusic();
                    showLoading(false);
                    return true;
                } catch (error) {
                    isBackgroundActive = true;
                    audioStatus.classList.add('active');
                    audioStatus.innerHTML = '<span class="dot"></span> Ativado';
                    await playMusic();
                    showLoading(false);
                    return true;
                }
            }

            async function recarregarPlaylist() {
                const genero = modoAtual;
                if (!genero || !GENRE_URLS[genero]) {
                    showNotification('⚠️ Gênero atual inválido', 1000);
                    return;
                }
                delete playlistCache[genero];
                showNotification(`🔄 Recarregando ${genero}...`, 1000);
                await selecionarGenero(genero);
                showNotification(`✅ Playlist recarregada (${musicas.length} músicas)`, 2000);
            }

            // ---------- INICIALIZAÇÃO ----------
            async function iniciar() {
                // Criar elementos de mídia
                criarElementosMidia();

                // Mostrar título e botão
                projectTitle.style.display = 'block';
                btnAtivar.style.display = 'block';

                // Carregar playlists e dados
                carregarPlaylists();
                atualizarBadgeFavoritos();

                let lista = await carregarPlaylistPorGenero('PADRÃO');
                let generoInicial = 'PADRÃO';
                if (!lista || lista.length === 0) {
                    lista = await carregarPlaylistPorGenero('MPB');
                    generoInicial = 'MPB';
                }
                if (!lista || lista.length === 0) {
                    lista = await carregarPlaylistPorGenero('POP');
                    generoInicial = 'POP';
                }
                if (!lista || lista.length === 0) {
                    const primeiroGenero = Object.keys(GENRE_URLS).find(k => k !== 'PADRÃO') || 'MPB';
                    lista = await carregarPlaylistPorGenero(primeiroGenero);
                    generoInicial = primeiroGenero;
                }

                if (lista && lista.length > 0) {
                    musicas = lista;
                    modoAtual = generoInicial;
                    if (modoAtual === 'PADRÃO') {
                        genreBadge.innerHTML = '🎵 PRINCIPAL';
                    } else {
                        genreBadge.innerHTML = modoAtual;
                    }
                    currentPlaylist = shuffleArray([...musicas]);
                    currentIndex = 0;
                    ultimoId = null;
                    const primeira = currentPlaylist[0];
                    if (primeira) {
                        updateNowPlaying(primeira);
                        adicionarAoHistorico(primeira);
                    }
                } else {
                    showNotification('❌ Nenhuma playlist carregada', 2000);
                }

                renderizarListaPastas();
                buildGenresGrid();
                renderFavList();

                // Inicia alternância de mídia (se houver mais de um item)
                if (elementosMidia.length > 1) {
                    iniciarAlternancia();
                }

                // Tela cheia no início
                goFullscreen();
            }

            // ---------- EVENTOS ----------
            // Botão ATIVAR RÁDIO
            btnAtivar.addEventListener('click', async function() {
                btnAtivar.style.display = 'none';
                projectTitle.style.display = 'none';
                appContainer.style.display = 'flex';
                showNotification('🔊 Ativando áudio...', 1000);
                await ativarAudio();
                goFullscreen();
                // Inicia a alternância se ainda não tiver começado
                if (elementosMidia.length > 1) {
                    iniciarAlternancia();
                }
            });

            // Coração: favoritos (pasta padrão)
            heartBtn.addEventListener('click', () => {
                const music = currentPlaylist[currentIndex % currentPlaylist.length] || currentPlaylist[0];
                if (music) {
                    toggleFavorito(music.id);
                    buildGenresGrid();
                } else {
                    showNotification('Nenhuma música tocando', 1000);
                }
                showControls();
            });

            // Duplo toque na tela: também favorita
            let lastTap = 0;
            document.getElementById('nowPlaying').addEventListener('click', (e) => {
                const now = Date.now();
                if (now - lastTap < 300 && now - lastTap > 50) {
                    const music = currentPlaylist[currentIndex % currentPlaylist.length] || currentPlaylist[0];
                    if (music) {
                        toggleFavorito(music.id);
                        buildGenresGrid();
                    }
                }
                lastTap = now;
                showControls();
            });

            // Botão favoritos no topo abre o gerenciador de pastas
            favTopBtn.addEventListener('click', () => {
                renderizarListaPastas();
                document.getElementById('playlistsModal').classList.add('open');
            });

            // Fechar modais
            document.getElementById('closePlaylistsModal').addEventListener('click', () => document.getElementById('playlistsModal').classList.remove('open'));
            document.getElementById('closePlaylistsBtn').addEventListener('click', () => document.getElementById('playlistsModal').classList.remove('open'));
            document.getElementById('closeFavModal').addEventListener('click', () => document.getElementById('favModal').classList.remove('open'));
            document.getElementById('closeFavBtn').addEventListener('click', () => document.getElementById('favModal').classList.remove('open'));
            document.getElementById('closeGenresBtn').addEventListener('click', () => document.getElementById('genresModal').classList.remove('open'));
            document.getElementById('closeFeedbackBtn').addEventListener('click', () => document.getElementById('feedbackModal').classList.remove('open'));
            document.getElementById('closeHistModal').addEventListener('click', () => document.getElementById('historicoModal').classList.remove('open'));
            document.getElementById('closeHistBtn').addEventListener('click', () => document.getElementById('historicoModal').classList.remove('open'));

            // Sugestões de pastas
            document.querySelectorAll('#sugestoesContainer button').forEach(btn => {
                btn.addEventListener('click', function() {
                    const nome = this.dataset.pasta;
                    criarPasta(nome);
                });
            });

            document.getElementById('criarPastaBtn').addEventListener('click', () => {
                const input = document.getElementById('novaPastaInput');
                if (criarPasta(input.value)) {
                    input.value = '';
                }
            });
            document.getElementById('novaPastaInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') document.getElementById('criarPastaBtn').click();
            });

            // Busca nos favoritos
            document.getElementById('searchFav').addEventListener('input', function() {
                renderFavList(this.value);
            });

            // Exportar favoritos
            document.getElementById('exportFavBtn').addEventListener('click', () => {
                const ids = playlists['Favoritos'] || [];
                const nomes = ids.map(id => {
                    const m = musicas.find(mus => mus.id === id);
                    return m ? `${m.title} - ${m.artist}` : null;
                }).filter(Boolean).join('\n');
                if (!nomes) { showNotification('Nenhum favorito para exportar', 1000); return; }
                navigator.clipboard.writeText(nomes).then(() => {
                    showNotification('📋 Lista copiada!', 1500);
                }).catch(() => {
                    alert('Copie a lista:\n\n' + nomes);
                });
            });

            // Importar favoritos
            document.getElementById('importFavBtn').addEventListener('click', () => {
                const input = prompt('Cole a lista de músicas (uma por linha, formato "Título - Artista"):');
                if (!input) return;
                const linhas = input.split('\n').filter(l => l.trim());
                let importados = 0;
                linhas.forEach(linha => {
                    const parts = linha.split('-').map(s => s.trim());
                    if (parts.length >= 2) {
                        const titulo = parts[0].trim();
                        const artista = parts.slice(1).join(' - ').trim();
                        const m = musicas.find(mus => mus.title.toLowerCase() === titulo.toLowerCase() && mus.artist.toLowerCase() === artista.toLowerCase());
                        if (m && !playlists['Favoritos'].includes(m.id)) {
                            playlists['Favoritos'].push(m.id);
                            importados++;
                        }
                    }
                });
                if (importados > 0) {
                    salvarPlaylists();
                    renderizarListaPastas();
                    renderFavList();
                    buildGenresGrid();
                    showNotification(`✅ ${importados} músicas importadas!`, 2000);
                } else {
                    showNotification('Nenhuma música encontrada para importar', 1500);
                }
            });

            // Limpar favoritos
            document.getElementById('clearFavBtn').addEventListener('click', () => {
                const ids = playlists['Favoritos'] || [];
                if (ids.length === 0) { showNotification('Nenhum favorito', 1000); return; }
                if (confirm('Remover todos os favoritos?')) {
                    playlists['Favoritos'] = [];
                    salvarPlaylists();
                    renderizarListaPastas();
                    renderFavList();
                    buildGenresGrid();
                    updateHeartIcon(null);
                    showNotification('🗑️ Favoritos limpos', 1500);
                }
            });

            // FAB
            const fabMain = document.getElementById('fabMain');
            const fabSub = document.getElementById('fabSub');
            fabMain.addEventListener('click', () => {
                fabOpen = !fabOpen;
                fabSub.classList.toggle('open', fabOpen);
                fabMain.innerHTML = fabOpen ? '<i class="fas fa-times"></i>' : '<i class="fas fa-plus"></i>';
            });

            document.getElementById('fabGeneros').addEventListener('click', () => { openGenres(); fabMain.click(); });
            document.getElementById('fabFeedback').addEventListener('click', () => { openFeedback(); fabMain.click(); });
            document.getElementById('fabYoutube').addEventListener('click', () => { window.open('https://sites.google.com/view/rogersjc/in%C3%ADcio', '_blank'); fabMain.click(); });
            document.getElementById('fabShare').addEventListener('click', () => {
                const track = currentPlaylist[currentIndex % currentPlaylist.length] || currentPlaylist[0];
                if (!track) { showNotification('Nenhuma música tocando', 1000); return; }
                const msg = `🎵 Estou ouvindo "${track.title}" - ${track.artist} no Vai de Boa! Music! 📻 Ouça também: ${location.href}`;
                if (navigator.share) {
                    navigator.share({ title: 'Vai de Boa! Music', text: msg, url: location.href })
                        .catch(() => {});
                } else {
                    navigator.clipboard.writeText(msg).then(() => {
                        showNotification('📋 Mensagem copiada! Cole onde quiser.', 2000);
                    }).catch(() => {
                        showNotification('Compartilhamento não disponível', 1000);
                    });
                }
                fabMain.click();
            });

            document.getElementById('fabQrCode').addEventListener('click', () => {
                const url = encodeURIComponent(location.href);
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?data=${url}&size=300x300&bgcolor=0a0a0a&color=00f3ff`;
                window.open(qrUrl, '_blank');
                showNotification('📲 QR Code gerado!', 1500);
                fabMain.click();
            });

            // Player controls
            playBtn.addEventListener('click', togglePlay);
            document.getElementById('nextBtn').addEventListener('click', nextTrack);
            document.getElementById('prevBtn').addEventListener('click', prevTrack);
            shuffleBtn.addEventListener('click', toggleShuffle);

            // Sleep timer
            document.getElementById('sleepMenuBtn').addEventListener('click', () => { 
                menuPopup.classList.remove('open'); 
                const minutos = prompt('⏰ Desligar em quantos minutos? (5, 15, 30, 60)', '15');
                if (!minutos) return;
                const mins = parseInt(minutos);
                if (isNaN(mins) || mins < 1) { showNotification('⏰ Inválido', 1500); return; }
                if (sleepTimer) clearTimeout(sleepTimer);
                showNotification(`⏰ Desligando em ${mins} minutos`, 2000);
                sleepTimer = setTimeout(() => { 
                    audio.pause(); 
                    isPlaying = false;
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    showNotification('💤 Rádio desligada pelo Sleep Timer', 2000); 
                }, mins * 60000);
            });
            
            document.getElementById('fullscreenMenuBtn').addEventListener('click', () => { 
                menuPopup.classList.remove('open'); 
                goFullscreen();
                showNotification('⛶ Tela cheia ativada', 1000);
            });
            
            document.getElementById('reloadPlaylistBtn').addEventListener('click', () => {
                menuPopup.classList.remove('open');
                recarregarPlaylist();
            });

            document.getElementById('btStatusMenuBtn').addEventListener('click', () => { 
                menuPopup.classList.remove('open');
                if (!navigator.bluetooth) { showNotification("❌ Bluetooth não suportado neste navegador", 1500); return; }
                showNotification("🔍 Procurando dispositivos Bluetooth...", 1500);
                navigator.bluetooth.requestDevice({ acceptAllDevices: true })
                    .then(device => {
                        showNotification(`✅ Conectado a: ${device.name || 'Dispositivo'}`, 2000);
                    })
                    .catch(err => {
                        if (err.message.includes('cancelled')) {
                            showNotification("❌ Busca cancelada", 1500);
                        } else {
                            showNotification("❌ Nenhum dispositivo encontrado", 1500);
                        }
                    });
            });
            
            document.getElementById('feedbackMenuBtn').addEventListener('click', () => { 
                menuPopup.classList.remove('open'); 
                openFeedback(); 
            });

            document.getElementById('qrCodeMenuBtn').addEventListener('click', () => {
                menuPopup.classList.remove('open');
                const url = encodeURIComponent(location.href);
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?data=${url}&size=300x300&bgcolor=0a0a0a&color=00f3ff`;
                window.open(qrUrl, '_blank');
                showNotification('📲 QR Code gerado!', 1500);
            });

            document.getElementById('progressBar').addEventListener('click', (e) => {
                if (audio.duration && !isNaN(audio.duration) && isFinite(audio.duration)) {
                    const rect = e.currentTarget.getBoundingClientRect();
                    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
                    showControls();
                }
            });

            menuButton.addEventListener('click', (e) => { 
                e.stopPropagation(); 
                menuPopup.classList.toggle('open'); 
                showControls(); 
            });

            document.getElementById('closeMenuBtn').addEventListener('click', () => { 
                menuPopup.classList.remove('open'); 
            });

            // Toque em qualquer lugar para mostrar controles (exceto em botões e modais)
            document.addEventListener('click', (e) => {
                if (e.target.closest('button') || e.target.closest('.fav-modal') || e.target.closest('.genres-modal') || e.target.closest('.menu-popup') || e.target.closest('.fab-container')) return;
                showControls();
            });

            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                switch(e.key) {
                    case ' ': e.preventDefault(); togglePlay(); break;
                    case 'ArrowRight': nextTrack(); break;
                    case 'ArrowLeft': prevTrack(); break;
                    case 's': case 'S': toggleShuffle(); break;
                    case 'f': case 'F': 
                        const music = currentPlaylist[currentIndex % currentPlaylist.length] || currentPlaylist[0];
                        if (music) { toggleFavorito(music.id); buildGenresGrid(); }
                        break;
                }
            });

            // Fechar modais clicando fora
            document.getElementById('playlistsModal').addEventListener('click', (e) => { if (e.target === document.getElementById('playlistsModal')) document.getElementById('playlistsModal').classList.remove('open'); });
            document.getElementById('favModal').addEventListener('click', (e) => { if (e.target === document.getElementById('favModal')) document.getElementById('favModal').classList.remove('open'); });
            document.getElementById('feedbackModal').addEventListener('click', (e) => { if (e.target === document.getElementById('feedbackModal')) document.getElementById('feedbackModal').classList.remove('open'); });
            document.getElementById('historicoModal').addEventListener('click', (e) => { if (e.target === document.getElementById('historicoModal')) document.getElementById('historicoModal').classList.remove('open'); });
            document.getElementById('genresModal').addEventListener('click', (e) => { if (e.target === document.getElementById('genresModal')) document.getElementById('genresModal').classList.remove('open'); });

            // Feedback
            document.querySelectorAll('.star').forEach(star => {
                star.addEventListener('click', () => {
                    const rating = parseInt(star.dataset.rating);
                    document.querySelectorAll('.star').forEach((s, i) => {
                        if (i < rating) { s.classList.add('fas', 'active'); s.classList.remove('far'); }
                        else { s.classList.remove('fas', 'active'); s.classList.add('far'); }
                    });
                });
            });
            document.getElementById('sendFeedbackBtn').addEventListener('click', () => {
                const comment = document.getElementById('feedbackText').value;
                const stars = document.querySelectorAll('.star.active').length;
                const msg = `🎵 *VAI DE BOA! MUSIC* 🎵%0A⭐ ${'★'.repeat(stars)}${'☆'.repeat(5-stars)}%0A💬 ${comment || "Sem comentário"}`;
                window.open(`https://wa.me/5512988461978?text=${msg}`, '_blank');
                showNotification("📱 Feedback enviado!", 1000);
                document.getElementById('feedbackModal').classList.remove('open');
            });

            function openFeedback() {
                document.querySelectorAll('.star').forEach(s => { s.classList.remove('fas', 'active'); s.classList.add('far'); });
                document.getElementById('feedbackModal').classList.add('open');
            }

            function openGenres() {
                buildGenresGrid();
                document.getElementById('genresModal').classList.add('open');
                showControls();
            }

            // Audio events
            audio.addEventListener('play', () => { isPlaying = true; playBtn.innerHTML = '<i class="fas fa-pause"></i>'; startTimer(); });
            audio.addEventListener('pause', () => { isPlaying = false; playBtn.innerHTML = '<i class="fas fa-play"></i>'; stopTimer(); });
            audio.addEventListener('ended', () => { if (!carregandoMusica) nextTrack(); });

            window.addEventListener('load', iniciar);
        })();
    </script>
</body>
