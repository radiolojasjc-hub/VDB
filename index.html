        #adminPanel{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,10,30,0.96);border-radius:25px;padding:25px;z-index:99999;width:90%;max-width:400px;border:2px solid #00f3ff;flex-direction:column;gap:12px;color:white}

    function shuffleArray(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

    function atualizarTimerDisplay(){

    function iniciarTimer(){

        timerInterval=setInterval(()=>{

                tempoRestante--;

                atualizarTimerDisplay();
            }

    }

    function carregarEstado(){
        if(localStorage.getItem('vdb_bloqueado_permanente')==='true'){
            playerContainer.classList.add('visible');
            loadingScreen.style.display='none';
            bloquearPlayer();
            return;
        }
        if(localStorage.getItem('vdb_desbloqueado')==='true'){
            desbloqueado=true;
            playerContainer.classList.add('visible');
            loadingScreen.style.display='none';
            timerTop.textContent='🔓 LIBERADO';
            timerTop.className='timer-top liberado';
            iniciarPlayer();
            return;
        }
        const salvo=localStorage.getItem('vdb_tempo_restante');
        if(salvo&&parseInt(salvo)>Date.now()){
            tempoRestante=Math.floor((parseInt(salvo)-Date.now())/1000);
            playerContainer.classList.add('visible');
            loadingScreen.style.display='none';
            iniciarTimer();
            iniciarPlayer();
            return;
        }
        if(salvo&&parseInt(salvo)<=Date.now()){
            playerContainer.classList.add('visible');
            loadingScreen.style.display='none';
            bloquearPlayer();
            return;
        }
        localStorage.setItem('vdb_tempo_restante',String(Date.now()+TEMPO_INICIAL*1000));
        tempoRestante=TEMPO_INICIAL;
        playerContainer.classList.add('visible');
        loadingScreen.style.display='none';
        iniciarTimer();
        iniciarPlayer();
    }

    function createSilentAudio(){
        const sr=44100,dur=5,ns=sr*dur;
        const buf=new ArrayBuffer(44+ns*2);
        const v=new DataView(buf);
        const ws=(off,str)=>{for(let i=0;i<str.length;i++)v.setUint8(off+i,str.charCodeAt(i));};
        ws(0,'RIFF');v.setUint32(4,36+ns*2,true);ws(8,'WAVE');
        ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);
        v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);
        v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');
        v.setUint32(40,ns*2,true);
        return new Blob([buf],{type:'audio/wav'});
    }

    function iniciarManutencaoConstante(){
        if(backgroundInterval)clearInterval(backgroundInterval);
        backgroundInterval=setInterval(async()=>{
            try{
                if(backgroundAudio.paused&&isBackgroundActive)await backgroundAudio.play().catch(()=>{});
                if(isPlaying&&audio.paused&&!audio.ended)await audio.play().catch(()=>{});
                if(audio.ended&&isPlaying)nextTrack();
            }catch(e){}
        },1000);
    }

    async function ativarAudioBackground(){
        try{
            const su=URL.createObjectURL(createSilentAudio());
            backgroundAudio.src=su;
            backgroundAudio.loop=true;
            backgroundAudio.volume=0.001;
            await backgroundAudio.play();
            isBackgroundActive=true;
            audioStatus.classList.add('active');
            audioStatus.innerHTML='<span class="dot"></span> Ativado';
            iniciarManutencaoConstante();
            if('wakeLock'in navigator){try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
            return true;
        }catch(e){return false;}
    }

    function construirPlaylist(genero,musics){
        const lista=musics||musicas;
        if(!lista||lista.length===0)return[];
        let filtradas=lista;
        if(genero&&genero!=='FAVORITOS'){
            filtradas=lista.filter(m=>m.genero===genero);
            if(filtradas.length===0)filtradas=[...lista];
        }
        return shuffleMode?shuffleArray([...filtradas]):[...filtradas];
    }

    function obterMusicaAtual(){
        if(!playlistAtual||playlistAtual.length===0)return null;
        if(indiceAtual>=playlistAtual.length){playlistAtual=construirPlaylist(modoAtual,musicas);indiceAtual=0;}
        return playlistAtual[indiceAtual]||null;
    }

    function avancarMusica(){
        if(!playlistAtual||playlistAtual.length===0){playlistAtual=construirPlaylist(modoAtual,musicas);indiceAtual=0;}
        else{
            indiceAtual++;
            if(indiceAtual>=playlistAtual.length){playlistAtual=construirPlaylist(modoAtual,musicas);indiceAtual=0;}
        }
        return obterMusicaAtual();
    }

    function voltarMusica(){
        if(!playlistAtual||playlistAtual.length===0){playlistAtual=construirPlaylist(modoAtual,musicas);indiceAtual=0;}
        else{indiceAtual--;if(indiceAtual<0)indiceAtual=playlistAtual.length-1;}
        return obterMusicaAtual();
    }

    async function carregarPlaylistPorGenero(genero){
        const url=GENRE_URLS[genero];
        if(!url)return null;
        try{
            const controller=new AbortController();
            const timeoutId=setTimeout(()=>controller.abort(),15000);
            const r=await fetch(url,{signal:controller.signal});
            clearTimeout(timeoutId);
            if(!r.ok)throw new Error('HTTP '+r.status);
            let d=await r.json();
            if(!Array.isArray(d)){
                if(d.musicas)d=d.musicas;
                else if(d.data)d=d.data;
                else d=Object.values(d)[0];
            }
            const lista=d.filter(m=>m.src&&m.title);
            lista.forEach(m=>{m.id='gen_'+genero+'_'+Math.random().toString(36).substr(2,6);m.genero=genero;if(!m.artist)m.artist='Artista';});
            return lista;
        }catch(e){return null;}
    }

    async function selecionarGenero(genero){
        showLoad(true);
        const lista=await carregarPlaylistPorGenero(genero);
        if(!lista||lista.length===0){
            showLoad(false);
            showNotification('❌ Erro ao carregar '+genero,2000);
            document.getElementById('genresModal').classList.remove('open');
            return;
        }
        audio.pause();audio.src='';audio.load();
        musicas=lista;modoAtual=genero;
        playlistAtual=shuffleArray(musicas);indiceAtual=0;
        genreBadge.innerHTML=genero==='BÔNUS'?'🎵 BÔNUS':genero;
        genreBadge.className=genero==='BÔNUS'?'genre-badge bonus':'genre-badge';
        genreBadge.style.borderLeftColor=CORES[genero]||'#00f3ff';
        genreBadge.style.color=CORES[genero]||'#fff';
        const m=playlistAtual[0];
        if(m){scrollText.innerHTML='🎵 '+m.title+' - '+m.artist+' ['+genero+'] 🎵';updateHeart(m.id);}
        buildGenresGrid();
        showLoad(false);
        document.getElementById('genresModal').classList.remove('open');
        goFullscreen();
        if(isBackgroundActive)setTimeout(()=>playMusic(),300);
    }

    async function playMusic(){
        if(!isBackgroundActive||carregandoMusica||!musicas.length)return;
        carregandoMusica=true;
        const track=obterMusicaAtual();
        if(!track){carregandoMusica=false;return;}
        scrollText.innerHTML='🎵 '+track.title+' - '+track.artist+' ['+track.genero+'] 🎵';
        updateHeart(track.id);
        audio.pause();audio.src=track.src;audio.load();
        return new Promise((resolve)=>{
            const timeoutId=setTimeout(()=>{carregandoMusica=false;nextTrack();resolve(false);},10000);
            audio.oncanplaythrough=async()=>{
                clearTimeout(timeoutId);carregandoMusica=false;
                try{await audio.play();isPlaying=true;playBtn.innerHTML='<i class="fas fa-pause"></i>';resolve(true);}
                catch(e){resolve(false);}
            };
            audio.onerror=()=>{clearTimeout(timeoutId);carregandoMusica=false;nextTrack();resolve(false);};
            audio.onended=()=>{if(!carregandoMusica)nextTrack();};
        });
    }

    function nextTrack(){
        if(carregandoMusica)return;
        const track=avancarMusica();

                div.innerHTML='<div class="info"><div class="title">'+m.title+'</div><div class="artist">'+m.artist+'</div></div><button class="remove" data-id="'+m.id+'"><i class="fas fa-times-circle"></i></button>';
                div.querySelector('.remove').addEventListener('click',(e)=>{e.stopPropagation();toggleFavorito(m.id);document.getElementById('favTopBtn').click();});
                list.appendChild(div);
            });
        }
        document.getElementById('favModal').classList.add('open');
    });
    document.getElementById('closeFavModal').addEventListener('click',()=>document.getElementById('favModal').classList.remove('open'));
    document.getElementById('closeFavBtn').addEventListener('click',()=>document.getElementById('favModal').classList.remove('open'));

    window.openGenres=()=>{buildGenresGrid();document.getElementById('genresModal').classList.add('open');};
    window.ativarAdmin=function(){
        adminClicks=(adminClicks||0)+1;
        setTimeout(()=>adminClicks=0,1500);
        if(adminClicks>=5){adminClicks=0;document.getElementById('adminPanel').classList.toggle('open');}
    };
    let adminClicks=0;

    carregarEstado();
})();
</script>
</body>
</html>
