    async function carregar(g) {
        const u = GENRE_URLS[g];
        if (!u) return null;
        try {
            const c = new AbortController();
            const t = setTimeout(() => c.abort(), 15000);
            const r = await fetch(u, { signal: c.signal, cache: 'no-store' });
            clearTimeout(t);
            let d = await r.json();
            if (!Array.isArray(d)) { d = d.musicas || d.data || Object.values(d)[0]; }
            const musicasFiltradas = d.filter(m => m.src && m.title).map(m => ({
                ...m,
                id: 'g_' + Math.random().toString(36).slice(2),
                genero: g,
                artist: m.artist || 'Artista'
            }));
            
            const chave = 'vdb_tamanho_' + g;
            const tamanhoAntigo = parseInt(localStorage.getItem(chave) || '0');
            const tamanhoNovo = musicasFiltradas.length;
            
            if (tamanhoAntigo > 0 && tamanhoNovo !== tamanhoAntigo) {
                const diferenca = tamanhoNovo - tamanhoAntigo;
                const msg = diferenca > 0 ? `✅ +${diferenca} NOVAS MÚSICAS!` : `📉 ${Math.abs(diferenca)} músicas removidas`;
                mostrarBanner(msg);
            }
            localStorage.setItem(chave, tamanhoNovo.toString());
            return musicasFiltradas;
        } catch (e) { return null; }
    }

            const div = document.createElement('div');
            div.className = 'fav-item';

                <div class="fav-info">

                    <div class="artist">${m.artist} • ${m.genero || 'Gênero'}</div>

    $('closeFavModal').onclick=()=>$('favModal').classList.remove('open');
    $('closeFavBtn').onclick=()=>$('favModal').classList.remove('open');

    window.openGenres=()=>{grid();$('genresModal').classList.add('open');};
    let ac=0;window.ativarAdmin=function(){ac++;setTimeout(()=>ac=0,2000);if(ac>=5){ac=0;$('adminPanel').classList.toggle('open');notif('🔐 ADMIN!');}};

    document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key===' '){e.preventDefault();togglePlay();}if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key==='s'||e.key==='S')toggleShuf();});
    let lc=0;document.addEventListener('click',e=>{if(e.target.closest('button')||e.target.closest('.genre-card')||e.target.closest('#infoScroll'))return;const n=Date.now();if(n-lc<300)togglePlay();lc=n;showCtrl();});

    let tx=0,lt=0;
    document.addEventListener('touchstart',e=>{
        if($('genresModal').classList.contains('open'))return;
        tx=e.changedTouches[0].screenX;
        const n=Date.now();
        if(n-lt<300)togglePlay();
        lt=n;showCtrl();
    });
    document.addEventListener('touchend',e=>{
        if($('genresModal').classList.contains('open'))return;
        const d=e.changedTouches[0].screenX-tx;
        if(Math.abs(d)>50){if(d<0)next();else prev();}
    });

    carregarEstado();
})();
</script>
</body>
</html>
