<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vai de Boa! Music</title>
    <link rel="icon" href="va.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #0a0a0a; overflow: hidden; height: 100vh; }
        :root { --neon-cyan: #00f3ff; --neon-pink: #ff2d7f; }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1a1a2e, #0a0a0a);
            z-index: -1;
        }
        
        /* Container de mídia (vídeos e imagens) */
        .media-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        .media-container video,
        .media-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 1s ease;
            opacity: 0;
            z-index: 1;
        }
        .media-container .active {
            opacity: 1;
            z-index: 3;
        }
        .media-container .inactive {
            opacity: 0;
            z-index: 0;
        }
        
        /* Overlay escuro para legibilidade */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.25);
            z-index: 4;
            pointer-events: none;
        }
        
        /* Título do projeto */
        .project-title {
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            color: white;
            font-size: 2.2rem;
            font-weight: 900;
            text-shadow: 0 0 30px rgba(0, 243, 255, 0.5), 0 0 60px rgba(255, 45, 127, 0.3);
            letter-spacing: 6px;
            text-align: center;
            background: rgba(0,0,0,0.3);
            padding: 10px 25px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            display: none;
        }
        .project-title span { color: var(--neon-cyan); }
        
        /* BOTÃO ATIVAR RÁDIO - moderno */
        .btn-ativar {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #00f3ff, #00d4ff);
            color: #000;
            padding: 18px 40px;
            border-radius: 60px;
            font-weight: 900;
            font-size: 1.4rem;
            z-index: 10000;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.5), 0 0 80px rgba(0, 243, 255, 0.2);
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
            transition: all 0.3s ease;
            display: none;
            animation: pulseModern 2s infinite;
        }
        .btn-ativar:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 0 60px rgba(0, 243, 255, 0.8);
        }
        .btn-ativar:active {
            transform: translateX(-50%) scale(0.95);
        }
        .btn-ativar .subtitulo {
            display: block;
            font-size: 0.6rem;
            font-weight: 400;
            letter-spacing: 4px;
            opacity: 0.7;
            margin-top: 2px;
        }
        @keyframes pulseModern {
            0% { box-shadow: 0 0 30px rgba(0, 243, 255, 0.3), 0 0 60px rgba(0, 243, 255, 0.1); }
            50% { box-shadow: 0 0 60px rgba(0, 243, 255, 0.7), 0 0 120px rgba(0, 243, 255, 0.3); }
            100% { box-shadow: 0 0 30px rgba(0, 243, 255, 0.3), 0 0 60px rgba(0, 243, 255, 0.1); }
        }
        
        /* APP */
        .app { 
            position: relative; 
            z-index: 10; 
            width: 100%; 
            height: 100vh; 
            display: none; 
            flex-direction: column; 
            justify-content: space-between; 
            background: transparent; 
        }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); border-bottom: 2px solid rgba(255,255,255,0.1); flex-wrap: nowrap; gap: 4px; flex-shrink: 0; }
        .genre-badge { background: rgba(255,255,255,0.08); padding: 3px 8px; border-radius: 30px; font-size: 0.55rem; font-weight: bold; color: #fff; border-left: 2px solid #00f3ff; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30%; cursor: pointer; flex-shrink: 1; min-width: 40px; }
        .genre-badge:active { transform: scale(0.95); }
        .genre-badge.favoritos { border-left-color: #ff2d7f; color: #ff2d7f; background: rgba(255,45,127,0.15); }
        .top-buttons { display: flex; gap: 4px; align-items: center; flex-wrap: nowrap; flex-shrink: 0; }
        
        .fav-top-btn { background: rgba(255,45,127,0.15); border: 1px solid #ff2d7f; color: #ff2d7f; padding: 2px 8px; border-radius: 30px; font-size: 0.5rem; cursor: pointer; display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
        .fav-top-btn:active { transform: scale(0.92); background: #ff2d7f; color: #000; }
        .fav-top-btn .badge { background: #ff2d7f; color: #000; border-radius: 50%; padding: 0 4px; font-size: 0.45rem; font-weight: bold; min-width: 14px; text-align: center; }
        
        .audio-status { font-size: 0.45rem; color: #aaa; display: flex; align-items: center; gap: 3px; background: rgba(0,0,0,0.3); padding: 1px 6px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); flex-shrink: 0; }
        .audio-status.active { color: #4ade80; border-color: #4ade80; }
        .audio-status .dot { width: 4px; height: 4px; border-radius: 50%; background: #666; display: inline-block; }
        .audio-status.active .dot { background: #4ade80; animation: pulse-dot 1s infinite; }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .menu-button { background: rgba(255,255,255,0.05); color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; }
        .menu-button:active { background: var(--neon-cyan); color: #000; }
        .menu-popup { position: absolute; top: 42px; right: 8px; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); border-radius: 16px; padding: 6px; z-index: 32; display: none; flex-direction: column; gap: 4px; border: 1px solid var(--neon-cyan); min-width: 130px; }
        .menu-popup.open { display: flex; }
        .menu-popup button { background: rgba(255,255,255,0.08); border: none; color: white; padding: 5px 12px; border-radius: 30px; font-size: 0.6rem; display: flex; align-items: center; gap: 6px; cursor: pointer; text-align: left; }
        .menu-popup button:active { background: var(--neon-cyan); color: #000; }
        .menu-popup .close-menu-btn { background: rgba(255,45,127,0.2); border: 1px solid #ff2d7f; color: #ff2d7f; }
        
        .info-scroll { position: fixed; top: 34px; left: 0; right: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); padding: 6px 12px; z-index: 30; border-bottom: 1px solid rgba(255,255,255,0.05); overflow: hidden; white-space: nowrap; }
        .info-scroll p { color: white; font-size: 0.85rem; font-weight: 900; letter-spacing: 2px; animation: scrollText 20s linear infinite; display: inline-block; padding-right: 50px; text-shadow: 0 0 30px rgba(0,0,0,0.8); text-transform: uppercase; }
        @keyframes scrollText { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        .now-playing { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 15; width: 90%; max-width: 400px; user-select: none; -webkit-user-select: none; }
        .now-playing .music-title, .now-playing .music-artist { display: none; }
        .fav-heart-center { display: flex; justify-content: center; margin: 0; }
        .now-playing .fav-heart { font-size: 4rem; color: #555; cursor: pointer; transition: all 0.3s; text-shadow: 0 0 30px rgba(0,0,0,0.9); display: inline-block; }
        .now-playing .fav-heart.active { color: #ff2d7f; text-shadow: 0 0 40px rgba(255,45,127,0.5); }
        .now-playing .fav-heart:active { transform: scale(1.2); }
        
        .teaching-bar { position: fixed; bottom: 115px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); backdrop-filter: blur(12px); padding: 6px 22px; border-radius: 40px; font-size: 0.6rem; font-weight: 800; color: #ddd; z-index: 26; pointer-events: none; border: 1px solid rgba(255,255,255,0.05); white-space: nowrap; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .teaching-bar .cyan { color: var(--neon-cyan); font-weight: 900; }
        
        .bottom-controls { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.05); padding: 6px 12px 10px; z-index: 20; transform: translateY(100%); transition: transform 0.3s ease; }
        .bottom-controls.visible { transform: translateY(0); }
        .progress-time { display: flex; justify-content: space-between; font-size: 0.5rem; color: #aaa; margin-bottom: 2px; }
        .progress-bar { height: 3px; background: rgba(255,255,255,0.15); cursor: pointer; border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink)); width: 0%; border-radius: 4px; }
        .buttons-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 4px; }
        .ctrl-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 0.8rem; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; }
        .ctrl-btn:active { transform: scale(0.92); background: var(--neon-cyan); color: #000; }
        .play-big { background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); width: 44px; height: 44px; font-size: 1.1rem; color: #000; border: none; }
        .shuffle-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 0.7rem; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; }
        .shuffle-btn.active { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); }
        
        .fab-container { position: fixed; bottom: 100px; right: 12px; z-index: 40; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        .fab-main { background: linear-gradient(135deg, #3a3a3a, #1a1a1a); width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; font-size: 1.2rem; box-shadow: 0 0 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
        .fab-main:active { transform: scale(0.92); }
        .fab-main i { pointer-events: none; }
        .fab-sub { background: rgba(0,0,0,0.9); backdrop-filter: blur(14px); border-radius: 30px; padding: 5px; display: none; flex-direction: column; gap: 3px; border: 1px solid rgba(255,255,255,0.1); }
        .fab-sub.open { display: flex; }
        .fab-sub-btn { background: rgba(255,255,255,0.05); border: none; color: white; padding: 6px 14px; border-radius: 25px; font-size: 0.65rem; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; min-width: 100px; }
        .fab-sub-btn:active { background: var(--neon-cyan); color: #000; }
        .fab-sub-btn i { font-size: 0.85rem; width: 18px; text-align: center; pointer-events: none; }
        .fab-sub-btn .fab-icon-youtube { color: #FF0000; }
        
        .notification { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); color: var(--neon-cyan); padding: 3px 12px; border-radius: 30px; font-size: 0.55rem; z-index: 10001; opacity: 0; transition: opacity 0.3s; pointer-events: none; border-left: 3px solid var(--neon-cyan); }
        .notification.show { opacity: 1; }
        
        #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9998; align-items: center; justify-content: center; }
        #loadingOverlay.active { display: flex; }
        #loadingOverlay i { font-size: 3rem; color: var(--neon-cyan); animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* MODAIS */
        .fav-modal, .feedback-modal, .historico-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(20,20,40,0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 25px;
            z-index: 5000;
            width: 90%;
            max-width: 420px;
            text-align: center;
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            box-shadow: 0 0 40px rgba(0,243,255,0.2), 0 0 80px rgba(255,45,127,0.1);
        }
        .fav-modal.open, .feedback-modal.open, .historico-modal.open {
            display: flex;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            border-image: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)) 1;
        }
        .fav-modal h3, .feedback-modal h3, .historico-modal h3 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .fav-modal .close-fav, .historico-modal .close-hist {
            position: absolute;
            top: 12px;
            right: 16px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .fav-modal .close-fav:active, .historico-modal .close-hist:active { color: #fff; }
        
        .fav-list, .historico-list {
            max-height: 50vh;
            overflow-y: auto;
            text-align: left;
            margin-bottom: 15px;
        }
        .fav-item, .historico-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: white;
        }
        .fav-item .info, .historico-item .info { flex: 1; cursor: pointer; min-width: 0; }
        .fav-item .info .title, .historico-item .info .title { font-weight: bold; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .fav-item .info .artist, .historico-item .info .artist { font-size: 0.7rem; color: #aaa; }
        .fav-item .remove { background: transparent; border: none; color: #ff2d7f; font-size: 1.1rem; cursor: pointer; padding: 4px 8px; }
        .fav-empty { color: #888; padding: 30px; text-align: center; }
        .fav-modal .close-btn, .historico-modal .close-btn {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            border: none;
            padding: 12px;
            border-radius: 30px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0;
            font-size: 0.95rem;
        }
        .fav-modal .close-btn:active, .historico-modal .close-btn:active { transform: scale(0.95); }
        
        /* Busca nos favoritos */
        .search-fav {
            width: 100%;
            padding: 8px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 0.8rem;
            margin-bottom: 12px;
            outline: none;
        }
        .search-fav::placeholder { color: #666; }
        .search-fav:focus { border-color: var(--neon-cyan); }
        
        .fav-actions {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .fav-actions button {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ccc;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .fav-actions button:active { background: var(--neon-cyan); color: #000; }
        
        .genres-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(20,20,40,0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px 30px 0 0;
            padding: 16px 10px 20px;
            z-index: 2000;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            max-height: 60vh;
            overflow-y: auto;
            border-top: 2px solid transparent;
            border-image: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)) 1;
            box-shadow: 0 -10px 40px rgba(0,243,255,0.15);
        }
        .genres-modal.open { transform: translateY(0); }
        .genres-modal h3 {
            text-align: center;
            margin-bottom: 12px;
            font-size: 0.9rem;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .genres-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }
        .genre-card {
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 2px solid rgba(255,255,255,0.12);
            aspect-ratio: 4 / 2.4;
            background: rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            font-weight: 700;
            font-size: 0.7rem;
            padding: 6px;
        }
        .genre-card:active { transform: scale(0.94); }
        .genre-card.fav-card {
            border-color: #ff2d7f;
            background: rgba(255,45,127,0.15);
        }
        .close-genres {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            border: none;
            border-radius: 30px;
            color: #000;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }
        .close-genres:active { transform: scale(0.95); }
        
        .feedback-modal .stars { display: flex; justify-content: center; gap: 6px; margin: 10px 0; }
        .feedback-modal .star { font-size: 1.8rem; color: #555; cursor: pointer; transition: 0.15s; }
        .feedback-modal .star.active { color: #ffd700; text-shadow: 0 0 15px #ffd700; }
        .feedback-modal textarea {
            width: 100%;
            height: 80px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(0,243,255,0.2);
            border-radius: 15px;
            padding: 10px;
            color: white;
            resize: none;
            font-size: 0.85rem;
        }
        .feedback-modal textarea::placeholder { color: #666; }
        .feedback-modal button {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            border: none;
            padding: 12px;
            border-radius: 30px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.95rem;
        }
        .feedback-modal button:active { transform: scale(0.95); }
        .feedback-modal .close-feedback {
            background: rgba(255,255,255,0.1) !important;
            color: white !important;
            margin-top: 5px;
        }
        
        /* Modal de Pastas */
        #playlistsModal .pasta-input-area {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        #playlistsModal .pasta-input-area input {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 6px 12px;
            color: white;
            font-size: 0.8rem;
        }
        #playlistsModal .pasta-input-area button {
            background: var(--neon-cyan);
            color: #000;
            border: none;
            border-radius: 20px;
            padding: 6px 14px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .sugestoes-pastas {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-bottom: 12px;
        }
        .sugestoes-pastas button {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.65rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .sugestoes-pastas button:active {
            background: var(--neon-cyan);
            color: #000;
            transform: scale(0.95);
        }
        .sugestoes-pastas button i { font-size: 0.7rem; }
        
        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: white;
        }
        .playlist-item .info { flex: 1; cursor: pointer; min-width: 0; }
        .playlist-item .info .title { font-weight: bold; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .playlist-item .info .sub { font-size: 0.6rem; color: #666; }
        .playlist-item .actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
        .playlist-item .actions button {
            background: transparent;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 0.8rem;
            width: 28px;
            height: 28px;
            border-radius: 50%;

    <audio id="musicPlayer" preload="auto"></audio>
    <audio id="backgroundAudio" preload="auto" style="display: none;"></audio>

    <script>
        (function() {
            'use strict';

            // ==============================
            // CONFIGURAÇÃO DE MÍDIAS (vídeos e imagens)
            // Adicione quantos arquivos quiser aqui!
            const midias = [
                { tipo: 'video', src: 'vai1.mp4' },
                { tipo: 'imagem', src: 'gusta.png' },
                // { tipo: 'video', src: 'ivete.mp4' },
                // { tipo: 'imagem', src: 'emi.png' },
                // { tipo: 'video', src: 'micha.mp4' },
            ];
            // ==============================

            // ---------- PLAYLISTS E CONFIGURAÇÕES ----------
            const PLAYLIST_RELIGIOSA_FALLBACK = [
                {"id":682,"artist":"Churrasco Cerveja e Viola","title":"Nada Mudou","genero":"RELIGIOSA","src":"Valeria-varros.mp3"},
                {"id":683,"artist":"Cleber Cauan","title":"I Love You Baby","genero":"RELIGIOSA","src":"Cleber-Cauan-Resenha-na-Fazenda.mp3"},
                {"id":684,"artist":"Gian e Giovani","title":"Favo de Mel","genero":"RELIGIOSA","src":"Giane-Giovani.mp3"},
                {"id":685,"artist":"Humberto e Ronaldo","title":"Só não embaça meus forró","genero":"RELIGIOSA","src":"Humberto-e-Ronaldo.mp3"},
                {"id":686,"artist":"João Neto e Frederico","title":"Toca Aquela Desce Mais Uma","genero":"RELIGIOSA","src":"João-Neto-e-Frederico.mp3"},
                {"id":687,"artist":"Panda Cantor","title":"Onde ela tá","genero":"RELIGIOSA","src":"Panda.mp3"}
            ];

            const GENRE_URLS = {
                'PADRÃO': 'https://raw.githubusercontent.com/radiolojasjc-hub/play12/refs/heads/main/play.json',
                'FLASHBACK': 'https://raw.githubusercontent.com/radiolojasjc-hub/flashbacktop/refs/heads/main/flashback.json',
                'RELIGIOSA': 'https://raw.githubusercontent.com/radiolojasjc-hub/religiosa/refs/heads/main/religiosa.json',
                'ROMÂNTICA': 'https://raw.githubusercontent.com/radiolojasjc-hub/romanticatop/refs/heads/main/romantica.json',
                'MPB': 'https://raw.githubusercontent.com/radiolojasjc-hub/mpbtop/refs/heads/main/mpb.json',
                'POP': 'https://raw.githubusercontent.com/radiolojasjc-hub/poptop/refs/heads/main/pop.json',
                'SERTANEJO': 'https://raw.githubusercontent.com/radiolojasjc-hub/sertanejo/refs/heads/main/sertanejo.json',
                'FORRÓ': 'https://raw.githubusercontent.com/radiolojasjc-hub/forrotop/refs/heads/main/forro.json',
                'SAMBA': 'https://raw.githubusercontent.com/radiolojasjc-hub/sambatop/refs/heads/main/samba.json',
                'BREGA': 'https://raw.githubusercontent.com/radiolojasjc-hub/bregatop/refs/heads/main/brega.json',
                'REGGAE': 'https://raw.githubusercontent.com/radiolojasjc-hub/reggaetop/refs/heads/main/reggae.json',
                'MODA TOP': 'https://raw.githubusercontent.com/radiolojasjc-hub/modatop/refs/heads/main/moda.json'
            };

            const CORES_POR_GENERO = {
                'PADRÃO': '#ffffff',
                'FLASHBACK': '#ffaa00',
                'RELIGIOSA': '#aa55ff',
                'ROMÂNTICA': '#ff2d7f',
                'MPB': '#00ff88',
                'POP': '#ff3366',
                'SERTANEJO': '#ff8800',
                'FORRÓ': '#ff00aa',
                'SAMBA': '#ffdd00',
                'BREGA': '#ff66aa',
                'REGGAE': '#00ffaa',
                'MODA TOP': '#ff4400'
            };

            // Variáveis globais
            let musicas = [];
            let currentPlaylist = [];
            let currentIndex = 0;
            let isPlaying = false;
            let shuffleMode = false;
            let isBackgroundActive = false;
            let timerInterval = null;
            let modoAtual = "PADRÃO";
            let historicoReproducao = [];
            let modoFavoritosAtivo = false;
            let fabOpen = false;
            let sleepTimer = null;
            let hideControlsTimeout = null;
            const playlistCache = {};
            let ultimoId = null;
            let carregandoMusica = false;

            // ---------- SISTEMA DE PASTAS (com Favoritos) ----------
            let playlists = {};
            let pastaAtiva = 'Favoritos';

            function carregarPlaylists() {
                const saved = localStorage.getItem('radio_user_playlists');
                if (saved) {
                    try {
                        playlists = JSON.parse(saved);
                        if (!playlists['Favoritos']) playlists['Favoritos'] = [];
                    } catch(e) {
                        playlists = { 'Favoritos': [] };
                    }
                } else {
                    playlists = { 'Favoritos': [] };
                }
                for (let key in playlists) {
                    playlists[key] = [...new Set(playlists[key])];
                }
                salvarPlaylists();
            }

            function salvarPlaylists() {
                localStorage.setItem('radio_user_playlists', JSON.stringify(playlists));
            }

            function criarPasta(nome) {
                nome = nome.trim();
                if (!nome) { showNotification('Digite um nome!', 1000); return false; }
                if (playlists[nome]) { showNotification('⚠️ Pasta já existe!', 1000); return false; }
                playlists[nome] = [];
                salvarPlaylists();
                renderizarListaPastas();
                showNotification(`✅ Pasta "${nome}" criada!`, 1500);
                return true;
            }

            function excluirPasta(nome) {
                if (nome === 'Favoritos') { showNotification('Não pode excluir a padrão', 1000); return; }
                if (!confirm(`Deletar a pasta "${nome}" e todas as músicas?`)) return;
                delete playlists[nome];
                salvarPlaylists();
                renderizarListaPastas();
                showNotification(`🗑️ Pasta "${nome}" excluída`, 1500);
            }

            function adicionarMusicaNaPasta(musicId, nomePasta) {
                if (!playlists[nomePasta]) {
                    showNotification('Pasta não encontrada', 1000);
                    return;
                }
                if (playlists[nomePasta].includes(musicId)) {
                    showNotification('⚠️ Música já está nesta pasta', 1000);
                    return;
                }
                playlists[nomePasta].push(musicId);
                salvarPlaylists();
                renderizarListaPastas();
                if (nomePasta === 'Favoritos') {
                    updateHeartIcon(musicId);
                    atualizarBadgeFavoritos();
                }
                showNotification(`✅ Adicionada em "${nomePasta}"`, 1000);
            }

            function removerMusicaDaPasta(musicId, nomePasta) {
                if (!playlists[nomePasta]) return;
                playlists[nomePasta] = playlists[nomePasta].filter(id => id !== musicId);
                salvarPlaylists();
                renderizarListaPastas();
                if (nomePasta === 'Favoritos') {
                    updateHeartIcon(musicId);
                    atualizarBadgeFavoritos();
                }
                showNotification(`🗑️ Removida de "${nomePasta}"`, 1000);
            }

            // Toggle favorito (pasta "Favoritos")
            function toggleFavorito(musicId) {
                const pasta = 'Favoritos';
                if (!playlists[pasta]) playlists[pasta] = [];
                const index = playlists[pasta].indexOf(musicId);
                if (index > -1) {
                    playlists[pasta].splice(index, 1);
                    showNotification('❤️ Removido dos favoritos', 1000);
                } else {
                    playlists[pasta].push(musicId);
                    showNotification('❤️ Adicionado aos favoritos!', 1000);
                }
                salvarPlaylists();
                updateHeartIcon(musicId);
                renderizarListaPastas();
                atualizarBadgeFavoritos();
                renderFavList();
            }

            function atualizarBadgeFavoritos() {
                const qtd = (playlists['Favoritos'] || []).length;
                document.getElementById('favCount').textContent = qtd;
            }

            function tocarPasta(nomePasta) {
                const ids = playlists[nomePasta] || [];
                if (ids.length === 0) { showNotification(`⚠️ "${nomePasta}" está vazia!`, 1500); return; }
                
                const musicasDaPasta = ids.map(id => musicas.find(m => m.id === id)).filter(Boolean);
                if (musicasDaPasta.length === 0) { showNotification('Nenhuma música válida', 1000); return; }
                
                pastaAtiva = nomePasta;
                modoFavoritosAtivo = false;
                modoAtual = `📁 ${nomePasta}`;
                
                currentPlaylist = shuffleArray([...musicasDaPasta]);
                currentIndex = 0;
                historicoReproducao = [];
                ultimoId = null;
                
                const primeira = currentPlaylist[0];
                if (primeira) {
                    updateNowPlaying(primeira);
                    adicionarAoHistorico(primeira);
                }
                
                document.getElementById('genreBadge').innerHTML = `📁 ${nomePasta} (${musicasDaPasta.length})`;
                document.getElementById('genreBadge').className = 'genre-badge';
                document.getElementById('playlistsModal').classList.remove('open');
                
                if (isBackgroundActive) {
                    setTimeout(() => playMusic(), 200);
                }
                showNotification(`🎵 Tocando: ${nomePasta}`, 2000);
            }

            function renderizarListaPastas() {
                const container = document.getElementById('playlistsList');
                container.innerHTML = '';
                const nomes = Object.keys(playlists);
                if (nomes.length === 0) {
                    container.innerHTML = '<div class="fav-empty">Crie sua primeira pasta!</div>';
                    return;
                }
                nomes.forEach(nome => {
                    const ids = playlists[nome] || [];
                    const qtd = ids.length;
                    const div = document.createElement('div');
                    div.className = 'playlist-item';
                    let preview = '';
                    const primeiras = ids.slice(0, 2).map(id => {
                        const m = musicas.find(mus => mus.id === id);
                        return m ? m.title : '?';
                    });
                    preview = primeiras.join(', ');
                    if (ids.length > 2) preview += ` +${ids.length - 2}`;
                    
                    div.innerHTML = `
                        <div class="info" data-pasta="${nome}">
                            <div class="title">📁 ${nome} <span style="font-size:0.6rem; color:#888;">(${qtd})</span></div>
                            <div class="sub">${preview || 'Vazia'}</div>
                        </div>
                        <div class="actions">
                            <button class="play-btn" data-pasta="${nome}"><i class="fas fa-play"></i></button>
                            ${nome !== 'Favoritos' ? `<button class="del-btn" data-pasta="${nome}"><i class="fas fa-trash-alt"></i></button>` : ''}
                        </div>
                    `;
                    div.querySelector('.info').addEventListener('click', () => {
                        abrirDetalhesPasta(nome);
                    });
                    div.querySelector('.play-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        tocarPasta(nome);
                    });
                    const del = div.querySelector('.del-btn');
                    if (del) {
                        del.addEventListener('click', (e) => {
                            e.stopPropagation();
                            excluirPasta(nome);
                        });
                    }
                    container.appendChild(div);
                });
            }

            function abrirDetalhesPasta(nome) {
                const ids = playlists[nome] || [];
                if (ids.length === 0) { showNotification('Pasta vazia', 1000); return; }
                const musicasDaPasta = ids.map(id => musicas.find(m => m.id === id)).filter(Boolean);
                const favList = document.getElementById('favList');
                favList.innerHTML = '';
                if (musicasDaPasta.length === 0) {
                    favList.innerHTML = '<div class="fav-empty">Nenhuma música</div>';
                } else {
                    musicasDaPasta.forEach(m => {
                        const div = document.createElement('div');
                        div.className = 'fav-item';
                        div.innerHTML = `
                            <div class="info" data-id="${m.id}" style="cursor:pointer;">
                                <div class="title">${m.title}</div>
                                <div class="artist">${m.artist}</div>
                            </div>
                            <button class="remove" data-id="${m.id}" data-pasta="${nome}"><i class="fas fa-times-circle"></i></button>
                        `;
                        div.querySelector('.info').addEventListener('click', () => {
                            playSongById(m.id);
                            document.getElementById('favModal').classList.remove('open');
                        });
                        div.querySelector('.remove').addEventListener('click', (e) => {
                            e.stopPropagation();
                            removerMusicaDaPasta(m.id, nome);
                            abrirDetalhesPasta(nome);
                        });
                        favList.appendChild(div);
                    });
                }
                document.getElementById('favModal').querySelector('h3').innerHTML = `📁 ${nome} (${musicasDaPasta.length})`;
                document.getElementById('favModal').classList.add('open');
            }

            // ---------- FAVORITOS (para a pasta "Favoritos" com busca e ações) ----------
            function renderFavList(termo = '') {
                const list = document.getElementById('favList');
                list.innerHTML = '';
                const ids = playlists['Favoritos'] || [];
                const favMusicas = ids.map(id => musicas.find(m => m.id === id)).filter(Boolean);
                if (favMusicas.length === 0) {
                    list.innerHTML = '<div class="fav-empty">Nenhuma música favorita</div>';
                    return;
                }
                // Ordenar por ordem de adição (mais recente primeiro)
                const ordenadas = [];
                for (let i = ids.length - 1; i >= 0; i--) {
                    const id = ids[i];
                    const m = musicas.find(mus => mus.id === id);
                    if (m) ordenadas.push(m);
                }
                const term = termo.toLowerCase().trim();
                const filtradas = term ? ordenadas.filter(m => m.title.toLowerCase().includes(term) || m.artist.toLowerCase().includes(term)) : ordenadas;
                if (filtradas.length === 0) {
                    list.innerHTML = '<div class="fav-empty">Nenhuma música encontrada</div>';
                    return;
                }
                filtradas.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'fav-item';
                    div.innerHTML = `
                        <div class="info" data-id="${m.id}">
                            <div class="title">${m.title}</div>
                            <div class="artist">${m.artist}</div>
                        </div>
                        <button class="remove" data-id="${m.id}"><i class="fas fa-times-circle"></i></button>
                    `;
                    div.querySelector('.info').addEventListener('click', () => {
                        playSongById(m.id);
                        document.getElementById('favModal').classList.remove('open');
                    });
                    div.querySelector('.remove').addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleFavorito(m.id);
                    });
                    list.appendChild(div);
                });
            }

            // ---------- FIM SISTEMA DE PASTAS ----------

            // Elementos DOM
            const audio = document.getElementById('musicPlayer');
            const playBtn = document.getElementById('playBtn');

            // ---- GERENCIAMENTO DE MÍDIAS ----
            const mediaContainer = document.getElementById('mediaContainer');
            const elementosMidia = [];
            let midiaAtual = 0;
            let intervaloTroca = null;

            function criarElementosMidia() {
                midias.forEach((m, index) => {
                    let el;
                    if (m.tipo === 'video') {
                        el = document.createElement('video');
                        el.src = m.src;
                        el.muted = true;
                        el.playsInline = true;
                        el.loop = false;
                        el.preload = 'auto';
                        // Garantir que o vídeo seja carregado
                        el.load();
                    } else {
                        el = document.createElement('img');
                        el.src = m.src;
                        el.alt = 'Mídia ' + index;
                    }
                    el.className = 'inactive';
                    el.dataset.index = index;
                    mediaContainer.appendChild(el);
                    elementosMidia.push(el);
                });
                // Ativa o primeiro
                if (elementosMidia.length > 0) {
                    elementosMidia[0].classList.remove('inactive');
                    elementosMidia[0].classList.add('active');
                    midiaAtual = 0;
                }
            }

            function alternarMidia() {
                const atual = elementosMidia[midiaAtual];
                if (!atual) return;

                // Desativa o atual
                atual.classList.remove('active');
                atual.classList.add('inactive');
                if (atual.tagName === 'VIDEO') {
                    atual.pause();
                    atual.currentTime = 0;
                }

                // Próximo índice
                midiaAtual = (midiaAtual + 1) % elementosMidia.length;
                const proximo = elementosMidia[midiaAtual];
                proximo.classList.remove('inactive');
                proximo.classList.add('active');

                // Se for vídeo, tenta reproduzir
                if (proximo.tagName === 'VIDEO') {
                    proximo.play().catch(() => {});
                    // Quando o vídeo terminar, força a troca
                    proximo.onended = function() {
                        if (intervaloTroca) clearTimeout(intervaloTroca);
                        intervaloTroca = setTimeout(() => {
                            alternarMidia();
                        }, 3000);
                    };
                } else {
                    // Imagem: fica 5 segundos
                    if (intervaloTroca) clearTimeout(intervaloTroca);
                    intervaloTroca = setTimeout(() => {
                        alternarMidia();
                    }, 5000);
                }
            }

            function iniciarAlternancia() {
                if (elementosMidia.length <= 1) return;
                const primeiro = elementosMidia[0];
                if (primeiro.tagName === 'VIDEO') {
                    primeiro.play().catch(() => {});
                    primeiro.onended = function() {
                        if (intervaloTroca) clearTimeout(intervaloTroca);
                        intervaloTroca = setTimeout(() => {
                            alternarMidia();
                        }, 3000);
                    };
                } else {
                    if (intervaloTroca) clearTimeout(intervaloTroca);
                    intervaloTroca = setTimeout(() => {
                        alternarMidia();
                    }, 5000);
                }
            }

            // ---------- FUNÇÕES DO PLAYER ----------
            function showNotification(msg, duration = 1500) {
                notification.textContent = msg;
                notification.classList.add('show');
                setTimeout(() => notification.classList.remove('show'), duration);
            }

            function formatTime(sec) {
                if (!sec || isNaN(sec)) return "0:00";
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            }

            function showLoading(show) {
                loadingOverlay.classList.toggle('active', show);
            }

            function showControls() {
                bottomControls.classList.add('visible');
                if (hideControlsTimeout) clearTimeout(hideControlsTimeout);
                hideControlsTimeout = setTimeout(() => bottomControls.classList.remove('visible'), 5000);
            }

            function shuffleArray(arr) {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            function goFullscreen() {
                try {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    } else if (document.documentElement.webkitRequestFullscreen) {
                        document.documentElement.webkitRequestFullscreen();
                    } else if (document.documentElement.mozRequestFullScreen) {
                        document.documentElement.mozRequestFullScreen();
                    } else if (document.documentElement.msRequestFullscreen) {
                        document.documentElement.msRequestFullscreen();
                    }
                } catch(e) {}
            }

            function gerarUrlCompleta(nomeArquivo, repo = 'play12') {
                if (!nomeArquivo || !nomeArquivo.trim()) return '';
                if (nomeArquivo.startsWith('http://') || nomeArquivo.startsWith('https://')) {
                    return nomeArquivo;
                }
                let nome = nomeArquivo.replace(/^\.\//, '').replace(/^\/+/, '');
                nome = nome.replace(/[^a-zA-Z0-9\-_.]/g, '');
                if (!nome) return '';
                return `https://raw.githubusercontent.com/radiolojasjc-hub/${repo}/refs/heads/main/${nome}`;
            }

            const REPOSITORIOS = ['play12', 'mpbtop', 'poptop', 'sertanejo', 'forrotop', 'sambatop', 'bregatop', 'reggaetop', 'modatop', 'religiosa', 'romanticatop', 'flashbacktop'];
            const EXTENSOES = ['mp3', 'm4a', 'mp4', 'aac', 'ogg', 'opus', 'wav', 'flac'];

            function gerarUrlsAlternativas(musica) {
                const urls = new Set();
                const src = musica.src || '';
                
                if (src && src.trim()) {
                    if (src.startsWith('http://') || src.startsWith('https://')) {
                        urls.add(src);
                    } else {
                        const nome = src.replace(/^\.\//, '').replace(/^\/+/, '');
                        REPOSITORIOS.forEach(repo => {
                            urls.add(`https://raw.githubusercontent.com/radiolojasjc-hub/${repo}/refs/heads/main/${nome}`);
                        });
                    }
                }
                
                const baseNome = src.replace(/\.[^.]+$/, '');
                const variacoes = [
                    baseNome,
                    baseNome.replace(/ /g, '_'),
                    baseNome.replace(/ /g, '-'),
                    baseNome.replace(/[^a-zA-Z0-9]/g, ''),
                    musica.title.replace(/[^a-zA-Z0-9 ]/g, '').trim().replace(/ /g, '_'),
                    musica.title.replace(/[^a-zA-Z0-9 ]/g, '').trim().replace(/ /g, '-'),
                    musica.title.replace(/[^a-zA-Z0-9]/g, '').trim(),
                    (musica.artist + '_' + musica.title).replace(/[^a-zA-Z0-9]/g, '_').replace(/_+/g, '_'),
                    (musica.artist + '-' + musica.title).replace(/[^a-zA-Z0-9]/g, '-').replace(/-+/g, '-')
                ];
                
                if (musica.artist) {
                    const artistClean = musica.artist.replace(/[^a-zA-Z0-9]/g, '').trim();
                    if (artistClean.length > 2) {
                        variacoes.push(artistClean);
                        variacoes.push(artistClean + '_' + musica.title.replace(/[^a-zA-Z0-9]/g, '').trim());
                    }
                }
                
                variacoes.forEach(nome => {
                    if (nome && nome.trim().length > 0) {
                        EXTENSOES.forEach(ext => {
                            const nomeLimpo = nome.trim().replace(/[^a-zA-Z0-9\-_]/g, '');
                            if (nomeLimpo.length > 0) {
                                REPOSITORIOS.forEach(repo => {
                                    urls.add(`https://raw.githubusercontent.com/radiolojasjc-hub/${repo}/refs/heads/main/${nomeLimpo}.${ext}`);
                                });
                            }
                        });
                    }
                });
                
                return Array.from(urls);
            }

            async function carregarPlaylistPorGenero(genero) {
                if (genero === 'RELIGIOSA') {
                    if (playlistCache['RELIGIOSA']) {
                        return playlistCache['RELIGIOSA'];
                    }
                    try {
                        const url = GENRE_URLS['RELIGIOSA'];
                        const response = await fetch(url);
                        if (response.ok) {
                            let data = await response.json();
                            if (Array.isArray(data) && data.length > 0) {
                                const lista = data.filter(m => m.src && m.src.trim() && m.title && m.title.trim());
                                lista.forEach(m => {
                                    m.id = m.id || `religiosa_${Math.random().toString(36).substr(2, 6)}`;
                                    m.genero = 'RELIGIOSA';
                                });
                                playlistCache['RELIGIOSA'] = lista;
                                return lista;
                            }
                        }
                    } catch (e) {}
                    const lista = PLAYLIST_RELIGIOSA_FALLBACK;
                    playlistCache['RELIGIOSA'] = lista;
                    showNotification(`🎵 RELIGIOSA (${lista.length} músicas - modo offline)`, 1500);
                    return lista;
                }

                const url = GENRE_URLS[genero];
                if (!url) {
                    showNotification(`⚠️ Gênero "${genero}" não possui URL`, 1500);
                    return null;
                }
                if (playlistCache[genero]) {
                    return playlistCache[genero];
                }
                try {
                    showLoading(true);
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`Erro HTTP ${response.status}`);
                    let data = await response.json();
                    if (!Array.isArray(data)) {
                        if (data.musicas && Array.isArray(data.musicas)) data = data.musicas;
                        else if (data.data && Array.isArray(data.data)) data = data.data;
                        else {
                            const vals = Object.values(data);
                            if (vals.length && Array.isArray(vals[0])) data = vals[0];
                            else throw new Error('Formato inválido');
                        }
                    }
                    const lista = data.filter(m => m.src && m.src.trim() && m.title && m.title.trim());
                    lista.forEach(m => {
                        m.id = m.id || `gen_${genero}_${Math.random().toString(36).substr(2, 6)}`;
                        m.genero = genero;
                    });
                    playlistCache[genero] = lista;
                    showLoading(false);
                    return lista;
                } catch (error) {
                    showLoading(false);
                    showNotification(`❌ Erro ao carregar ${genero}: ${error.message}`, 2000);
                    return null;
                }
            }
